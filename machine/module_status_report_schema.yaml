schema_id: forprint_module_status_report.v1
status: active_development
purpose: >-
  Мінімальний формат оперативного JSON-звіту модуля для Inspector і Blueprint.
required_top_level_fields:
  - module_id
  - generated_at
  - progress_summary
  - tests
  - integration_contracts
  - open_questions
progress_summary_fields:
  - core_logic
  - integration_readiness
  - documentation
  - confidence
tests_fields:
  - command
  - last_result
  - last_run_at
integration_contracts_fields:
  - provided
  - consumed
notes:
  - >-
    Це не аудит і не гарантія якості. Це короткий self-report, який допомагає
    Project Inspector і людині швидко зрозуміти поточний стан модуля.
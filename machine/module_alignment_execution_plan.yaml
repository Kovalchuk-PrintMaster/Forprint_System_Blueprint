alignment_execution_plan:
  status: active_manual_execution
  purpose: >-
    Визначає порядок ручного перенесення alignment prompts у модульні чати,
    отримання alignment reports і подальшого оновлення Blueprint.
  current_phase: first_alignment_wave
  execution_rule: >-
    Не запускати глибокий рефакторинг модулів до отримання alignment report.
    Спочатку зібрати стан, drift-ризики, contract gaps і відкриті питання.

  waves:
    - id: wave_1_core_direction
      title: Core direction alignment
      priority: critical
      goal: >-
        Вирівняти модулі, які найбільше впливають на загальну архітектуру:
        Calculator, CRM, Library, Integration Gateway, Operational Registry.
      modules:
        - module_id: calculator_engine
          prompt_id: 2026-05-22-align-calculator-engine-with-blueprint
          execution_priority: 1
          reason: >-
            Calculator Engine є ключовим для quote/order flow і майбутнього запуску
            Website, Telegram Bot та mobile_app.
          expected_decision_after_report: >-
            Визначити, що лишається всередині Calculator, а що має споживатися
            з Library або передаватися через Gateway/Registry.

        - module_id: forprint_crm
          prompt_id: 2026-05-22-align-crm-with-blueprint
          execution_priority: 2
          reason: >-
            CRM має бути бізнес-диригентом, але не має стати монолітом або
            фізичним власником усіх даних.
          expected_decision_after_report: >-
            Розділити CRM UI/workflow і Operational Registry як source of truth.

        - module_id: forprint_library
          prompt_id: 2026-05-22-align-library-with-blueprint
          execution_priority: 3
          reason: >-
            Library визначає канонічні довідники, каталоги, шаблони і contracts,
            від яких залежать Calculator, Prepress, Warehouse і CRM.
          expected_decision_after_report: >-
            Зафіксувати межу між canonical knowledge і operational data.

        - module_id: forprint_integration_gateway
          prompt_id: 2026-05-22-align-integration-gateway-with-blueprint
          execution_priority: 4
          reason: >-
            Gateway потрібен, щоб модулі не зшивалися напряму і щоб клієнтські
            канали були channel-agnostic.
          expected_decision_after_report: >-
            Визначити мінімальний request/response envelope і перші routing rules.

        - module_id: forprint_operational_registry
          prompt_id: 2026-05-22-align-operational-registry-with-blueprint
          execution_priority: 5
          reason: >-
            Operational Registry потрібен, щоб CRM не стала фізичним власником
            client/order/task/status.
          expected_decision_after_report: >-
            Визначити мінімальні canonical operational entities v1.

    - id: wave_2_active_support_modules
      title: Active support modules alignment
      priority: high
      goal: >-
        Вирівняти активні або вже розпочаті модулі, які залежать від core flow.
      modules:
        - module_id: telegram_bot
          prompt_id: 2026-05-22-align-telegram-bot-with-blueprint
          execution_priority: 6
          reason: >-
            Telegram Bot має багато прямого функціоналу і високий ризик стати
            god module.
          expected_decision_after_report: >-
            Визначити, які дії Bot має передавати через CRM/Gateway/Registry.

        - module_id: accounting_registry_service
          prompt_id: 2026-05-22-align-accounting-registry-with-blueprint
          execution_priority: 7
          reason: >-
            Accounting Registry уже в активній розробці і має правильно відділити
            accounting truth від operational truth.
          expected_decision_after_report: >-
            Уточнити boundary між Accounting Registry, Operational Registry і 1C.

        - module_id: forprint_prepress_hub
          prompt_id: 2026-05-22-align-prepress-hub-with-blueprint
          execution_priority: 8
          reason: >-
            Prepress Hub стартує як окремий сервіс і має з самого початку мати
            правильну file/job/status модель.
          expected_decision_after_report: >-
            Визначити prepress job model, file states і contracts.

    - id: wave_3_deferred_or_later_modules
      title: Deferred and later modules
      priority: medium_later
      goal: >-
        Тримати майбутні модулі в архітектурі, але не запускати активну розробку,
        доки не стабілізовано core flow.
      modules:
        - module_id: warehouse_service
          prompt_id: null
          execution_priority: later
          reason: >-
            Потрібен для material stock/reservation, але краще деталізувати після
            quote/order flow.
          expected_decision_after_report: keep_planned_until_calculator_and_registry_are_clear

        - module_id: logistics_service
          prompt_id: null
          execution_priority: later
          reason: >-
            Потрібен для delivery/shipping, але не є першим архітектурним ризиком.
          expected_decision_after_report: keep_planned

        - module_id: cloud_backup_manager
          prompt_id: null
          execution_priority: infrastructure_support
          reason: >-
            Корисний інфраструктурний сервіс, але не має впливати на бізнес-логіку.
          expected_decision_after_report: connect_later_via_backup_contracts

        - module_id: mobile_app
          prompt_id: null
          execution_priority: deferred_until_calculator_ready
          reason: >-
            Mobile App має бути врахований як future customer channel, але активна
            розробка стартує тільки після повноцінного запуску Calculator Engine.
          expected_decision_after_report: keep_as_future_channel_constraint_only

  next_manual_action:
    module_id: forprint_integration_gateway
    prompt_file: coordination/outgoing_prompts/forprint_integration_gateway/drafts/2026-05-22-align-integration-gateway-with-blueprint.md
    action: approve_next_core_alignment_prompt
    expected_response_location: coordination/incoming_requests/forprint_integration_gateway/new/
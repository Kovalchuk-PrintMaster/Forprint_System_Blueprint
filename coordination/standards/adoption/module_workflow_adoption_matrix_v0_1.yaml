schema_version: module_workflow_adoption_matrix_v0_1

metadata:
  title: Module Workflow Adoption Matrix
  owner: forprint_system_blueprint
  created_at: "2026-08-01"
  status: draft
  authority: reference_only
  source_standard:
    path: governance/module_workflow_command_architecture_v0_1.md
    version: v0_1
    relationship: approved_target_standard
    baseline_commit: 45b67706e7742136ab4a24d96e36c61545f3db69
    approval_evidence: coordination/internal_work/blueprint/governance/2026-08-01__blueprint__module_workflow_command_architecture_approval_v0_1.yaml
  purpose: >-
    Define repository-class command adoption rules for the complete ForPrint
    project while keeping current repository assessments separate from the
    architecture scope.

scope_model:
  project_id: forprint_project
  logical_project_root: forprint_project_root
  filesystem_root_is_scope_authority: false
  scope_authority:
    - blueprint_owned_module_registry
    - blueprint_approved_module_onboarding_record
  repository_membership_rule: >-
    Every current or future repository admitted as a ForPrint module through
    Blueprint-owned registration or onboarding metadata inherits the module
    command profile without requiring this standard or matrix to be rewritten.
  included_lifecycle_states:
    - planned
    - onboarding
    - active
    - paused
  excluded_repository_kinds:
    - temporary_worktree
    - local_tooling_checkout
    - archived_repository
    - experimental_repository_without_blueprint_admission
  default_for_newly_admitted_module:
    repository_class: module
    assessment_status: not_assessed
    target_conformance: unknown
    rollout_authorized: false
    command_profile: standard_module_workflow
  directory_boundary_note: >-
    A runtime directory may be used to locate repositories, but directory
    presence alone does not establish module identity because the project root
    may also contain temporary worktrees, tooling, archives, and experiments.

governance:
  architecture_approval:
    state: approved
    decision_record: coordination/internal_work/blueprint/governance/2026-08-01__blueprint__module_workflow_command_architecture_approval_v0_1.yaml
    implementation_authorized: false
    external_rollout_authorized: false
  implementation_migration: blueprint_internal_in_progress
  external_rollout: gated
  implementation_progress:
    state: blueprint_internal_in_progress
    scope: blueprint_repository_only
    evidence: coordination/internal_work/blueprint/governance/2026-08-01__blueprint__module_workflow_command_implementation_progress_v0_1.yaml
    completed_capabilities:
      - adoption_matrix_schema_and_semantics_validator
      - command_behavior_classification_validator
      - completion_intake_check
      - completion_acceptance_gate
      - blueprint_makefile_refactor
      - canonical_module_make_template_refactor
      - blueprint_command_applicability_registry
      - blueprint_command_implementation_inventory
      - blueprint_self_audit_execution
      - blueprint_command_applicability_canonical_gate
      - blueprint_outgoing_prompt_workflow_core
      - blueprint_prompt_workflow_operator_commands
      - blueprint_prompt_workflow_release_policy_gate
      - blueprint_prompt_workflow_governance_closeout
    prompt_workflow_state: implemented_gated
    prompt_workflow_evidence: coordination/internal_work/blueprint/governance/2026-08-03__blueprint__prompt_workflow_governance_closeout_v0_1.yaml
    next_required_step: blueprint_operational_readiness_review
  external_module_prompts_released: false
  cross_repository_writes_forbidden: true
  module_completion_is_blueprint_acceptance: false
  publication_is_merge: false
  live_worktree_double_apply_forbidden: true
  unlisted_module_is_out_of_scope: false
  assessment_snapshot_is_exhaustive: false
  read_only_command_terms:
    - check
    - validate
    - preview
    - status
    - show
    - list
  explicit_mutation_terms:
    - prepare
    - release
    - apply
    - finish
    - publish
    - accept
    - return
    - update
    - fix

command_contract_defaults:
  read_only:
    tracked_writes: false
    untracked_repository_writes: false
    git_index_or_ref_writes: false
    cross_repository_writes: false
    allowed_output:
      - stdout
      - stderr
      - temporary_storage_outside_repository
  mutating:
    repository_scope_must_be_explicit: true
    cross_repository_writes: false
    hidden_apply_forbidden: true
  publication:
    merge_allowed: false
    protected_branch_merge_allowed: false

repository_class_profiles:
  blueprint_workflow:
    repository_class: blueprint
    commands:
      - prompt-prepare
      - prompt-release
      - prompt-status
      - completion-intake-preview
      - completion-intake-check
      - completion-accept
      - completion-return

  standard_module_workflow:
    repository_class: module
    commands:
      - module-start
      - module-sync
      - module-status
      - module-validate
      - module-finish
      - module-publish
      - completion-packet-validate
      - completion-packet-check
      - completion-packet-preview
      - completion-packet-apply
      - completion-packet-idempotency-check

command_catalog:
  - command_id: prompt-prepare
    owner_repository_class: blueprint
    command_class: blueprint_prompt_mutation
    mutability: mutating
    repository_write_scope: blueprint_only
    git_behavior: none
    target_state_change: draft_to_prepared

  - command_id: prompt-release
    owner_repository_class: blueprint
    command_class: blueprint_prompt_mutation
    mutability: mutating
    repository_write_scope: blueprint_only
    git_behavior: none
    target_state_change: prepared_to_released

  - command_id: prompt-status
    owner_repository_class: blueprint
    command_class: navigation
    mutability: read_only
    repository_write_scope: none
    git_behavior: none
    target_state_change: none

  - command_id: module-start
    owner_repository_class: module
    command_class: module_local_mutation
    mutability: mutating
    repository_write_scope: module_only
    git_behavior: none
    target_state_change: released_to_in_progress

  - command_id: module-sync
    owner_repository_class: module
    command_class: module_local_mutation
    mutability: mutating
    repository_write_scope: module_only
    git_behavior: none
    target_state_change: module_awareness_refresh

  - command_id: module-status
    owner_repository_class: module
    command_class: navigation
    mutability: read_only
    repository_write_scope: none
    git_behavior: none
    target_state_change: none

  - command_id: module-validate
    owner_repository_class: module
    command_class: validation
    mutability: read_only
    repository_write_scope: none
    git_behavior: none
    target_state_change: none

  - command_id: module-finish
    owner_repository_class: module
    command_class: module_local_mutation
    mutability: mutating
    repository_write_scope: module_only
    git_behavior: no_commit_no_push_no_merge
    target_state_change: in_progress_to_completed_in_module

  - command_id: module-publish
    owner_repository_class: module
    command_class: publication
    mutability: mutating
    repository_write_scope: module_only
    git_behavior: commit_and_push_current_branch_no_merge
    target_state_change: completed_in_module_to_published_by_module

  - command_id: completion-packet-validate
    owner_repository_class: module
    command_class: validation
    mutability: read_only
    repository_write_scope: none
    git_behavior: none
    target_state_change: none

  - command_id: completion-packet-check
    owner_repository_class: module
    command_class: evidence_and_lineage_check
    mutability: read_only
    repository_write_scope: none
    git_behavior: none
    target_state_change: none
    apply_invocation_allowed: false

  - command_id: completion-packet-preview
    owner_repository_class: module
    command_class: preview
    mutability: read_only
    repository_write_scope: none
    git_behavior: none
    target_state_change: none

  - command_id: completion-packet-apply
    owner_repository_class: module
    command_class: module_local_mutation
    mutability: mutating
    repository_write_scope: module_only
    git_behavior: no_commit_no_push_no_merge
    target_state_change: completion_state_apply

  - command_id: completion-packet-idempotency-check
    owner_repository_class: module
    command_class: validation
    mutability: read_only
    repository_write_scope: isolated_sandbox_only
    git_behavior: none
    target_state_change: none
    live_worktree_apply_allowed: false

  - command_id: completion-intake-preview
    owner_repository_class: blueprint
    command_class: preview
    mutability: read_only
    repository_write_scope: none
    git_behavior: none
    target_state_change: none

  - command_id: completion-intake-check
    owner_repository_class: blueprint
    command_class: independent_validation
    mutability: read_only
    repository_write_scope: none
    git_behavior: none
    target_state_change: none
    module_executable_invocation_allowed: false

  - command_id: completion-accept
    owner_repository_class: blueprint
    command_class: blueprint_decision_mutation
    mutability: mutating
    repository_write_scope: blueprint_only
    git_behavior: no_commit_no_push_no_merge
    target_state_change: received_pending_review_to_accepted_by_blueprint

  - command_id: completion-return
    owner_repository_class: blueprint
    command_class: blueprint_decision_mutation
    mutability: mutating
    repository_write_scope: blueprint_only
    git_behavior: no_commit_no_push_no_merge
    target_state_change: received_pending_review_to_returned_for_fix

publication_evidence:
  pre_publication:
    remote_containment: PENDING_PUBLICATION
    push_status: PENDING_PUBLICATION
    pending_is_success: false
    pending_is_validation_failure: false
  post_publication:
    remote_containment_must_be_verified: true
    push_status_must_be_verified: true
    tracked_packet_rewrite_for_new_commit_hash: forbidden
  preferred_remote_check:
    command_family: git_ls_remote
    local_remote_tracking_ref_update: false

pilot_reference:
  repository_id: logistics_service
  role: current_reference_pilot
  scope_effect: none
  permanent_architecture_dependency: false
  rationale: >-
    Logistics currently provides the most complete observable workflow for
    validating the target architecture. Its selection as a pilot does not
    restrict the standard to Logistics or to any fixed set of modules.
  reference_branch: feature/logistics-tracking-events-contract-v01
  reference_commit: 2b7261038110c77295c13e49012e5d393f48a0e7
  known_deviations:
    - deviation_id: mutating_completion_packet_check
      severity: blocker
      current_behavior: validate_then_apply_then_apply_again
      target_behavior: read_only_evidence_and_lineage_check
    - deviation_id: live_worktree_double_apply
      severity: blocker
      current_behavior: idempotency_mutates_live_module_state_twice
      target_behavior: isolated_sandbox_idempotency_check
    - deviation_id: blueprint_executable_dependency
      severity: major
      current_behavior: coordination_check_may_execute_blueprint_checker
      target_behavior: module_owned_coordination_validator
    - deviation_id: completion_publication_separation
      severity: major
      current_behavior: responsibilities_not_fully_separated
      target_behavior: module_finish_then_module_publish

assessment_snapshot:
  snapshot_date: "2026-08-01"
  coverage: partial
  exhaustive: false
  omission_means_out_of_scope: false
  default_for_unlisted_admitted_module:
    assessment_status: not_assessed
    target_conformance: unknown
    rollout_authorized: false
  repositories:
    - repository_id: forprint_system_blueprint
      repository_class: blueprint
      assessment_status: partially_assessed
      target_conformance: implementation_in_progress
      rollout_authorized: false
      command_profile: blueprint_workflow
      verified_foundations:
        - validation_baseline_is_fresh_worktree_portable
        - tracked_registry_report_is_checkout_path_independent
        - command_architecture_is_approved_target_standard
        - adoption_matrix_schema_and_semantics_validator_implemented
        - command_behavior_classification_validator_implemented
        - completion_intake_check_implemented
        - completion_acceptance_gate_implemented
        - blueprint_makefile_refactor_completed
        - canonical_module_make_template_refactor_completed
        - blueprint_command_applicability_registry_completed
        - blueprint_command_implementation_inventory_completed
        - blueprint_self_audit_completed_with_unknowns
        - blueprint_command_applicability_canonical_gate_integrated
        - blueprint_outgoing_prompt_workflow_core_implemented
        - blueprint_prompt_prepare_operator_command_implemented
        - blueprint_prompt_release_operator_command_implemented_gated
        - module_template_prompt_mutation_boundary_enforced
        - prompt_workflow_governance_closeout_recorded
      known_gaps:
        - metadata_consistency_not_verified
        - module_identity_not_reconciled
        - artifact_authority_and_retention_not_enforced
        - write_flow_recovery_not_fully_verified
        - blueprint_operational_readiness_review_not_completed
        - reference_pilot_migration_not_authorized
      next_required_step: blueprint_operational_readiness_review
      evidence:
        branch: governance/module-workflow-command-architecture-v01
        architecture_baseline_commit: ed20997c0fa22774474dd1e09ea16900d6642a98
        portability_commit: f412bb7c935784bd86c45e5d83613dc8da39f4d0
        architecture_approval_commit: 6bfd2daaf9b612026087a151ae5886a1c540dc23
        adoption_validator_commit: 77633316e41b547b6fdcf26f18d4a25788950329
        completion_intake_check_commit: fea24ac4cea8eb0c9f0fe263bf58676386114503
        acceptance_gate_commit: c6a5a51c30f227a6cd61e5bfe96b207f9acda27a
        make_workflow_contract_refactor_commit: 1c82c929d8608187b52b73d80c651760884d8a58
        command_applicability_commit: 2f89443be1a5b9893d666eed7baa696c17c0b904
        implementation_progress_evidence: coordination/internal_work/blueprint/governance/2026-08-01__blueprint__module_workflow_command_implementation_progress_v0_1.yaml
        make_workflow_refactor_evidence: coordination/internal_work/blueprint/governance/2026-08-02__blueprint__make_workflow_contract_refactor_completion_v0_1.yaml
        command_applicability_registry: coordination/standards/adoption/blueprint_command_applicability_v0_1.yaml
        command_applicability_inventory_evidence: coordination/internal_work/blueprint/governance/2026-08-02__blueprint__command_applicability_inventory_v0_1.yaml
        blueprint_self_audit_evidence: coordination/internal_work/blueprint/governance/2026-08-02__blueprint__self_audit_completion_v0_1.yaml
        command_applicability_canonical_gate_evidence: coordination/internal_work/blueprint/governance/2026-08-02__blueprint__command_applicability_canonical_gate_integration_v0_1.yaml
        prompt_workflow_core_commit: 51cc478add62cdadf853e95eef2f4874767b33ec
        prompt_workflow_operator_integration_commit: bf93e7d29739c58d5e36c0b53b1300094f73fb1d
        prompt_workflow_operator_integration_evidence: coordination/internal_work/blueprint/governance/2026-08-02__blueprint__prompt_workflow_operator_integration_v0_1.yaml
        prompt_workflow_governance_closeout_evidence: coordination/internal_work/blueprint/governance/2026-08-03__blueprint__prompt_workflow_governance_closeout_v0_1.yaml

    - repository_id: logistics_service
      repository_class: module
      assessment_status: known_deviations
      target_conformance: blocked
      rollout_authorized: false
      command_profile: standard_module_workflow
      next_required_step: >-
        await explicit pilot authorization after Blueprint operational
        readiness review is GREEN

    - repository_id: telegram_bot
      repository_class: module
      assessment_status: not_assessed
      target_conformance: unknown
      rollout_authorized: false
      command_profile: standard_module_workflow
      next_required_step: assess_in_registered_module_batch

    - repository_id: forprint_library
      repository_class: module
      assessment_status: not_assessed
      target_conformance: unknown
      rollout_authorized: false
      command_profile: standard_module_workflow
      next_required_step: assess_in_registered_module_batch

migration_sequence:
  - step: 1
    action: approve_command_architecture
    status: completed
    owner: forprint_system_blueprint
    depends_on: []
    rollout_effect: none
  - step: 2
    action: validate_adoption_matrix_schema_and_semantics
    status: completed
    owner: forprint_system_blueprint
    depends_on: [approve_command_architecture]
    rollout_effect: none
  - step: 3
    action: add_command_behavior_classification_validator
    status: completed
    owner: forprint_system_blueprint
    depends_on: [validate_adoption_matrix_schema_and_semantics]
    rollout_effect: none
  - step: 4
    action: implement_completion_intake_check
    status: completed
    owner: forprint_system_blueprint
    depends_on: [add_command_behavior_classification_validator]
    rollout_effect: none
  - step: 5
    action: refactor_blueprint_makefile_and_canonical_module_template
    status: completed
    owner: forprint_system_blueprint
    depends_on: [implement_completion_intake_check]
    rollout_effect: blueprint_internal_and_template_reference_only
  - step: 6
    action: blueprint_operational_readiness_review
    status: pending
    owner: forprint_system_blueprint
    depends_on: [refactor_blueprint_makefile_and_canonical_module_template]
    rollout_effect: none
  - step: 7
    action: authorize_reference_pilot_migration
    status: not_authorized
    owner: forprint_system_blueprint
    depends_on: [blueprint_operational_readiness_review]
    rollout_effect: none
  - step: 8
    action: migrate_reference_pilot_completion_check
    status: blocked
    owner: selected_reference_module
    depends_on: [authorize_reference_pilot_migration]
    rollout_effect: reference_pilot_only
  - step: 9
    action: add_reference_pilot_completion_preview
    status: blocked
    owner: selected_reference_module
    depends_on: [migrate_reference_pilot_completion_check]
    rollout_effect: reference_pilot_only
  - step: 10
    action: add_reference_pilot_sandbox_idempotency_check
    status: blocked
    owner: selected_reference_module
    depends_on: [add_reference_pilot_completion_preview]
    rollout_effect: reference_pilot_only
  - step: 11
    action: add_reference_pilot_owned_coordination_validator
    status: blocked
    owner: selected_reference_module
    depends_on: [add_reference_pilot_sandbox_idempotency_check]
    rollout_effect: reference_pilot_only
  - step: 12
    action: validate_reference_pilot_conformance
    status: blocked
    owner: forprint_system_blueprint
    depends_on: [add_reference_pilot_owned_coordination_validator]
    rollout_effect: none
  - step: 13
    action: assess_remaining_registered_modules_in_controlled_batches
    status: blocked
    owner: forprint_system_blueprint
    depends_on: [validate_reference_pilot_conformance]
    rollout_effect: controlled_batches_only
  - step: 14
    action: authorize_external_rollout
    status: not_authorized
    owner: forprint_system_blueprint
    depends_on: [assess_remaining_registered_modules_in_controlled_batches]
    rollout_effect: none

validation_requirements:
  schema_validator_required: true
  command_id_uniqueness_required: true
  repository_class_profile_validation_required: true
  all_profile_commands_must_exist_in_catalog: true
  all_snapshot_profiles_must_exist: true
  unlisted_admitted_modules_must_inherit_default_profile: true
  filesystem_directory_presence_must_not_define_scope: true
  read_only_commands_must_have_zero_repository_writes: true
  mutating_commands_must_define_repository_scope: true
  cross_repository_writes_must_be_false: true
  module_finish_must_not_publish: true
  module_publish_must_not_merge: true
  completion_check_must_not_apply: true
  idempotency_check_must_not_mutate_live_worktree: true
  blueprint_intake_check_must_be_blueprint_owned: true
  external_rollout_must_remain_gated_until_operational_readiness_green: true

result:
  matrix_state: generalized_draft_ready_for_validation_implementation
  architecture_state: approved_target_standard
  assessment_coverage: partial
  future_module_inheritance: automatic
  external_rollout: gated

schema_version: execution_blocker_taxonomy_contract_v0_1
metadata:
  standard_id: execution_blocker_taxonomy_v0_1
  owner: forprint_system_blueprint
  status: active_standard
  adoption_mode: prompt_or_directive_required
  hardening_slice: Q3
  stable_id: blueprint_v0_4_1_execution_blocker_taxonomy_v0_1
purpose: Define execution blocker vocabulary and scope blocking without conflating conditions, executor evidence or governance
  dispositions.
inherits:
  q1_contract_path: coordination/standards/governance/clarification_question_lifecycle_v0_1.yaml
  q1_contract_sha256: b6ac925638194422ace541943418cd822c33c28e5dc7aace8a3660fd167f75f5
  q2_contract_path: coordination/standards/governance/bounded_clarification_and_escalation_v0_1.yaml
  q2_contract_sha256: 0e1b2c98e8c7d42291e7c4120ff7d2c1c214300083757731fc90ebe134a17c7d
semantic_separation:
  coordination_conditions:
  - clarification_required
  - execution_blocked
  executor_outcomes:
  - unable_to_execute
  governance_dispositions:
  - RETURN
  - HOLD
  conditions_are_prompt_dispositions: false
  unable_to_execute_is_prompt_disposition: false
  automatic_condition_to_return_hold: false
  released_prompt_mutation_allowed: false
reason_taxonomy:
  canonical_reason_codes:
  - missing_input
  - ambiguous_requirement
  - access_required
  - credential_or_token_expired
  - external_resource_unavailable
  - dependency_contract_missing
  - dependency_module_blocked
  - provider_api_unavailable
  - environment_failure
  - policy_conflict
  - unsupported_capability
  - security_boundary
  - manual_decision_required
  reason_code_is_prompt_disposition: false
  unknown_reason_allowed: false
  definitions:
    missing_input: Required input, artifact, value or evidence reference is unavailable.
    ambiguous_requirement: Authoritative material permits materially different interpretations.
    access_required: Required authorized access is not currently available.
    credential_or_token_expired: Required authentication material is expired or unusable.
    external_resource_unavailable: Required external resource is unavailable outside immediate module control.
    dependency_contract_missing: Required dependency interface, schema or contract is absent or insufficient.
    dependency_module_blocked: Required dependency module cannot currently supply the needed capability or fact.
    provider_api_unavailable: Required external provider API or service is unavailable.
    environment_failure: Declared development/runtime/tooling environment cannot perform the work safely.
    policy_conflict: Applicable authoritative policies conflict or requested execution would violate policy.
    unsupported_capability: Current module, executor or toolchain lacks a required capability.
    security_boundary: Required action crosses an unauthorized security, credential or privilege boundary.
    manual_decision_required: Progress requires a semantic or exception decision reserved to operator/Blueprint authority.
blocker_record:
  required_fields:
  - blocker_id
  - module_id
  - prompt_id
  - roadmap_step_id
  - condition
  - reason_code
  - blocking
  - affected_scope_refs
  - summary
  - evidence_refs
  - created_at
  optional_fields:
  - execution_id
  - related_question_id
  condition_values:
  - clarification_required
  - execution_blocked
  affected_scope_refs_min_items: 1
  evidence_refs_required: true
  secret_values_allowed: false
  secret_references_allowed: true
  future_event_envelope_owner: Q5
blocking_semantics:
  execution_blocked_requires_blocking_true: true
  clarification_required_may_be_blocking_or_nonblocking: true
  blocking_applies_only_to_declared_affected_scope: true
  whole_prompt_block_requires_explicit_whole_prompt_scope: true
  independent_work_may_continue_when_contract_allows: true
  active_blocker_mutates_released_prompt: false
  active_blocker_implies_return: false
  active_blocker_implies_hold: false
  resolution_requires_evidence: true
  reason_code_preserved_after_resolution: true
unable_to_execute_evidence:
  is_executor_evidence: true
  is_blueprint_decision: false
  automatically_returns_prompt: false
  automatically_holds_prompt: false
  required_fields:
  - report_id
  - module_id
  - prompt_id
  - roadmap_step_id
  - execution_id
  - reason_code
  - affected_scope_refs
  - summary
  - attempted_or_verified
  - evidence_refs
  - safe_next_options
  - created_at
  safe_next_options_are_advisory: true
  secret_values_allowed: false
q2_bridge:
  q2_question_thread_remains_authoritative: true
  q3_may_rewrite_q2_question_history: false
  escalated_blocking_question_may_project_execution_blocked: true
  projection_requires_explicit_q3_reason: true
  projection_does_not_return_or_hold_prompt: true
deferred_boundaries:
  Q4_operator_decision_adjustment_model: true
  Q5_common_event_envelope: true
  Q6_operator_attention_semantics: true
  Q7_cross_module_routing_mechanics: true
  Q8_logistics_reference_validation: true
current_capabilities:
  live_sqlite_runtime: false
  database_file_created_by_q3: false
  daemon: false
  systemd: false
  telegram_transport: false
  autonomous_execution: false
  automatic_module_business_acceptance: false
  automatic_return_hold: false
  cross_repository_writes: false
  business_prompt_release: false
acceptance:
  semantic_families_distinct: true
  reason_taxonomy_exact: true
  execution_blocked_is_scope_bound: true
  blocker_evidence_required: true
  unable_to_execute_is_evidence_only: true
  return_hold_not_implied: true
  released_prompt_immutable: true
  q2_bridge_preserves_question_history: true
  q4_q8_deferred: true
  runtime_disabled: true

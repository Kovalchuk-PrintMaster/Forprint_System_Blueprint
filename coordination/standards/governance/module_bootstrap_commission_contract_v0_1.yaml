schema_version: forprint_module_bootstrap_commission_contract_v0_1
contract_id: module_bootstrap_commission_contract_v0_1
status: active_standard
owner: forprint_system_blueprint
package_class: MODULE_BOOTSTRAP_COMMISSION
purpose: Cold-start commissioning package for a new module/candidate before module-owned continuity exists.
distinct_from:
  MODULE_ONBOARD: generated by an initialized module for fresh-assistant module onboarding
  MODULE_CONTEXT: generated by an initialized module for bounded topic/context transfer
authority:
  archive_creates_execution_authority: false
  archive_creates_acceptance_authority: false
  archive_creates_release_authority: false
  archive_creates_blueprint_write_authority: false
  archive_creates_cross_repository_write_authority: false
  external_authority_may_be_recorded: true
classification_gate:
  required_before_repository_creation: true
  allowed:
  - EXISTING_REGISTERED_MODULE
  - NEW_TOP_LEVEL_MODULE_CANDIDATE
  - EXPERIMENTAL_CAPABILITY_INSIDE_EXISTING_MODULE
  - HELPER_OR_LAB_NOT_YET_A_MODULE
  new_repository_rule: do_not_create_new_repo_for_experiment_or_helper_when_existing_owner_boundary_fits
required_package_members:
- 00_READ_FIRST.md
- bootstrap_commission.yaml
- PACKAGE_MANIFEST.yaml
- evidence_index.yaml
- acceptance/root_surface_review.yaml
- acceptance/cold_start_acceptance.yaml
- BLUEPRINT_COMMITTED_REFERENCE/
- TEMPLATES/
- TOOLS_REFERENCE/
- PRECEDENT_SUMMARIES/
source_policy:
  blueprint_source: committed_HEAD_blobs
  critical_source_hashes_required: true
  head_upstream_sync_required: true
  dirty_worktree_files_are_not_packaged_as_canonical: true
  live_reconciliation_required_before_first_canonical_module_write: true
clean_root:
  policy: clean_repository_root_policy_v0_1
  canonical_module_manifest_default: coordination/module/manifest.yaml
  root_manifest_compatibility_copy_forbidden: true
question_minimization:
  target: zero_routine_follow_up_questions
  ask_human_only_for:
  - irreducible_business_intent
  - credentials_or_access
  - destructive_history_conflict
  - genuine_architecture_or_ownership_decision
  - authorization_to_leave_bootstrap_scope
completion_states:
- ZERO_STATE
- CLASSIFIED
- REPOSITORY_ESTABLISHED
- FOUNDATION_REMOTE_CONTAINED
- CONTINUITY_COMMISSIONED
- SELF_ONBOARD_VERIFIED
- READY_FOR_GOVERNED_MODULE_WORK
bootstrap_complete_when: SELF_ONBOARD_VERIFIED_and_separately_authorized_for_next_scope

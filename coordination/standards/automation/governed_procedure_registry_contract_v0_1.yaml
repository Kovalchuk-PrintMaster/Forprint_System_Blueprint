schema_version: forprint_governed_procedure_registry_contract_v0_1
contract_id: governed_procedure_registry_contract
revision: 0.1.0
status: ACTIVE_CF07_FIRST_SLICE
procedure_identity:
  required_fields:
  - procedure_id
  - procedure_revision
  - graph_sha256
  - status
  revision_is_immutable_identity_component: true
  graph_sha256_required: true
capability_classification:
  required_fields:
  - capability_id
  - classification
  - reason
  allowed_classifications:
  - GRAPH_REQUIRED
  - NOT_REQUIRED
  reason_must_be_nonempty: true
registry_rules:
  duplicate_procedure_revision_forbidden: true
  silent_graph_replacement_forbidden: true
  unregistered_procedure_source_forbidden: true
  NOT_REQUIRED_must_still_respect_authority: true
initial_registry:
  procedures: []
  capabilities:
  - capability_id: governed_canonical_mutation
    classification: GRAPH_REQUIRED
    reason: Canonical mutation has ordered gates, evidence and derived-refresh obligations.
  - capability_id: read_only_non_authoritative_inventory
    classification: NOT_REQUIRED
    reason: Pure read-only inventory does not mutate canonical or execution state; higher authority constraints still
      apply.

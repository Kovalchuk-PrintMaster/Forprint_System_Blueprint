schema_version: forprint_execution_attempt_writer_deployment_coverage_contract_v0_1
purpose: technical_evidence_for_independently_reviewed_writer_deployment
status: DUAL_RELEASE_CANDIDATE_NON_AUTHORIZING
extends: forprint_execution_attempt_writer_activation_contract_v0_1
gate_publication:
  remote: git@github.com:Kovalchuk-PrintMaster/Forprint_System_Blueprint.git
  ref: refs/heads/cf10/writer-coverage-dual-release-v0-3
  commit: published_remote_ref_must_match_gate_checkout_HEAD
  source_verification: exact_git_tree_blobs_for_gate_CLI_contract_tests_WorkFront_Makefile
  independently_attested_sha_required: true
writer_release:
  supplied_via: COVERAGE_WRITER_RELEASE_ROOT
  must_be_separate_checkout: true
  immutable_commit: 628dd60542c9eefce9db001086ff80fd848e182d
  source_verification: gate_SOURCE_pins_plus_required_writer_entrypoint_git_blobs
publication_pins:
  commit: 628dd60542c9eefce9db001086ff80fd848e182d
  remote: git@github.com:Kovalchuk-PrintMaster/Forprint_System_Blueprint.git
  ref: refs/heads/cf10/closeout-writer-activation-v0-1
required_writer_entrypoints:
  - scripts/coordination/control_plane/governed_worker_cycle.py
  - scripts/coordination/control_plane/dispatch_intent.py
  - scripts/coordination/execution_attempt_ledger_v0_1.py
cli:
  module: scripts.coordination.execution_attempt_writer_coverage_v0_1
  commands:
    plan: shared-ledger-writer-coverage-plan
    check: shared-ledger-writer-coverage-check
    verify: shared-ledger-writer-coverage-verify
technical_evidence:
  schema_version: forprint_execution_attempt_writer_deployment_evidence_v0_2
  destination: project_tmp_only
  write_policy: create_only
  output_status: READY_FOR_INDEPENDENT_REVIEW_or_BLOCKED
  sources:
    - pinned_published_ref_and_blob_sha256
    - static_append_record_callsite_candidates
    - host_process_cmdline_observation
    - system_cron_and_systemd_filesystem_observation

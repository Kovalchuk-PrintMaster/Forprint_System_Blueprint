  dynamic_and_external_writers_still_require_review: true
external_attestation:
  path: /etc/forprint/execution_attempt_writer_activation/writer_coverage_v0_1.json
  trusted_root_owned_readback: true
  required_technical_evidence_sha256_binding: true
  required_gate_publication_commit_remote_ref_binding: true
  required_writer_publication_commit_remote_ref_binding: true
  independently_verified_coverage_flags_required: true
  independent_operator_review_ref_required: true
  readback_grants_activation: false
forbidden:
  - implicit_writer_release_root_or_local_HEAD_fallback
  - accepting_unpublished_gate_checkout_as_trusted
  - accepting_legacy_v0_1_evidence_as_dual_release
  - self_certification_as_VERIFIED
  - system_config_or_lock_provisioning
  - signing_or_generation_of_trust_root
  - automatic_drain_restart_or_worker_launch
  - writing_execution_attempt_ledger
  - git_add_commit_push_merge_or_reset
  - canonical_closeout_apply
boundaries:
  technical_review_ready_is_not_coverage_verified: true
  unknown_processes_or_schedulers_do_not_imply_absence: true
  no_a042_authorization: true
  b4_closeout_authority_independent: true

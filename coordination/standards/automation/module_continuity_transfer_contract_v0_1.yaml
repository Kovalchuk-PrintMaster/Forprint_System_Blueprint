schema_version: forprint_module_continuity_transfer_contract_v0_1
status: active_reference_contract
authority: none
contract_id: module_continuity_transfer_reference_v0_1
purpose: 'Define the authority-neutral module profile and portability requirements
  for reusing the accepted continuity event store, lifecycle enforcement, generated
  projections, and deterministic zero-context handoff across ForPrint module repositories.

  '
mutation_authority_conferred: false
release_authority_conferred: false
worker_dispatch_authority_conferred: false
foreign_repository_write_authority_conferred: false
required_profile_fields:
- module_id
- module_root
- event_root
- projection_root
- bootstrap_index
- mission_source
- source_state_mode
- authority_scope
source_state_modes:
- working_tree
- git_tracked
authority_scope_rules:
  default: read_and_local_bounded_continuity_only
  foreign_repository_write: forbidden_without_explicit_external_authority
  worker_dispatch: false
  release: false
portable_surfaces:
- id: immutable_event_store
  root_configurable: true
  append_only: true
  accepted_event_history_immutable: true
- id: lifecycle_enforcement
  root_configurable: true
  states:
  - PLANNED
  - ACTIVE
  - CHECKPOINTED
  - VALIDATED
  - CLOSED
  forbidden_transition:
  - ACTIVE->CLOSED
- id: generated_projections
  root_configurable: true
  authority: none
  generated_only: true
- id: deterministic_zero_context_handoff
  root_configurable: true
  authority: none
  deterministic_archive_required: true
reference_fixture_classes:
- id: catalog_topology
  purpose: flat_catalog_semantic_module
- id: warehouse_topology
  purpose: nested_operational_module
reference_acceptance:
  sterile_fixture_runtime: pytest_tmp_path_or_ephemeral_tempdir_only
  accepted_core_source_modification_required: false
  invalid_transition_event_appended: false
  invalid_transition_source_mutation_performed: false
  deterministic_handoff_byte_identity_required: true
  blueprint_specific_paths_in_this_contract: 0

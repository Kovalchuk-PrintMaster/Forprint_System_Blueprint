schema_version: module_development_roadmap_v0_1
module: telegram_bot

metadata:
  module: telegram_bot
  module_working_name: ForPrint Telegram Bot
  current_step_id: telegram_bot_sqlite_conversation_state_v0_1
  roadmap_version: telegram_bot_order_intake_stabilization_v0_2
  updated_at: "2026-07-08"
  repository_root: /srv/software_development/forprint-project/telegram_bot
  implementation_type: channel_runtime_intake_assistant
  current_stage: ORDER intake assistant stabilization
  purpose: >
    Control Telegram Bot development as a Tier 1 client communication channel
    and intake assistant. Telegram Bot may collect channel-local context,
    temporary drafts and handoff previews, but must not become the canonical
    owner of clients, orders, products, prices, payments, stock, production
    statuses, accounting documents or 1C data.
  strategic_boundary:
    role: tier_1_client_communication_channel
    future_flow: Telegram Bot -> Integration Gateway -> approved downstream module
    owns:
      - telegram profiles and identifiers
      - conversation sessions
      - conversation states
      - phrase bank
      - temporary intake drafts
      - handoff preview and outbox
      - channel-local audit events
      - ProductClassifier route hints as local channel hints
    forbidden_ownership:
      - canonical clients
      - canonical orders
      - product registry
      - price calculation
      - payments
      - stock
      - production registry
      - accounting / 1C
      - vendor execution
      - contractor execution
    global_rules:
      - Do not create canonical orders from Telegram Bot.
      - Do not write to Supabase canonical orders.
      - Do not write to Operational Registry from this stage.
      - Do not write to Integration Gateway from this stage.
      - Do not write to 1C.
      - Do not call Calculator Engine from this stage.
      - Keep local runtime SQLite data channel-local and non-canonical.
      - Report completion only inside the Telegram Bot repository.


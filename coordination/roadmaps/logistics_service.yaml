schema_version: module_development_roadmap_v0_1
module: logistics_service
metadata:
  module: logistics_service
  module_working_name: ForPrint Logistics Service
  current_step_id: logistics_service_test_address_book_v0_1
  roadmap_version: logistics_service_foundation_v0_1
  updated_at: '2026-07-14'
  repository_root: /srv/software_development/forprint-project/forprint_logistics_service
  implementation_type: operational_integration_service
  current_stage: logistics service foundation
  purpose: 'Establish Logistics Service as the owner of delivery provider boundaries, shipment drafts,
    tracking truth, provider payloads, logistics address book and logistics event history for ForPrint
    operational workflows.

    '
  strategic_boundary:
    role: logistics_provider_and_delivery_truth_owner
    future_flow: 'Telegram Bot / Website / CRM / Calculator -> Integration Gateway or approved internal
      contract -> Logistics Service -> provider adapter -> delivery provider API

      '
    owns:
    - logistics providers catalog
    - provider adapter boundaries
    - logistics address book / recipient references
    - shipment drafts
    - shipment requests
    - shipment payload previews
    - tracking requests
    - tracking events
    - logistics notification events
    - provider response snapshots
    - logistics audit trail
    forbidden_ownership:
    - canonical product catalog
    - canonical order ownership
    - canonical client/account ownership
    - accounting truth
    - payment truth
    - warehouse stock truth
    - production task ownership
    - Telegram conversation state
    - Website session state
    global_rules:
    - Do not create canonical orders.
    - Do not own product or material catalog.
    - Do not own accounting documents.
    - Do not own payment statuses.
    - Do not mutate warehouse stock.
    - Do not write to 1C.
    - Do not perform live provider writes by default.
    - Keep live shipment creation disabled until an explicit controlled prompt.
    - Keep provider credentials outside git.
    - Report completion only inside the Logistics Service repository.
  strategic_direction:
    initial_provider_policy: 'Start with provider-neutral local models and dry-run payload previews. Nova
      Poshta may be the first real provider adapter later, but bootstrap must not hard-code the whole
      service around one provider.

      '
    test_data_policy: 'A small local test address book may be created for 10-15 frequent recipients, but
      it is non-canonical and exists only to test logistics flows until a canonical client/account owner
      is ready.

      '
    telegram_bot_policy: 'Telegram Bot may become a channel UI and notification surface for logistics
      workflows, but it must not own shipment truth, provider credentials, logistics address book or provider
      API integrations.

      '

schema_version: module_development_roadmap_v0_1
module: website

metadata:
  module: website
  module_working_name: ForPrint_Web_Site_Base
  roadmap_version: website_roadmap_legacy_control_refinement_v0_2_1
  current_step_id: website_scaffolding_first_safe_commit_v0_4
  updated_at: "2026-07-07"
  repository_root: /srv/software_development/forprint-project/forprint_website
  base_directory: /srv/software_development/forprint-project/forprint_website/base
  implementation_type: inherited_legacy_php_tutorial_shop_base
  public_launch_status: blocked_until_limited_public_launch_gate
  purpose: >
    Control the inherited PHP website base from launch-readiness inspection toward
    a limited public lead-capture launch gate. The website remains a public channel
    only and must not become canonical owner of products, clients, orders, payments,
    stock, accounting, pricing rules, production statuses, or 1C data.
  strategic_boundary:
    role: public_channel_lead_capture_surface
    future_flow: Website request -> Integration Gateway -> approved downstream module
    forbidden_ownership:
      - canonical product catalog
      - Calculator Engine pricing rules
      - global clients
      - canonical orders
      - payments
      - stock
      - production statuses
      - accounting documents
      - 1C data
    global_rules:
      - Do not run git add base/ until owner and Blueprint explicitly approve tracking policy.
      - Do not deploy publicly from this roadmap.
      - Do not commit production credentials.
      - Do not connect production services.
      - Do not make website data canonical ForPrint business data.
      - Do not bypass Integration Gateway in future integration planning.

roadmap:
  - sequence: 1
    step_id: website_initial_read_only_inspection_v0_1
    title: Initial read-only inspection
    status: completed
    priority: high
    depends_on: []
    evidence:
      legacy_evidence_items:
        - report
    summary: >
      Inspect inherited PHP website structure without rewrite or deployment.
      Identify structure, runtime assumptions, config, admin, catalog, cart,
      order, upload, mail and public launch blockers.

  - sequence: 2
    step_id: website_repository_control_deep_inspection_v0_2
    title: Repository control and deep read-only inspection
    status: completed
    priority: critical
    depends_on:
      - website_initial_read_only_inspection_v0_1
    evidence:
      legacy_evidence_items:
        - report
    summary: >
      Establish repository-root control at forprint_website and inspect routing,
      .htaccess, DB/model layer, admin login/session logic, upload logic,
      mail/order flow, SQL construction and public exposure candidates.

  - sequence: 3
    step_id: website_secret_cleanup_php82_v0_3
    title: Secret cleanup and PHP 8.2 compatibility patch
    status: completed
    priority: critical
    depends_on:
      - website_repository_control_deep_inspection_v0_2
    evidence:
      legacy_evidence_items:
        - report
        - make_php_syntax
        - make_check
    summary: >
      Move SMTP values behind local-only mail config, add placeholder-only
      mail example, ignore local secret config, and fix the first PHP 8.2
      fatal syntax blocker.
    outputs:
      - base/mail.local.php local-only approach
      - base/mail.example.php placeholder-only example
      - base/config.local.php ignored
      - BaseAdmin.php PHP 8.2 curly offset issue fixed
      - make php-syntax passed
      - make check passed
    remaining_blockers:
      - base/ is not approved for broad commit
      - config.php tracking policy unresolved
      - DB schema unknown
      - admin/auth/session/upload/SQL/web-root risks remain

  - sequence: 4
    step_id: website_scaffolding_first_safe_commit_v0_4
    title: First safe repository checkpoint
    status: active
    priority: critical
    depends_on:
      - website_secret_cleanup_php82_v0_3
    evidence:
      legacy_evidence_items:
        - commit
    purpose: >
      Create a safe repository checkpoint without broadly committing inherited base/.
    expected_outputs:
      - .gitignore
      - README.md
      - Makefile
      - coordination/status/current_status.md
      - v0.3 report
      - safe first commit
    explicit_rule: Do not run git add base/.
    acceptance:
      - root scaffold committed
      - local scratch helpers ignored
      - base/ remains untracked except explicitly approved files
      - no secrets committed

  - sequence: 5
    step_id: website_legacy_base_inventory_v0_4_1
    title: Legacy base inventory
    status: ready
    priority: critical
    depends_on:
      - website_scaffolding_first_safe_commit_v0_4
    evidence:
      legacy_evidence_items: []
    purpose: >
      Preserve knowledge of inherited PHP base state without committing unsafe
      runtime, secrets, media, vendor, log or temp content.
    expected_outputs:
      - file inventory of base/
      - source/runtime/vendor/media/log/temp classification
      - statement that base/ is inherited legacy PHP code
      - no secrets committed
      - no runtime logs committed
      - no production config committed
    classification_required:
      - source_code
      - tracked_seed_assets
      - local_config
      - runtime_uploads
      - runtime_logs
      - generated_files
      - vendor_dependencies
      - temporary_scratch
      - unknown_needs_review

  - sequence: 6
    step_id: website_safe_tracking_policy_v0_4_2
    title: Safe tracking policy for inherited base
    status: planned
    priority: critical
    depends_on:
      - website_legacy_base_inventory_v0_4_1
    evidence:
      legacy_evidence_items: []
    purpose: >
      Define exactly what from base/ may be tracked and what must remain ignored.
    expected_outputs:
      - source_files_to_track
      - files_to_ignore
      - files_to_replace_with_examples
      - runtime_dirs_to_keep_untracked
      - vendor_policy
      - userfiles_policy
      - log_temp_policy
      - composer_policy
    explicit_rule: >
      Broad git add base/ remains forbidden until owner and Blueprint explicitly
      approve the tracking policy.

  - sequence: 7
    step_id: website_config_split_and_secret_policy_v0_4_3
    title: Config split and secret tracking policy
    status: planned
    priority: critical
    depends_on:
      - website_safe_tracking_policy_v0_4_2
    evidence:
      legacy_evidence_items: []
    purpose: >
      Make config tracking safe before any broad base/ commit.
    expected_outputs:
      - decide whether base/config.php can be tracked
      - create or plan config.example.php
      - keep config.local.php ignored
      - ensure DB credentials are never committed
      - ensure SMTP credentials stay only in mail.local.php
      - run grep-based secret scan
    acceptance:
      - tracked config files contain fake/example values only
      - local config files are ignored
      - no real DB/SMTP/API credentials are present in git

  - sequence: 8
    step_id: website_database_schema_recovery_v0_4_4
    title: Database schema recovery and ownership mapping
    status: planned
    priority: high
    depends_on:
      - website_config_split_and_secret_policy_v0_4_3
    evidence:
      legacy_evidence_items: []
    purpose: >
      Recover or document the inherited website database schema.
    expected_outputs:
      - confirm MySQL/MariaDB schema source or confirm missing
      - create schema-only dump if local DB exists
      - no production data dump
      - table inventory
      - table ownership map
      - all local website order/client/product tables marked legacy_website_local_non_canonical
    strategic_rule: >
      Website DB tables are channel-local legacy tables only. They are not
      ForPrint canonical clients, products, orders, stock, payments or accounting.

  - sequence: 9
    step_id: website_selected_base_source_checkpoint_v0_4_5
    title: Selected base source checkpoint
    status: planned
    priority: high
    depends_on:
      - website_database_schema_recovery_v0_4_4
    evidence:
      legacy_evidence_items: []
    purpose: >
      Commit only approved source/config-example files from base/, not runtime,
      vendor, logs, temp, local config, or uncontrolled uploads.
    acceptance:
      - no base/mail.local.php
      - no real DB credentials
      - no logs
      - no temp files
      - no uncontrolled runtime uploads
      - no broad git add base/
      - only explicitly approved file groups staged

  - sequence: 10
    step_id: website_webroot_exposure_hardening_v0_5
    title: Web-root and public exposure hardening
    status: planned
    priority: critical
    depends_on:
      - website_selected_base_source_checkpoint_v0_4_5
    evidence:
      legacy_evidence_items: []
    purpose: >
      Harden public exposure risks before any public deployment.
    expected_outputs:
      - document-root decision
      - .htaccess or server config hardening
      - direct access blocked for config.php
      - direct access blocked for config.local.php
      - direct access blocked for mail.local.php
      - direct access blocked for core/
      - direct access blocked for vendor/
      - direct access blocked for log/
      - direct access blocked for temp/
      - direct access blocked for composer.json
      - direct access blocked for composer.lock
      - direct access blocked for vendor/phpmailer/phpmailer/get_oauth_token.php
      - suspicious RewriteCond reviewed and corrected if needed
      - PHP execution blocked in userfiles/
    rewrite_rule_to_review: "RewriteCond %(REQUEST_FILENAME) !-f"
    expected_rewrite_rule_if_needed: "RewriteCond %{REQUEST_FILENAME} !-f"

  - sequence: 11
    step_id: website_public_exposure_smoke_tests_v0_5_1
    title: Public exposure smoke tests
    status: planned
    priority: critical
    depends_on:
      - website_webroot_exposure_hardening_v0_5
    evidence:
      legacy_evidence_items: []
    purpose: >
      Add curl-based smoke tests after web-root hardening.
    required_checks:
      - /config.php returns 403 or 404
      - /core/ returns 403 or 404
      - /vendor/ returns 403 or 404
      - /log/ returns 403 or 404
      - /temp/ returns 403 or 404
      - /vendor/phpmailer/phpmailer/get_oauth_token.php returns 403 or 404
      - /userfiles/test.php must not execute PHP
    expected_outputs:
      - smoke test script or manual command set
      - result report
      - HTTPS behavior documented
      - production error display disabled or flagged

  - sequence: 12
    step_id: website_admin_auth_session_lockdown_v0_6
    title: Admin authentication and session lockdown
    status: planned
    priority: critical
    depends_on:
      - website_public_exposure_smoke_tests_v0_5_1
    evidence:
      legacy_evidence_items: []
    purpose: >
      Review and harden inherited admin authentication/session internals.
    expected_outputs:
      - md5 password risk handled or patch plan
      - default admin seed reviewed/removed/disabled
      - cookie/session flags reviewed
      - CSRF posture reviewed
      - brute-force behavior reviewed

  - sequence: 13
    step_id: website_admin_access_policy_v0_6_1
    title: Admin access policy
    status: planned
    priority: critical
    depends_on:
      - website_admin_auth_session_lockdown_v0_6
    evidence:
      legacy_evidence_items: []
    policy:
      - admin disabled publicly by default
      - admin only via VPN/internal IP/temporary maintenance window
      - no public admin exposure before auth/session/CSRF hardening
      - default admin seed removed or disabled before launch
    expected_outputs:
      - admin route policy
      - public admin exposure blocked
      - weak legacy auth not internet-facing

  - sequence: 14
    step_id: website_upload_safety_lockdown_v0_7
    title: Upload safety lockdown
    status: planned
    priority: high
    depends_on:
      - website_admin_access_policy_v0_6_1
    evidence:
      legacy_evidence_items: []
    purpose: >
      Restrict uploads and media directory risks.
    expected_outputs:
      - upload paths inventory
      - extension allowlist decision
      - MIME validation decision
      - max size recommendation
      - randomized filename policy if needed
      - PHP execution blocked in upload/media directories
      - launch blocker status

  - sequence: 15
    step_id: website_sql_user_input_review_v0_8
    title: SQL and user-input risk review
    status: planned
    priority: critical
    depends_on:
      - website_upload_safety_lockdown_v0_7
    evidence:
      legacy_evidence_items: []
    purpose: >
      Map dynamic SQL and request input risk.
    expected_outputs:
      - dynamic SQL map
      - user input map
      - high-risk query list
      - prepared statement or allowlist patch plan
      - launch blocker status

  - sequence: 16
    step_id: website_launch_mode_restriction_v0_9
    title: Early launch mode restriction
    status: planned
    priority: high
    depends_on:
      - website_sql_user_input_review_v0_8
    evidence:
      legacy_evidence_items: []
    purpose: >
      Decide which inherited shop features are allowed for first public use.
    expected_outputs:
      - early public mode recommendation
      - cart/order/user account disable or hide plan if needed
      - clear statement that website data is not canonical ForPrint data

  - sequence: 17
    step_id: website_public_launch_profile_v0_9_1
    title: Lead-capture-only public launch profile
    status: planned
    priority: high
    depends_on:
      - website_launch_mode_restriction_v0_9
    evidence:
      legacy_evidence_items: []
    launch_profile:
      mode: lead_capture_only
      enabled:
        - public pages
        - service/product presentation
        - contact information
        - request form
        - local SEO pages
      disabled_or_blocked:
        - admin public access
        - user login
        - cart checkout
        - canonical order creation
        - payment flow
        - stock display
        - accounting flow
        - 1C integration
    acceptance:
      - first launch mode is explicitly limited
      - cart/order/account behavior disabled, hidden, or marked non-canonical
      - lead capture does not directly write to ForPrint core modules

  - sequence: 18
    step_id: website_dependency_backup_environment_v0_10
    title: Dependency, backup and environment normalization
    status: planned
    priority: normal
    depends_on:
      - website_public_launch_profile_v0_9_1
    evidence:
      legacy_evidence_items: []
    purpose: >
      Normalize PHP/Composer/runtime/deployment support.
    expected_outputs:
      - PHP version target
      - Composer workflow decision
      - vendor tracking decision
      - backup/restore procedure
      - environment documentation
      - Makefile/check updates

  - sequence: 19
    step_id: website_seo_lead_capture_readiness_v0_11
    title: Local SEO and lead-capture readiness
    status: planned
    priority: normal
    depends_on:
      - website_dependency_backup_environment_v0_10
    evidence:
      legacy_evidence_items: []
    purpose: >
      Prepare local SEO and lead capture only after security blockers are controlled.
    expected_outputs:
      - contacts/address review
      - robots.txt/sitemap decision
      - Search Console/analytics checklist
      - local landing page checklist
      - spam/rate-limit recommendation

  - sequence: 20
    step_id: website_limited_public_launch_gate_v0_12
    title: Limited public launch gate
    status: planned
    priority: critical
    depends_on:
      - website_seo_lead_capture_readiness_v0_11
    evidence:
      legacy_evidence_items: []
    purpose: >
      Final explicit launch approval gate.
    expected_outputs:
      - final blocker review
      - public launch checklist
      - rollback plan
      - backup confirmation
      - approved launch scope
      - explicit owner approval required
    gate_requirements:
      - no secrets in tracked files
      - PHP checks pass
      - DB/schema and backup documented
      - HTTPS configured
      - admin not internet-facing
      - config/core/vendor/log/temp not publicly reachable
      - uploads safe or disabled
      - launch mode is lead_capture_only
      - no direct writes to ForPrint core modules
      - owner approval recorded
    launch_status: blocked_until_gate_passes

  - sequence: 21
    step_id: website_future_next_version_planning_v0_13
    title: Future next-version planning
    status: deferred
    priority: reference
    depends_on:
      - website_limited_public_launch_gate_v0_12
    evidence:
      legacy_evidence_items: []
    purpose: >
      Plan a future clean website implementation beside base/.
    expected_outputs:
      - next/ or modern/ directory decision
      - migration strategy
      - future Integration Gateway boundary
      - Library/Calculator/Operational Registry integration plan

  - sequence: 22
    step_id: website_future_gateway_handoff_gate_v0_14
    title: Future Integration Gateway handoff gate
    status: deferred
    priority: reference
    depends_on:
      - website_future_next_version_planning_v0_13
    evidence:
      legacy_evidence_items: []
    purpose: >
      Define the future integration gate.
    strategic_rule: >
      Website must not connect directly to Operational Registry, Calculator Engine,
      Library, Accounting Registry or 1C.
    future_flow: "Website request -> Integration Gateway -> approved downstream module"
    acceptance:
      - Gateway contract approved
      - idempotency/correlation defined
      - website request payload is channel-level
      - no direct canonical writes from website

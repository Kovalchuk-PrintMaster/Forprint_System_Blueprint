steps:
  - step_id: OC-01
    delivery_refinement_id: oc01_two_contour_delivery_2026_10_01
    delivery_model: two_contour_progressive_delivery
    detailed_implementation_prompt: coordination/self_coordination/prompt_queue/draft/2026-10-01__forprint_system_blueprint__oc01_mini_full_operator_console_implementation_v0_1.md
    activation_rule: human_owner_separate_explicit_decision
    implementation_contours:
      - contour_id: OC-01-MINI
        title: Minimum Operational Console
        intent: >-
          Deliver the smallest genuinely useful Operator Console with both governed Protected
          Terminal work and isolated Assistant Dev Sandbox work.
        required_capabilities:
          - actor-neutral execution/session state and exclusive module lease
          - Protected Terminal Gateway with read-only and bounded capability-shaped safe-write profiles
          - scoped command execution with stdout/stderr/exit-code evidence and denial outside policy
          - Assistant Dev Sandbox created from exact BASE_HEAD in isolated writable workspace
          - sandbox edits/tests/local commits where useful plus Environment Delta evidence
          - durable checkpoint, pause/resume, seal and deterministic result package
          - Sandbox-to-Canonical promotion preview with base-head/conflict/exact-write-set validation
          - explicitly authorized bounded promotion/apply path without implicit remote push
          - minimum phone/laptop Console surface for state, terminal, sandbox, checkpoint and promotion
          - one real Protected Terminal proof and one real Sandbox-to-Canonical proof
        completion_meaning: useful_minimum_proven_partial_oc01
      - contour_id: OC-01-FULL
        title: Full Operator Console v1
        extends: OC-01-MINI
        intent: >-
          Complete the approved OC-01 target after MINI is proven while preserving the same lease,
          authority, provenance, recovery and sandbox/canonical boundaries.
        required_capabilities:
          - richer terminal capability profiles, approvals, streaming and explainable command provenance
          - long-lived resumable sandboxes with deterministic recovery and retained checkpoints
          - stronger artifact/commit/diff/test/environment/dependency provenance
          - hardened promotion transaction with conflict handling and rollback evidence
          - complete controlled handoff among internal_worker, operator_assistant and human_terminal
          - mature phone/laptop controls, event history, alerts, health and recovery views
          - bounded task continuation while Human Owner is away from the local terminal
          - full OC-01 end-to-end acceptance and operator documentation
        completion_meaning: oc01_target_complete

    name: minimum_working_console_vertical_slice
    state: ACTIVE_IMPLEMENTATION_PARTIAL
    goal: >-
      Deliver one useful remote operator surface with live module availability,
      exclusive operator session acquisition, isolated workspace, assistant/execution
      interaction, artifact exchange and clean release.
    required_capabilities:
      - module_registry_and_status_projection
      - exclusive_module_acquire_release
      - operator_assistant_actor_identity
      - isolated_operator_workspace
      - assistant_execution_bridge
      - artifact_exchange
      - clean_release
    acceptance:
      - canonical_repo_not_exposed_to_uncontrolled_writes
      - simultaneous_writable_actor_collision_prevented
      - meaningful_remote_bounded_session_possible
      - outputs_reviewable_and_preservable
      - module_cleanly_releasable
    explicitly_deferred_allowed:
      - full_secrets_broker
      - advanced_network_policy_engine
      - automated_integration_gate
      - rich_artifact_registry_ui
      - full_telegram_approval_broker
      - complete_recovery_automation
      - all_interrupt_priority_controls
      - advanced_garbage_collection

  - step_id: OC-02
    name: advanced_operator_control_surface
    state: FUTURE_TARGET_NOT_ACTIVATED
    capabilities:
      - controlled_priority_interrupt
      - suspend_resume
      - access_request_flow
      - chat_review_supervised_dev_full_dev_modes
      - environment_delta
      - tool_capability_registry
      - local_git_checkpoints
      - durable_artifact_provenance
      - notification_and_approval_flows
      - heartbeat_checkpoint_recovery
      - storage_pressure_retention_hysteresis
      - bounded_change_package
      - clean_integration_worktree_and_governance_gate

cf10_dependencies:
  reconciliation_required: true
  expected_capabilities:
    - actor_neutral_execution_fabric
    - execution_record_and_source
    - shared_three_actor_execution_state
    - stable_workflow_entrypoints
    - workflow_registry_and_health
    - step_execution_ledger_or_equivalent
    - heartbeat_liveness
    - semantic_event_journal
    - status_projection
    - exclusive_module_lease_or_equivalent
    - controlled_interrupt_checkpoint_release
    - sandbox_workspace_lifecycle
    - recovery_checkpoint_model
    - artifact_and_status_metadata
    - execution_tool_capability_projection
  missing_dependency_behavior:
    - mark_dependency_not_ready
    - inspect_live_cf10_state
    - choose_wait_adapter_mock_or_minimal_temporary_surface_explicitly
    - do_not_create_competing_permanent_subsystem_silently

sandbox_tooling:
  policy: modern_tooling_encouraged_when_materially_useful
  environment_delta_required: true
  promotion_targets:
    - global_developer_profile
    - module_development_profile
    - bootstrap_capability_pack
    - tool_capability_registry

recovery:
  abrupt_power_loss_is_real_operating_condition: true
  durable_checkpoint_direction: required
  resume_from_recent_durable_state: target

retention:
  dimensions:
    - age
    - storage_pressure
  active_workspace_auto_delete_by_age: false
  discussed_noncanonical_examples:
    storage_budget_gb: 100
    stale_inactive_horizon_months: 6

artifact_provenance:
  payload_may_expire: true
  provenance_should_persist: true
  desired_fields:
    - execution_id
    - module_id
    - actor
    - base_head
    - source_inputs
    - generation_recipe
    - filename
    - type
    - sha256
    - retention_class

implementation_flexibility:
  baseline_is_not_rigid_mechanical_template: true
  reuse_policy:
    - REUSE
    - EXTEND
    - ADAPT
    - REPLACE
    - NEW
  better_compatible_solution_should_be_surfaced: true
  ownership_or_policy_change_requires_clarification: true

decision_gate:
  after_planning_and_cf10_reconciliation:
    options:
      - START_OC_01
      - FINISH_MODULE_INVENTORY_THEN_START_OC_01
    authority: human_owner


      - operator_usability
      - resource_and_economic_efficiency
    grants_automatic_scope_authority: false
    grants_automatic_promotion_authority: false
  adaptive_sandbox_scope:
    broader_local_experimentation_may_be_enabled_by_profile_or_work_front: true
    expanded_scope_must_be_reported: true
    expanded_scope_report_fields:
      - declared_scope
      - actual_changed_paths
      - expanded_paths
      - reason
      - expected_benefit

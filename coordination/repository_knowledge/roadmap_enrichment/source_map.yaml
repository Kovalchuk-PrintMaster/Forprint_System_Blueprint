- rule: canonical_source_beats_generated_projection
- rule: git_and_current_authority_beat_stale_handoff_or_chat
- rule: navigation_does_not_grant_execution_authority
- rule: historical_snapshot_is_evidence_not_current_control
- rule: dirty_worktree_state_must_not_leak_into_bounded_publication
contribution_protocol:
  required_fields:
  - discovery_or_lesson
  - why_reusable
  - source_or_evidence
  - scope
  - authority_level
  - known_caveat
  - recommended_sequence_or_fast_path
  - last_verified_commit
  - supersedes_or_conflicts_with
  do_not:
  - append_raw_session_transcript
  - promote_unverified_guess
  - duplicate_existing_lesson_without_reason
  - silently_replace_authority
  - treat_navigation_as_activation_authority

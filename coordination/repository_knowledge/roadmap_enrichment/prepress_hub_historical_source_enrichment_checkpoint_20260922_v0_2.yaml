candidate_summary:
- Shared file intelligence and product-specific assistant boundary
- Multi-candidate processing and Unix-first / bounded Windows execution policy
- ForPrint-owned PDF Control Layer and raster-to-PDF intake pipeline
key_recovered_directions:
- Capability-first Prepress sequencing before broad integration architecture.
- Product-specific assistants with shared fact-only file inspection utilities.
- Multiple controlled processing candidates with preview/risk/confidence evidence.
- Unix-first execution with Windows/Photoshop as a bounded quality executor.
- Configurable DPI/aspect safety policy instead of hard-coded historical examples.
- K-only raster text enhancement only as a safety-gated heuristic.
- Highly automated file intake with deterministic auto-fix, proof, clarification and manual fallback.
- Python-first PDF engineering with bounded native microtools only when a proven gap justifies them.
- ForPrint-owned PDF Control Layer direction with external engines kept replaceable and Blueprint-review gated.
- Explicit raster input -> PDF validation -> Prepress readiness pipeline separation.
key_supersessions_and_boundaries:
- The May all-in-one zero-platform scaffold remains historical secondary proposal, not current architecture authority.
- Absolute project paths are superseded by portable/project-relative configuration discipline.
- Historical 0.0.0.0 --reload binding is not current deployment/security policy.
- 25 DPI, 3-5% distortion and 80-90% Unix coverage are historical examples, not permanent constants.
- Specific Acrobat/PitStop/callas/Quite/qpdf/Ghostscript/MuPDF recommendations are not current vendor policy.
- Concrete workstation/device identity remains System Administration-owned.
- Canonical product/material semantics remain Library-owned; calculation semantics remain Calculator-owned.
- External PDF engines may execute bounded operations but do not own ForPrint PDF business logic.
current_roadmap_policy: Current Prepress planning is bound semantically to the forprint_prepress_hub surface; historical
  checkpoint validity does not depend on stale roadmap step identifiers.
next_required_action_for_prepress: No action is required before switching modules. Revisit the three candidates

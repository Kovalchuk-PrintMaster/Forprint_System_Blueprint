  - coordination/repository_knowledge/inventory/2026-07-29__forprint_system_blueprint__repository_capability_inventory_v0_3.yaml
  - coordination/repository_knowledge/flows/2026-07-29__forprint_system_blueprint__repository_execution_dependency_map_v0_3.yaml
- decision: Separate structural coverage from semantic understanding.
  reason: Indexing 698 files does not prove purpose, authority or dependency knowledge.
  evidence:
  - 22 of 698 purposes understood in the self-audit scan
  - 4 of 698 dependencies mapped in the self-audit scan
- decision: Keep module completion intake preview-first.
  reason: Invalid module evidence must fail without writing Blueprint coordination state.
  evidence:
  - Library packet rejected on missing implementation_commit
  - Blueprint remained unchanged after RED intake preview
- decision: Maintain eight to ten actionable steps ahead.
  reason: Balanced module coordination requires visible downstream dependencies before current work completes.
  evidence:
  - coordination/standards/governance/module_development_roadmap_policy.md
  - coordination/internal_work/blueprint/inventory_refresh/2026-07-29__blueprint__inventory_refresh_plan_v0_1.yaml
- decision: Do not authorize cross-repository writes during inventory.
  reason: Inventory must remain observational and must not mutate module implementation repositories.
  evidence:

portfolio_risks:
- risk_id: completion_evidence_fragmentation
  severity: high
  state: open
  description: Modules may report green checks while completion-packet schema or provenance remains invalid.
  mitigation: Use canonical packet validators and Blueprint preview-first acceptance.
- risk_id: consumer_outpaces_producer
  severity: high
  state: managed
  description: Telegram notification work may outrun Logistics event-contract stability.
  mitigation: Keep Logistics producer contract one bounded step ahead.
- risk_id: portfolio_metadata_drift
  severity: high
  state: open
  description: Prompt Queue, roadmaps, source registry and module lifecycle metadata may disagree.
  mitigation: Run the next read-only metadata consistency audit.
- risk_id: stale_module_state
  severity: medium
  state: open
  description: Historical Blueprint evidence may be mistaken for current module repository state.
  mitigation: Require fresh exact HEAD, branch, divergence, clean-tree and test evidence for every acceptance.
- risk_id: inventory_branch_divergence
  severity: medium
  state: managed
  description: The audit branch can lag behind new main coordination commits.
  mitigation: Keep inventory commits bounded and reconcile before merge.
confirmed_unknowns:
- Current repository HEAD and test state for modules not freshly reviewed.
- Ecosystem-wide consistency of module IDs, aliases and source paths.
- Current alignment of every Prompt Queue with its module roadmap.
- Authority and retention policy for generated and historical artifacts.
- Whether every active module maintains eight to ten actionable steps ahead.
- The final implementation and completion commits for Library and Telegram repair work.
conflicts:
- conflict: Library implementation evidence is strong while its canonical completion packet is invalid.
  handling: Do not accept until provenance and module-side validation are corrected.
- conflict: Telegram governance implementation is reported complete while Blueprint lacks valid packet evidence.
  handling: Keep acceptance blocked without changing runtime conclusions.
- conflict: Logistics is allowed to advance while the Blueprint audit branch is separate from main.
  handling: Keep module work on its own branch and reconcile Blueprint coordination before audit merge.

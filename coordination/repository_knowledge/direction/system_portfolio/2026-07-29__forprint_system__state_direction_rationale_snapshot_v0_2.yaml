rationale:
- decision: Treat module completion evidence as a hard acceptance gate.
  reason: Implementation quality cannot substitute for invalid or ambiguous completion provenance.
- decision: Keep Logistics ahead of Telegram notification consumption by one bounded contract step.
  reason: Telegram should consume a stable provider-neutral event model instead of inventing Logistics semantics.
- decision: Keep Library independent from Calculator internals.
  reason: Library owns reusable reference and product contract truth; Calculator owns calculations.
- decision: Do not infer current state for inactive or unreviewed modules.
  reason: Portfolio coordination must distinguish tracked historical evidence from fresh repository verification.
- decision: Finish Blueprint metadata reconciliation before broad module inventory rollout.
  reason: Rolling inconsistent IDs, paths or lifecycle states into every module would multiply coordination drift.

  - tests
comparison_to_previous:
  previous_snapshot: null
  added_flows: []
  removed_flows: []
  changed_steps: []
  changed_side_effects: []
  changed_contracts: []
  new_unverified_links:
  - Initial baseline.
  - Roadmap/queue synchronization not automatic.
  - External module state not freshly audited.
  - Contract Registry machine integration not defined.
  resolved_unverified_links: []
  duplicate_flow_candidates:
  - Roadmap and queue both represent current/next work and require precedence.
quality_checks:
  triggers_present: true
  ordered_steps_present: true
  side_effects_declared: true
  failure_modes_declared: true
  unknown_links_preserved: true
  yaml_validated: true

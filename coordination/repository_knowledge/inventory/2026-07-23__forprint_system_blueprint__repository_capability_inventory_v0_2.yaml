review_candidates:
  duplicate_candidates:
  - id: module_registry_drift
    paths:
    - machine/modules.yaml
    - module_policy_index.yaml
    - module_git_sources.yaml
    - ecosystem_module_map.md
    evidence: Contract Registry present in coordination records but absent in machine/modules.yaml.
    next: Define registration workflow and consistency check.
  - id: execution_state_drift
    paths:
    - forprint_execution_queue.yaml
    - current_execution_focus.md
    - roadmaps
    - prompt queues
    evidence: Queues are newer than roadmaps/current focus.
    next: Define precedence/freshness and add read-only drift report.
  dormant_candidates:
  - path: coordination/incoming_requests/*/new/
    reason: Historical requests lack freshness.
    next: Review before archive.
  - path: reports/module_coordination/
    reason: Snapshots may be stale.
    next: Compare generated commit/date.
  - path: drafts and superseded prompts
    reason: Historical work beside active queues.
    next: Retain but ensure resolvers ignore.
  orphan_candidates:
  - path: reports/forprint_module_status.json
    reason: Empty invalid JSON.
    next: Identify producer or separately approve cleanup.
  ownership_conflicts:
  - concept: contract_definition
    current: Blueprint in machine/ownership.yaml
    planned: Contract Registry owns inter-module interface lifecycle
    resolution: Split architecture declarations from interface packages.
  documentation_gaps:
  - Contract Registry missing from machine architecture/guides.
  - current_execution_focus.md stale/malformed.
  - README recommends git add .
  - Roadmap/queue precedence not explicit.
  recovery_gaps:
  - First snapshot recovery guide introduced by this package.
  - No automated comparison by design.
  security_or_external_io_questions:
  - Collector secret-exclusion policy needs periodic review.
  - No Registry/Gateway runtime write authorized.

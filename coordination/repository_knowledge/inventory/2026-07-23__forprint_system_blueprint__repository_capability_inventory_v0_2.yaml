  - coordination/outgoing_prompts/*/index.yaml
  - coordination/roadmaps/*.yaml
  unresolved_summary:
  - Contract Registry is absent from machine architecture and generated guides.
  - Library and Telegram roadmaps lag their prompt queues; Logistics state needs reconciliation.
  - current_execution_focus.md is stale and malformed.
  - Several module source records remain confirm_required.
  - reports/forprint_module_status.json is empty invalid JSON.
  - Repository has unrelated untracked files.

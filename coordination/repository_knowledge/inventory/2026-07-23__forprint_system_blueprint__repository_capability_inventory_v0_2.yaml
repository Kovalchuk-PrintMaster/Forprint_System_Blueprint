  declared_purpose: Architecture and governance truth layer for the ForPrint ecosystem.
  observed_purpose: Active manual coordination control plane with machine/human architecture, prompt queues, roadmaps,
    completion intake, document awareness, generated guidance and compact diagnostics.
  primary_entrypoints:
  - make check
  - make check-report
  - make validate
  - make prompt-next MODULE=<module>
  - make completion-accept ...
  - make roadmap-dashboard ...
  - make document-awareness ...
  primary_capabilities:
  - architecture truth
  - ownership and contract maps
  - module policy/source registries
  - prompt queues
  - roadmaps
  - completion workflow
  - document awareness
  - governance audit
  - compact reporting
  - manual repository knowledge snapshots
  important_artifacts:
  - machine/modules.yaml
  - machine/ownership.yaml
  - machine/contracts.yaml
  - machine/data_flows.yaml
  - machine/forprint_execution_queue.yaml
  - coordination/module_policy/module_policy_index.yaml

  evidence_policy: paths_and_tests
  changed_path_required: true
- id: TRK-REQ-004
  required: true
  statement: Provide a channel-neutral notification projection suitable for Telegram handoff without Telegram ownership leakage.
  evidence_policy: paths_and_tests
  changed_path_required: true
- id: TRK-REQ-005
  required: true

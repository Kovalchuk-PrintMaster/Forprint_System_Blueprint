  evidence_policy: paths_and_tests
  changed_path_required: true
- id: TRK-REQ-006
  required: true
  statement: Provide synthetic fixtures for normal, failure, duplicate, out-of-order and notification replay cases.
  evidence_policy: paths_and_tests
  changed_path_required: true
- id: TRK-REQ-007
  required: true
  statement: Provide a deterministic read-only Make-first preview/check workflow.
  evidence_policy: paths_and_tests
  changed_path_required: true
- id: TRK-REQ-008
  required: true

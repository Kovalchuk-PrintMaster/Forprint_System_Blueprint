dependencies:
- Published Slice A governed worker cycle state/projection remains reusable.
- Published Slice B1 invocation adapter remains authority-neutral and provider-specific argv stays isolated there.
- Canonical process launcher remains the sole process-start primitive.
- Canonical Execution Attempt Ledger exposes validate_record_data and append_record.
- CF10 training dispatch exposes assert_attempt_unused.
- Execution Control Plane planning keeps B2 bounded and Console non-authoritative.
- The current B2 write-set is clean before mutation.
outputs:
- One explicit B2 Work Front with exactly four writable paths.
- One launch_authorized_worker_cycle composition in governed_worker_cycle.py.
- One focused live-launch regression test module.
- One Makefile operator check for B2 live-launch orchestration.
- One explicit project-native governed-worker-cycle-launch operator command that
  reuses the canonical B2 composition instead of chat-owned launch logic.
- Sanitized launch evidence with no durable raw prompt/argv leakage.
acceptance:
- Launch orchestration refuses any projection state other than READY_FOR_WORKER_LAUNCH.
- STARTED record identity must match the exact attempt id and contain STARTED semantics.
- STARTED record is validated before process start.
- The canonical attempt-unused guard runs before STARTED append.
- STARTED is appended exactly once through the launcher on_started callback.
- A spawn failure before on_started produces no attempt-ledger append.
- The invocation plan exposes exactly one canonical launcher mapping.
- Provider-specific argv construction remains owned by the B1 invocation adapter.
- Returned process evidence strips raw argv, prompt, secret and environment fields.
- The supported launch command requires explicit operator confirmation, derives
  task context and STARTED ledger data from canonical attempt/task artifacts,
  and writes sanitized process evidence for cycle status projection.
- Candidate promotion, automatic ACCEPT, staging, commit, push, merge and release remain false.
- Canonical Work Front validation passes.
- Focused B2 tests, Slice A regression, Slice B1 regression, ledger regression and git diff --check pass.
stop_conditions:
- B1 reference Work Front identity or exact scope has drifted.
- Required canonical launch, ledger or attempt-guard APIs are missing.
- B2 would require a path outside the exact four-path scope.
- B2 would require changing invocation-adapter or launcher semantics.
- A real Worker launch or real attempt-ledger append would occur during implementation validation.
- Authority widening, automatic acceptance or publication would be required.
- Any protected pre-existing dirty path changes.

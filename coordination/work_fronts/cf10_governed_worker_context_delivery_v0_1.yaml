dependencies:
- Shared Structured Command Executor foundation is completed and published.
- CF10 Worker Invocation Bridge is completed and published.
- Handoff v2 TASK_EXECUTION manifest already contains the required lifecycle/roadmap context.
- Current project-native Worker launch already has explicit dispatch and source-freshness gates.
outputs:
- Bounded governed Worker context projection extracted from Handoff v2.
- Deterministic projection digest bound into explicit dispatch decision_id.
- Launch-time digest/binding verification.
- Non-authoritative lifecycle/roadmap context section in the Worker prompt.
- Tests-first regression coverage across dispatcher, CF10 dispatch, governed launch and invocation adapter.
- Existing governed-worker-cycle-check expanded to cover context delivery.
acceptance:
- Handoff v2 runtime and contract remain unchanged
- Task Context schema remains unchanged
- prepared_execution contains only the bounded governed Worker context projection plus its digest
- Handoff runtime manifest content is hash-verified before projection extraction
- explicit dispatch decision_id binds governed_worker_context_sha256
- launch fails closed on projection digest drift or Handoff manifest binding drift
- canonical task_context/task_context_id are not mutated to smuggle context
- Worker prompt contains lifecycle_roadmap_cursor including roadmap_sync
- Worker prompt contains dependency_health_slice, resume_coordinates and expected_result_schema_revision
- Worker prompt labels the projection non-authoritative
- context cannot grant dispatch, path, git, release, promotion or acceptance authority
- existing Worker Invocation Bridge/MCP validation surface remains unchanged
- governed-worker-cycle-check covers the new context-delivery regression
- existing CF09/CF10/Worker invocation regressions pass
- no Worker attempt a029 is created or launched
- OC01 remains paused
stop_conditions:
- A path outside the frozen implementation write-set becomes necessary.
- Handoff v2 runtime or contract modification becomes necessary.
- Task Context schema modification becomes necessary.
- A new authority source or authority widening becomes necessary.
- Full Handoff base_context must be copied into the Worker prompt rather than the bounded projection.
- Explicit dispatch must carry mutable full context instead of a digest binding.
- Worker Invocation Bridge/MCP execution semantics must change.
- Lifecycle/roadmap state must be mutated to prove context delivery.
- A real Worker retry or attempt-ledger mutation would occur during validation.
- Concurrent committed or dirty changes intersect the audited dependency cone.

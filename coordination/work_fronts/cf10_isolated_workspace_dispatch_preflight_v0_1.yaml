work_front_id: wf-cf10-isolated-workspace-dispatch-preflight-v0-1
objective: Implement and validate the reusable isolated worker-workspace materialization layer required by CF-10, preserving
  the current dirty Blueprint source state without copying excluded runtime debris, and prove that the existing CF-09 TASK_EXECUTION
  Dispatcher preflight accepts the first Blueprint-internal task up to AWAITING_ASSISTANT_ACK while granting no dispatch/release/push/merge/foreign-write
  authority.
scope:
- coordination/standards/automation/worker_workspace_contract_v0_1.yaml
- scripts/coordination/control_plane/workspace/
- scripts/validation/validate_cf10_isolated_workspace_dispatch_preflight_v0_1.py
- tests/coordination/control_plane/workspace/
exclusions:
- Do not modify scripts/coordination/control_plane/dispatch_intent.py.
- Do not modify coordination/standards/automation/control_plane/central_listener_dispatcher_monitor_v0_1.yaml.
- Do not modify Handoff v2 runtime or contracts.
- Do not modify Task Context adapter or Worker Task Envelope contracts.
- Do not modify scripts/coordination/control_plane/worker_runtime/.
- Do not modify scripts/coordination/build_worker_invocation.py.
- Do not implement the CF-10 internal dispatch exception in this slice.
- Do not validate or emit an Assistant ACK in this slice.
- Do not transition Dispatcher preparation beyond AWAITING_ASSISTANT_ACK.
- Do not create a canonical Execution Attempt Ledger row.
- Do not create the real first-attempt workspace under /srv/software_development/forprint-worker-runtime in this slice.
- Do not launch a worker.
- Do not commit, push, merge, release or automatically ACCEPT.
- Do not write any repository other than forprint_system_blueprint.
- Do not mutate lifecycle or roadmap state.
- Do not copy tmp/, runtime logs or other continuity-excluded debris into a worker workspace.

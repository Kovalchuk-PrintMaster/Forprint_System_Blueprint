work_front_id: wf-cf10-s4-result-return-opt-in-bridge-v0-1
objective: Implement a tests-first, explicitly opt-in Stage 4B Worker completion-draft return bridge through the existing
  create-only worker_result_return boundary, using the verified Stage 4A pure composer. Preserve byte-for-byte legacy
  full Handoff v2 transport and validation behavior; do not activate draft mode in live Worker invocation or the governed
  cycle. Future runtime selection requires a separate governed Stage 4C gate.
scope:
- coordination/work_fronts/cf10_s4_result_return_opt_in_bridge_v0_1.yaml
- scripts/coordination/control_plane/worker_runtime/worker_result_return.py
- tests/coordination/control_plane/worker_runtime/test_cf10_s4_result_return_opt_in_v0_1.py
exclusions:
- No changes to s4_result_composer_v0_1.py or its Stage 4A tests; import and reuse its tested API without local forks.
- No changes to invocation_adapter.py, governed_worker_cycle.py, Makefile, Handoff v2 schema/validator, S4 validator,
  dispatcher, or authorization controls; no activation of new protocol in live Worker path.
- Do not silently overwrite malformed legacy Handoff v2 result origin fields or infer draft mode from a malformed/full
  frame. The existing full Handoff result frame must remain strict and unchanged by default.
- Do not parse mixed framing, multiple frames, trailing non-whitespace, duplicate JSON keys, arbitrarily large payloads,
  unrecognized properties, invalid data types, or a Worker-supplied origin snapshot as a successful completion.
- No fresh Git/roadmap queries for frozen S4, no recomputation of original SHA from canonical workspace, no Worker-supplied
  manifest SHA, cursor, source fingerprint or attempt override.
- No implicit operator approval, candidate acceptance, promotion, commit, merge, push, release, staging, or live dispatch.
  No new attempt a042.
- No modification, reclassification, repair, or replay of terminal a041 or other historical Worker attempt artifacts
  and ledger facts.
- No modification to Telegram Bot parallel staged files; respect staged/index bytes and pre-existing dirty working-tree
  modifications.

- Persistent MCP configuration becomes necessary.
- Manual MCP protocol implementation becomes necessary.
- Bash, unrestricted argv, arbitrary executable selection or arbitrary Make target exposure becomes necessary.
- SAFE_WRITE or canonical mutation authority becomes necessary.

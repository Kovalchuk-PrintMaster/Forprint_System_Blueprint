- CF-10/u180j ACTIVE sequence 67
- Worker Runtime Foundation Slice 1 PASS
- Internal Task Context Adapter Slice 2 PASS
- Isolated Workspace + Dispatch Preflight Slice 3 PASS
- reserved first-worker Work Front
- existing CF-09 TASK_EXECUTION preparation and Assistant ACK gate
- existing explicit dispatch-decision boundary
- canonical continuity source-state fingerprint
- light-maintenance@r1
- governed_canonical_mutation@0.1.0
outputs:
- One explicit CF-10 internal zero-stage exception encoded in the existing Dispatcher/control contract, not a parallel Dispatcher.
- The exception binds exactly work_id=u180j.
- The exception binds exactly module=forprint_system_blueprint.
- The exception binds exactly wf-cf10-zero-stage-dispatch-boundary-regression-v0-1.
- The exception binds exactly task_id=cf10-zero-stage-dispatch-boundary-regression-v0-1.
- The exception binds exactly light-maintenance@r1.
- The exception binds exactly governed_canonical_mutation@0.1.0.
- The exception binds exactly worker_id=worker-01 and attempt_id=cf10-u180j-a001.
- The exception is MANUAL/SHADOW and candidate-only.
- A source-state freeze manifest is captured immediately before real workspace provisioning.
- The first real isolated workspace is provisioned at /srv/software_development/forprint-worker-runtime/forprint_system_blueprint/worker-01/cf10-u180j-a001/.
- The provisioned workspace is revalidated against the frozen canonical durable source state before it may be considered dispatch-eligible.
- Workspace state is PROVISIONED_NOT_DISPATCHED.
- A structured pre-dispatch evidence packet proves broad trial readiness remains false/not-used and external authority remains
  blocked.
acceptance:
- The existing Dispatcher is extended; no parallel dispatcher or bypass path exists.
- The exception is exact-binding and fail-closed for any mismatched work/module/front/task/profile/procedure/worker/attempt
  value.
- The exception explicitly does not depend on BLUEPRINT_AI_TRIAL_READY=true.
- BLUEPRINT_AI_TRIAL_READY remains false/not emitted by this slice.
- The exception cannot authorize external/module dispatch.
- The exception cannot authorize release, push, merge, auto-ACCEPT or foreign write.
- Existing CF-09 preparation and Assistant ACK semantics remain unchanged.
- A valid ACK remains required before READY_FOR_EXPLICIT_DISPATCH.
- An explicit dispatch decision remains required after ACK.
- No worker process is launched.
- No provider/model runtime is called.
- Canonical attempt ledger remains unchanged.
- Real workspace source HEAD equals the immediately frozen canonical source HEAD.
- Real workspace durable dirty overlay exactly matches the frozen durable source state used for provisioning.
- Real workspace is an independent detached Git checkout outside canonical repo.
- Real workspace manifest records PROVISIONED_NOT_DISPATCHED.
- If canonical durable source state changes between freeze and final eligibility check, Slice 4 fails closed and the workspace
  is not dispatch-eligible.
- Focused Dispatcher/workspace tests, Ruff and git diff --check pass.
- u180j remains ACTIVE and roadmap remains IN_SYNC.
stop_conditions:
- The broad BLUEPRINT_AI_TRIAL_READY gate would need to be set true.
- The exception cannot be expressed as an exact CF-10-only extension of the existing Dispatcher.
- The implementation would create a generic internal-dispatch bypass.
- Any external/module dispatch could pass the exception.
- Assistant ACK or explicit dispatch-decision boundaries would be weakened.
- Canonical source state changes during the freeze/provision/eligibility boundary.
- The exact real workspace path already exists before provisioning.
- Workspace equivalence validation fails.
- Provisioning writes into the canonical working tree or canonical Git metadata.
- A canonical attempt-ledger append becomes necessary before worker launch.
- Worker/provider launch is requested.
- Any release, push, merge, automatic ACCEPT, foreign-repository write, lifecycle or roadmap mutation is requested.

work_front_id: wf-cf10-internal-dispatch-exception-real-workspace-v0-1
objective: Implement the explicitly bounded CF-10 Blueprint-internal zero-stage dispatch exception and provision the first
  real isolated worker workspace without launching a worker. The exception must coexist with BLUEPRINT_AI_TRIAL_READY=false,
  apply only to the exact u180j/first-worker bindings, preserve all CF-09 ACK and explicit-dispatch boundaries, and grant
  no external dispatch, release, push, merge or foreign-repository-write authority.
scope:
- scripts/coordination/control_plane/dispatch_intent.py
- coordination/standards/automation/control_plane/central_listener_dispatcher_monitor_v0_1.yaml
- scripts/coordination/control_plane/workspace/
- scripts/validation/validate_cf10_internal_dispatch_exception_real_workspace_v0_1.py
- tests/coordination/control_plane/test_cf10_internal_zero_stage_dispatch_exception_v0_1.py
- tests/coordination/control_plane/workspace/
- /srv/software_development/forprint-worker-runtime/forprint_system_blueprint/worker-01/cf10-u180j-a001/
exclusions:
- Do not set or emit BLUEPRINT_AI_TRIAL_READY=true.
- Do not modify the CF-19/CF-20 broad trial readiness gate.
- Do not generalize the exception to other Blueprint tasks, workers, work IDs, profiles, procedures, modules or repositories.
- Do not allow Logistics or any external module to use the CF-10 exception.
- Do not bypass Work Front, Execution Profile, Governed Procedure, Handoff v2, Assistant ACK or explicit dispatch-decision
  boundaries.
- Do not launch a worker process in this slice.
- Do not invoke provider/model worker runtime in this slice.
- Do not append a canonical Execution Attempt Ledger row in this slice.
- Do not finalize Dispatcher execution or ingest a worker result.
- Do not implement candidate promotion in this slice.
- Do not commit, push, merge, release or automatically ACCEPT.
- Do not write any foreign repository.
- Do not mutate lifecycle or roadmap state.
- Do not copy continuity-excluded tmp/runtime debris into the real workspace.
- Do not reuse an existing runtime directory if the exact first workspace path already exists; fail closed instead.

work_front_id: wf-cf10-worker-result-return-s4-resume-binding-hardening-v0-1
objective: >-
  Extend the existing governed Worker result-return boundary so S3-valid provider
  results are materialized only when their S4 resume bindings exactly match the
  attempt-bound governed Worker context, while also hardening the Worker prompt
  against cryptographic-value transcription drift.
scope:
  - scripts/coordination/control_plane/worker_runtime/invocation_adapter.py
  - scripts/coordination/control_plane/worker_runtime/worker_result_return.py
  - scripts/coordination/control_plane/governed_worker_cycle.py
  - tests/coordination/control_plane/worker_runtime/test_cf10_worker_result_return_v0_1.py
  - tests/coordination/control_plane/worker_runtime/test_cf10_worker_runtime_invocation_adapter_v0_1.py
  - tests/coordination/control_plane/test_cf10_governed_worker_cycle_result_return_v0_1.py
exclusions:
  - Do not modify the Handoff v2 result schema or S3 result validator.
  - Do not weaken or replace the canonical S4 freshness/resume validator.
  - Do not change the Execution Attempt Ledger contract or historical a034 records.
  - Do not rewrite, repair, synthesize or normalize Worker result semantic values.
  - Do not modify Task70 candidate implementation files.
  - Do not relaunch or replay cf10-u180j-a034.
  - Do not prepare or launch a035 in this slice.
  - Do not mutate lifecycle or roadmap state.
  - Do not modify Makefile; reuse the existing cf10-worker-result-return-check surface and run invocation-adapter regression separately.
  - Do not add automatic acceptance, promotion, retry, commit, push, merge or release behavior.
  - Do not touch inherited protected dirty paths.
  - Do not broaden provider tools, shell, argv, environment or filesystem authority.

  - host-evidence:GitHub Copilot CLI 1.0.86
  - operator-evidence:copilot-device-auth-success
  - operator-evidence:FORPRINT_RUNTIME_OK
  chat_is_authority: false
dependencies:
- CF-10/u180j ACTIVE sequence 67
- Slice 4 real workspace PROVISIONED_NOT_DISPATCHED
- Slice 5 first-worker-launch Work Front PASS
- existing worker runtime/invocation contract
- existing CONSOLE_COMMAND / ARGV_NO_SHELL provider adapter interface
- GitHub Copilot CLI installed at /usr/local/bin/copilot
- GitHub Copilot CLI authenticated outside Git
- Copilot connectivity response FORPRINT_RUNTIME_OK
outputs:
- A canonical worker runtime adapter registry with provider/runtime identities separate from worker identity.
- A module-owned config/worker_runtime.yaml for forprint_system_blueprint.
- Configured provider id github_copilot_cli with state READY.
- Copilot executable bound to /usr/local/bin/copilot.
- Copilot auth recorded only as external_runtime_auth with no token value.
- Copilot default model selection remains runtime-selectable; model=auto may be the initial default but is not architectural
  authority.
- Reserved registry identities openai_codex_cli, anthropic_claude_code and xai_grok_cli with state NOT_CONFIGURED.
- Reserved providers have no fabricated command, model, credential or readiness.
- 'A common runtime capability model: provider adapter, command representation, model selection, auth mode, network policy,
  timeout, budget, working directory, tool policy and completion capture.'
- A common benchmark contract recording provider_id, runtime_id, model_id, task_id, attempt_id, result state, tests, governance
  checks, scope violations, changed paths, retries, duration, exit code, observable usage/cost and human review.
- Registry validation proving provider selection does not grant execution/dispatch/release authority.
acceptance:
- worker-01 remains provider-neutral.
- Provider selection occurs per attempt/runtime binding.
- 'Exactly one configured READY provider exists after Slice 5A: github_copilot_cli.'
- github_copilot_cli command is an argv/no-shell binding to /usr/local/bin/copilot.
- Copilot runtime config contains no token, password, secret or credential value.
- Codex/Claude/Grok registry rows exist only as NOT_CONFIGURED future adapters.
- NOT_CONFIGURED rows contain no guessed executable/argv/model/secret.
- All providers reuse the same Work Front/Task Envelope/Handoff/Dispatcher/workspace/result boundaries.
- Benchmark metadata is provider-neutral and comparable across adapters.
- Runtime registry does not grant Assistant ACK, dispatch, release, push, merge, foreign-write or automatic acceptance authority.
- Current a001 workspace remains untouched and stale until the next controlled refresh/reseal boundary.
- Focused pytest, Ruff, validation and git diff --check pass.
- u180j remains ACTIVE sequence 67 and roadmap remains IN_SYNC.
stop_conditions:
- Implementation would bind worker-01 permanently to Copilot.
- Implementation requires provider-specific changes to Work Front, Handoff, Dispatcher or workspace contracts.
- A provider token/secret would need to be committed or printed.
- Copilot executable /usr/local/bin/copilot is no longer present or executable.
- Copilot connectivity/auth can no longer be confirmed without starting the real worker attempt.
- Codex/Claude/Grok would need guessed commands or readiness values.
- Any ACK, explicit dispatch, attempt append or worker process launch would occur.
- Any broad trial gate, release authority, foreign write or lifecycle mutation would be required.

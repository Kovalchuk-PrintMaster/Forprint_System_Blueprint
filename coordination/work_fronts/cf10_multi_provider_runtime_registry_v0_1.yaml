work_front_id: wf-cf10-multi-provider-runtime-registry-v0-1
objective: Extend the existing provider-neutral worker runtime contract with one reusable multi-provider runtime registry
  and a module-owned Blueprint runtime profile. Register GitHub Copilot CLI as the first configured READY runtime candidate,
  reserve normalized provider identities for native OpenAI Codex CLI, Anthropic Claude Code and xAI Grok CLI without inventing
  their commands or credentials, and define common benchmark metadata so future attempts can compare runtime, model, quality,
  validation, latency and cost evidence under the same worker/workspace/Handoff/Dispatcher architecture.
scope:
- config/worker_runtime.yaml
- coordination/registry/worker_runtime_adapters_v0_1.yaml
- coordination/standards/automation/worker_runtime_adapter_registry_contract_v0_1.yaml
- coordination/standards/automation/worker_runtime_benchmark_contract_v0_1.yaml
- coordination/standards/automation/index.yaml
- scripts/coordination/control_plane/worker_runtime/
- scripts/validation/validate_cf10_multi_provider_runtime_registry_v0_1.py
- tests/coordination/control_plane/worker_runtime/
- tests/validation/test_cf10_multi_provider_runtime_registry_contract_v0_1.py
exclusions:
- Do not replace Work Front, Task Envelope, Handoff v2, Dispatcher, workspace or Attempt Ledger with provider-specific frameworks.
- Do not make worker-01 permanently synonymous with any provider.
- Do not make GitHub Copilot an architectural authority.
- Do not invent native Codex, Claude or Grok executable paths or CLI arguments.
- Do not mark Codex, Claude or Grok READY until separately installed/authenticated/validated.
- Do not store GitHub, OpenAI, Anthropic, xAI or any other secret/token value in Git.
- Do not serialize runtime token values into config, registry, manifests or logs.
- Do not consume Assistant ACK.
- Do not create an explicit dispatch decision.
- Do not append a launch attempt to the canonical Execution Attempt Ledger.
- Do not launch a worker process.
- Do not refresh/reseal the real a001 workspace in this slice; that occurs after the registry/config implementation is complete
  so one final canonical source snapshot is used before ACK.
- Do not set BLUEPRINT_AI_TRIAL_READY=true.
- Do not allow external/module dispatch.
- Do not commit, push, merge, release or auto-ACCEPT.
- Do not write a foreign repository.
- Do not mutate lifecycle or roadmap state.

  - coordination/standards/governance/accept_and_advance_protocol_v0_1.md
  - coordination/standards/governance/immutable_prompt_adjustment_and_decision_v0_1.md
  - coordination/standards/automation/work_front_contract_v0_1.yaml
provenance:

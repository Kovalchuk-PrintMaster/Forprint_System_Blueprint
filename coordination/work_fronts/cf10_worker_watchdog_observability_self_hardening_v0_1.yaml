work_front_id: wf-cf10-worker-watchdog-observability-self-hardening-v0-1
objective: Extend the existing worker process launcher with deterministic watchdog/heartbeat observability so running
  progress, bounded stall evidence and timeout outcomes are distinguishable without granting retry, dispatch or
  remediation authority.
scope: &id001
- scripts/coordination/control_plane/worker_runtime/launcher.py
- tests/coordination/control_plane/worker_runtime/test_cf10_worker_process_launcher_v0_1.py
exclusions:
- Do not create a new worker launcher, dispatcher or daemon.
- Do not modify Execution Attempt Ledger semantics or history.
- Do not modify lifecycle, roadmap, Work Front authority, Handoff, provider registry or task materialization surfaces.
- Do not add autonomous retry, restart, dispatch, kill-on-stall or remediation behavior.
- Timeout handling may remain the existing bounded termination path; stall evidence must be observational only.
- Do not modify Makefile.
- Do not write another repository.
- Do not commit, push, merge, release or automatically ACCEPT results.

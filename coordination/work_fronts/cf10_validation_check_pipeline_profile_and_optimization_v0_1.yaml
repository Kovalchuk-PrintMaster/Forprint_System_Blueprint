    - coordination/standards/automation/validation_suite_registry_v0_1.yaml
    - coordination/work_fronts/validation_suite_operator_surface_foundation_v0_1.yaml
    - coordination/work_fronts/cf10_verification_tier_self_hardening_v0_1.yaml

exclusions:
- Do not rewrite any a003 or a004 attempt record.
- Do not collapse STARTED and terminal records into one file.
- Do not delete failed or blocked attempt history.
- Do not modify a007 or any later retry attempt record.
- Do not create a new execution attempt.
- Do not consume Assistant ACK.
- Do not dispatch, retry, restart, approve, accept, promote, commit, push, merge or
  release a worker.
- Do not modify continuity lifecycle events or roadmap execution state.
- Do not modify generated projections, indexes/*, machine/* or unrelated dirty worktree
  paths.
- Do not use git add -A, git add ., git clean, stash, rebase or hard reset.

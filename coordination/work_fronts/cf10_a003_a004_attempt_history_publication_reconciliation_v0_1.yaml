dependencies:
- Execution Attempt Ledger storage is append-only immutable files.
- Duplicate attempt_id is permitted only for a controlled terminal transition.
- a003 STARTED/PENDING precedes its FINISHED/FAILED terminal record.
- a004 STARTED/PENDING precedes its BLOCKED/BLOCKED terminal record.
- a007 exists as a later retry with retry_of_attempt_id=cf10-u180j-a004.
- Main staging is empty before publication preparation.
outputs:
- Four immutable historical attempt records become tracked canonical fact history.
- a003 FAILED history remains intact and unmodified.
- a004 BLOCKED history remains intact and unmodified.
- The existing a007 retry chain remains resolvable from clean checkout.
- No lifecycle or execution authority is changed.
acceptance:
- This Work Front validates.
- Canonical Execution Attempt Ledger validator passes.
- The four attempt records are byte-preserved and staged without edits.
- a003 pair validates as STARTED/PENDING then FINISHED/FAILED.
- a004 pair validates as STARTED/PENDING then BLOCKED/BLOCKED.
- a007 retry_of_attempt_id resolves to a004.
- Staging contains exactly this Work Front plus the four attempt records.
- git diff --cached --check passes.
stop_conditions:
- HEAD no longer starts at c83ff1f before staging.
- Main staging is non-empty.
- Any attempt record is already tracked under unexpected history.
- Any a003/a004 immutable record would need content mutation.
- a007 retry linkage to a004 cannot be proven.
- Ledger semantics differ from append-only immutable controlled terminal transitions.
- Any unrelated path would be staged.

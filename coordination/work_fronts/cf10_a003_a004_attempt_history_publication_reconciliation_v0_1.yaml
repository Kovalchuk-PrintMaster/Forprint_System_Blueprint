work_front_id: wf-cf10-a003-a004-attempt-history-publication-reconciliation-v0-1
objective: Publish the four previously untracked immutable Execution Attempt Ledger
  records that preserve the controlled STARTED-to-terminal transitions for CF-10 attempts
  a003 and a004, without rewriting their content or changing execution, lifecycle,
  dispatch, acceptance, retry or release authority.
scope:
- coordination/work_fronts/cf10_a003_a004_attempt_history_publication_reconciliation_v0_1.yaml
- coordination/continuity/execution_attempts/cf10-u180j-a003__571944de6a4e.yaml

exclusions:
- No modifications outside the seven exact scope paths, including Stage 1/2 files or separate ForPrint modules.
- No new command executor, raw shell, arbitrary Git arguments, cwd/path override, arbitrary executable selection,
  web access or builtin MCPs.
- No changes to S3/S4, Worker result-return, original Handoff evidence, lifecycle ledger, candidate promotion
  or automated execution authority.
- No mutation of existing S4 literal capsule implementation or previously established invocation and validation
  behavior.
- No overwrite or replacement of any pre-existing dirty path; additive changes within existing dirty paths require
  explicit separate operator approval after per-path SHA and exact diff-hunk review.
- No changes to existing repo_diff_check or validation_suite definitions, and no removal of OC01 compatibility.
- No worker prepare, ACK, dispatch, launch, result replay, acceptance, stage, commit, push, merge, release or
  promotion.
- No modification of historical execution attempts a037-a041, and no fabrication of origin or Worker evidence.

work_front_id: wf-cf10-worker-git-readonly-capabilities-v0-1
objective: Expose the two existing fixed Git read-only capabilities repo_head and repo_status to the CF-10 Worker
  through the existing structured command executor, attempt-bound ForPrintValidation MCP bridge and session-only
  Copilot invocation, without shell, arbitrary parameters, added authority, or disturbance of earlier S4 and validation
  work.

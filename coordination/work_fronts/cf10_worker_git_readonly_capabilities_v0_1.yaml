dependencies:
- Stage 1 blueprint-continuity-planning suite is registered and passed 33 tests.
- Stage 2 explicit isolated prerequisites passed all four mirror-only steps, 33 planning tests, 64 cf10-worker-pipeline
  tests and 35 focused validation/isolation tests.
- Current terminal a041 remains immutable BLOCKED; Worker a042 must not launch as part of this Work Front.
- Existing repo_head@0.1.0 and repo_status@0.1.0 are fixed Git, shell=false, EMPTY_OBJECT, NONE_EXPECTED, scoped
  to exact Git root with external evidence.
- Both capabilities currently declare OC01 compatibility only; registry metadata alone does not grant Worker execution
  authority.
- ForPrintValidation currently exposes exactly run_validation_suite and run_repo_diff_check; Copilot tool universe
  and session-only MCP config expose those exact two.
- Invocation adapter contains pre-existing S4 literal resume capsule dirty work, and validation MCP tests contain
  existing Stage 1 additions; both must be frozen before any bounded implementation.
- Before first mutation capture source HEAD, staged/unstaged path lists, per-path sha256 snapshots of seven scoped
  paths, existing untracked work and protected S4 hunk; stop on concurrent drift.
- Only an operator-approved, additive scoped edit to the pre-existing dirty invocation_adapter.py may be attempted;
  Work Front validation alone is not approval.
outputs:
- CF10 added to consumer_compatibility only for the existing fixed repo_head and repo_status entries, retaining
  OC01.
- Exactly two new zero-argument MCP tools run_repo_head and run_repo_status using existing registered capabilities,
  attempt identity, exact isolated workspace cwd and external evidence root.
- Provider session-only MCP config, model-visible tool identifiers and separate permission patterns expose exactly
  four bounded MCP tools alongside existing view/edit/apply_patch.
- Exact positive and negative focused regressions for both tool requests, fixed argv and no Worker-supplied hidden
  execution fields.
- Machine-readable verified evidence of source-preserving test execution, with separate acknowledgment that workspace
  HEAD/status are not independent canonical source-state proof.
- No new Worker attempt or authority widening.
acceptance:
- Canonical Work Front validation passes and explicit protected-dirty-path operator gate precedes invocation adapter
  edit.
- Tests-first RED fails specifically because repo_head/repo_status are not CF10 model-visible tools; regression
  GREEN passes after exact bounded changes.
- repo_head and repo_status remain fixed Git at 0.1.0 with git --no-optional-locks, shell=false, EMPTY_OBJECT,
  read-only and no new executable arguments.
- CF10 consumer compatibility is declared without removing OC01 or adding authority to the registry.
- Each new MCP tool rejects any arguments, including cwd, executable, timeout, argv, git command, shell, evidence
  path, or identity override.
- Structured command requests are bound to exact attempt_id/task_id/work_front_id/dispatch decision, workspace
  Git root and external evidence root.
- All tools/list, Copilot --available-tools, mcpServers tools and provider policy IDs match the exact four-tool
  allowlist.
- Existing view/edit/apply_patch, run_validation_suite, run_repo_diff_check and S4 literal capsule behavior remain
  unchanged.
- Existing focused structured command, MCP, invocation adapter tests pass, together with two registered CF10 validation
  suites.
- No protected path contents change outside explicitly reviewed additive hunks; SHA manifests and per-path diff
  evidence are generated before and after and separately reviewed.
- No staging, historical ledger mutation, worker process launch, canonical write or release happens.
stop_conditions:
- New changes overlap a pre-existing dirty S4 capsule or any Stage 1/2 work beyond the approved isolated hunks.
- No explicit operator approval for an additive edit to dirty invocation_adapter.py after hash/hunk inspection.
- Any relevant source HEAD, staged index, protected dirty path hash or scoped test baseline drifts unexpectedly.
- The existing structured command executor, provider runtime contract, or S4 validator would need modification.
- A caller-controlled Git argv, shell, cwd, timeout, evidence path or identity becomes necessary.
- The tests cannot prove zero-parameter registration and exact workspace binding or fail closed on tampering.
- Any path outside exact seven-path scope must be modified.
- Any live launch, ledger append, promotion, auto-staging, commit, push, merge or release is required.

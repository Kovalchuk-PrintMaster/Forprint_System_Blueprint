work_front_id: wf-cf10-governed-worker-cycle-slice-b1-runtime-bridge-v0-1
objective: Add the missing execution-side Worker Runtime invocation bridge for the published CF-10 Governed Worker
  Cycle foundation. The bridge must turn an already-authorized CF-10 explicit-dispatch decision plus the canonical
  MANUAL_INTERNAL Task Envelope and runtime registry into one deterministic provider invocation plan without granting
  authority or starting a process.
scope:
- coordination/work_fronts/cf10_governed_worker_cycle_slice_b1_runtime_bridge_v0_1.yaml
- scripts/coordination/control_plane/worker_runtime/invocation_adapter.py
- tests/coordination/control_plane/worker_runtime/test_cf10_worker_runtime_invocation_adapter_v0_1.py
- Makefile
exclusions:
- Do not modify scripts/coordination/control_plane/governed_worker_cycle.py in B1.
- Do not modify scripts/coordination/control_plane/worker_runtime/launcher.py.
- Do not modify scripts/coordination/control_plane/worker_runtime/registry.py.
- Do not modify scripts/coordination/build_worker_invocation.py or weaken its DRY_RUN_ONLY_V0_1 boundary.
- Do not modify scripts/coordination/control_plane/dispatch_intent.py.
- Do not modify Assistant Handoff v2 runtime or contracts.
- Do not modify Execution Attempt Ledger runtime or contracts.
- Do not materialize or launch Task60.
- Do not start any Worker process.
- Do not append any canonical Execution Attempt Ledger record.
- Do not promote any candidate into the canonical repository.
- Do not stage, commit, push, merge, release or automatically ACCEPT.
- Do not mutate lifecycle or roadmap state.
- Do not write any foreign repository.
- Do not infer provider commands for NOT_CONFIGURED providers.

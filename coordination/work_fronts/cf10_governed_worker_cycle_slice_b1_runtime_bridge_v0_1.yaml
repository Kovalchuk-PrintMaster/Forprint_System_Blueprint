dependencies:
- Published Governed Worker Cycle Slice A commit 29b71c96265f71a83f93f832990a89b0e03af996.
- Current runtime registry resolves exactly one READY provider.
- config/worker_runtime.yaml keeps provider selection authority-neutral.
- Runtime command representation remains ARGV_NO_SHELL.
- Runtime config keeps exact_runtime_argv_deferred_to_launch_adapter=true.
- MANUAL_INTERNAL Task Context exposes the normalized Worker Task Envelope.
- CF-10 training dispatch remains the source of explicit process-launch authority.
outputs:
- One authority-neutral execution-side invocation adapter under worker_runtime.
- One generic Worker prompt renderer driven by the normalized Task Envelope rather than Task50-specific prose.
- One deterministic github_copilot_cli argv renderer owned by the launch adapter.
- One invocation plan carrying prompt/argv hashes, log/evidence paths and launch timing policy without starting a
  process.
- Focused regressions proving authority, workspace, provider and task-binding fail-closed behavior.
- One Makefile operator check for the runtime invocation bridge.
acceptance:
- No provider-specific argv is added to governed_worker_cycle.py.
- The adapter consumes only an already-authorized explicit-dispatch decision and never creates authority.
- Task Envelope identity, Work Front identity, profile, procedure, runtime provider, runtime model and workspace bindings
  are cross-checked.
- Only github_copilot_cli is renderable in v0.1; future NOT_CONFIGURED providers fail closed.
- Provider-specific argv is isolated inside the launch adapter.
- The adapter reads max_ai_credits and timeout from canonical runtime configuration.
- The generated prompt is task-generic and contains the canonical normalized Task Envelope.
- The adapter performs no filesystem mutation and no subprocess start.
- Existing DRY_RUN_ONLY console-worker adapter semantics remain unchanged.
- Focused tests, existing Governed Worker Cycle tests, runtime registry validation and git diff --check pass.
stop_conditions:
- The implementation would require changing Dispatcher, Handoff v2, Ledger or launcher semantics.
- The implementation would require weakening the existing dry-run worker invocation contract.
- Provider-specific command logic would have to be placed in governed_worker_cycle.py.
- A future provider command/model/tool policy would need to be guessed.
- Any process launch, attempt append, candidate promotion, acceptance or publication action would occur.
- A path outside the exact Work Front scope becomes necessary.
- Authority widening is requested or inferred.

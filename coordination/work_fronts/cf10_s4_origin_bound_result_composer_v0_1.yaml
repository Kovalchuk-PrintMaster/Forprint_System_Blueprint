work_front_id: wf-cf10-s4-origin-bound-result-composer-v0-1
objective: Implement and test a pure, opt-in, deterministic S4 Handoff v2 result candidate composer, deriving all
  frozen base resume coordinates exclusively from validated original governed Worker context and preserving Worker-owned
  result facts without copying authoritative SHA strings through an LLM. Stage 4A is an isolated foundation proof,
  not live Worker result-return integration.
scope:
- coordination/work_fronts/cf10_s4_origin_bound_result_composer_v0_1.yaml
- scripts/coordination/control_plane/worker_runtime/s4_result_composer_v0_1.py
- tests/coordination/control_plane/worker_runtime/test_cf10_s4_result_composer_v0_1.py
exclusions:
- No modification to any existing production or test file in Stage 4A, particularly dirty invocation_adapter.py
  and governed_worker_cycle.py.
- Do not modify the existing assistant Handoff v2 result schema, S4 validator, worker_result_return.py, worker stdout
  frame grammar, or the current legacy result-return handling.
- No implicit correction or silent replacement of Worker-supplied mismatched resume fields; Worker-owned facts and
  trusted origin must be provenance-separated and contradictions rejected before candidate assembly.
- No reading fresh canonical roadmap state in place of frozen origin, no hash recomputation from current worktree
  for S4 origin fields, no fallback guessed SHA/cursor values.
- No result/worker_result.yaml write, stdout rewrite, ledger append, worker prepare, ACK, dispatch, launch, re-run,
  candidate promotion or acceptance.
- No staging, commit, push, merge, release, automatic validation bypass, or changes to Telegram Bot parallel staged
  files.
- No modification of historical attempt artifacts a037-a041; a041 remains terminal BLOCKED and a042 must not be
  launched by this Work Front.

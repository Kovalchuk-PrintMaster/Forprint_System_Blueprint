  - coordination/standards/automation/control_plane/central_listener_dispatcher_monitor_v0_1.yaml
  - coordination/work_fronts/cf10_operator_status_surface_self_hardening_v0_1.yaml
  chat_is_authority: false
dependencies:
- worker_watchdog_observability_self_hardening is accepted, published and post-publication revalidated at f3811072006f9a4cc9ae0446492523a8f87c313d.
- cf10-u180j-a009 is terminal FINISHED/SUCCEEDED with validator PASS.
- Execution Attempt Ledger already exposes read-only deterministic latest-attempt status and remains the durable
  attempt/status truth.
- Published worker launcher now exposes deterministic heartbeat, progress, stall and timeout evidence without remediation.
- The existing central listener/dispatcher monitor contract keeps telegram_required=false and requires no daemon/systemd
  surface.
outputs:
- One local read-only Telegram/operator projection module under scripts/coordination/control_plane.
- One deterministic Telegram-ready text renderer over existing ledger and optional watchdog/process evidence.
- Explicit ACTIVE/STALLED/TIMEOUT/FINISHED classification when supported by source facts and UNKNOWN when live facts
  are absent.
- Focused tests proving no dispatch or authority widening and no Telegram network transport.
acceptance:
- Only the two declared scope files are changed by the worker.
- The projection reuses existing immutable ledger facts and watchdog evidence without introducing another state
  authority.
- Operator-visible output deterministically distinguishes ACTIVE, STALLED, TIMEOUT and FINISHED when evidence supports
  them.
- Insufficient live evidence is reported as UNKNOWN.
- Telegram output is render-only and performs no network call.
- No external dispatch widening, retry, approval, promotion, publication or automatic acceptance authority is introduced.
- Focused regression tests pass.
- git diff --check passes in the isolated worker workspace.
- No lifecycle mutation, roadmap mutation, cross-module write, commit, push, merge, release or automatic ACCEPT
  occurs.
stop_conditions:
- A path outside the two declared scope files must be modified.
- A new mutable status store or duplicate execution-state source of truth becomes necessary.
- Execution Attempt Ledger, launcher, dispatcher, lifecycle, roadmap, Handoff, provider registry, central monitor
  contract or Makefile mutation becomes necessary.
- Telegram network transport or credentials become necessary.
- Reliable status would require inference beyond registered facts.
- Any execution/dispatch/retry/approval authority widening is required.
- Any cross-module write, commit, push, merge, release or automatic ACCEPT is requested.
- Required governed context is stale or inconsistent.

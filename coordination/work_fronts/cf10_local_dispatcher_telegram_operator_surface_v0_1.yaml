work_front_id: wf-cf10-local-dispatcher-telegram-operator-surface-v0-1
objective: Add one bounded local Telegram-ready operator convenience surface that projects existing registered worker/Dispatcher
  facts for a human operator without becoming an execution or status authority.
scope:
- scripts/coordination/control_plane/telegram_operator.py
- tests/coordination/control_plane/test_cf10_local_dispatcher_telegram_operator_surface_v0_1.py
exclusions:
- Do not modify Execution Attempt Ledger implementation or history.
- Do not modify worker_runtime/launcher.py or its timeout/watchdog semantics.
- Do not modify Dispatcher dispatch/ACK/authorization behavior.
- Do not modify lifecycle, roadmap, Handoff or provider registry.
- Do not modify central_listener_dispatcher_monitor_v0_1.yaml.
- Do not modify Makefile.
- Do not create a mutable status store or duplicate execution-state authority.
- Do not implement Telegram Bot API/network sending in this task.
- Do not add bot credentials, chat IDs or secrets.
- Do not create a daemon, listener service, systemd unit or background poller.
- Do not write another ForPrint module repository.
- Do not commit, push, merge, release or automatically ACCEPT worker results.

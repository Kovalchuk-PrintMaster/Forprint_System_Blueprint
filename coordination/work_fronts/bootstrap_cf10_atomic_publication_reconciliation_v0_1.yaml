outputs:
- One canonical atomic commit containing exactly the meta Work Front plus the validated
  33-path child publication packet.
- A clean checkout whose roadmap execution reconciliation resolves latest_event_sequence=67.
- A clean checkout whose root standards validation no longer depends on unpublished
  bootstrap/worker standards.
- Preservation of all unrelated parallel worktree changes outside the commit.
acceptance:
- This Work Front validates before staging.
- The final isolated candidate contains exactly 34 publication paths.
- The automation index cached diff contains only the five allowed worker registrations.
- The bootstrap v0.1 superseded Work Front is absent.
- task_context_adapter.py is absent.
- Generated projection files are absent from the publication path set.
- All previously passing bootstrap and CF-10 focused validators/tests remain green.
- Roadmap sync/check returns IN_SYNC with latest_event_sequence=67.
- git diff --check passes.
- Main staging contains exactly the approved 34 paths before commit.
- The atomic commit is operator-controlled.
- Push is performed only after post-commit clean-checkout verification and upstream
  freshness check.
stop_conditions:
- HEAD changes before staging and the exact candidate is not revalidated against the
  new HEAD.
- Main staging is non-empty before publication preparation.
- Any unrelated worktree path would be staged.
- automation/index.yaml requires staging any diff beyond the five allowed worker registrations.
- Any bounded validator or focused test fails.
- Roadmap reconciliation is not IN_SYNC at latest_event_sequence=67.
- A generated projection would enter the publication set.
- Publication would require task_context_adapter.py or the superseded bootstrap v0.1
  Work Front.
- Upstream diverges before push.

objective: >-
  Verify the existing Blueprint NEXT_HORIZON and roadmap execution reconciliation
  chain against canonical roadmap plus append-only continuity events. Prove
  deterministic stale-detection, exact refresh, transition and consumer-freshness
  behavior before making any code changes. Repair only an evidenced gap within
  the existing Blueprint continuity adapter if the tests show one.
scope:
  - scripts/coordination/blueprint_continuity_adapter_v0_1.py
  - tests/validation/test_continuity_projections_v0_1.py
  - tests/validation/test_roadmap_execution_reconciliation_v0_1.py
  - tests/validation/test_assistant_handoff_compiler_v0_1.py
exclusions:
  - Do not create a second NEXT_HORIZON generator, projection store, task status registry, or reconciliation runtime.
  - Do not change scripts/coordination/roadmap_execution_reconciliation.py or scripts/coordination/build_continuity_projections.py without a separately approved scope revision.
  - Do not change Makefile, indexes, generator registries, global policy, training queue, or any roadmap specification in this Worker slice.
  - Do not modify continuity event records, execution attempts, accepted Worker results, historical decisions, or publication evidence.
  - Do not modify coordination/continuity/projections or coordination/roadmap_execution/projections as tracked sources; generated refresh is separately governed.
  - Do not silently run refresh as a side effect of a check or treat generated projections as execution authority.
  - Do not require pristine Git; preserve existing 20 unrelated dirty paths and their exact bytes.
  - Do not modify GDL, Prepress Hub, or another ForPrint module repository.
  - Do not launch, retry, dispatch, auto-ACCEPT, promote, commit, push, merge, or release another Worker.
  - Do not infer that Task70 ACCEPT equals a CF-10 work lifecycle closure or a Task80 dispatch authorization.

dependencies:
  - Task70 accepted Worker attempt cf10-u180j-a040 is bound to its exact Work Front and operator ACCEPT, and its required evidence SHA-256 checks passed on s01 on 2026-10-11.
  - CF-10 work u180j remains ACTIVE; do not append a WORK_CLOSED event for the broader CF-10 contour.
  - Roadmap reconciliation reports IN_SYNC at continuity event sequence 67; event store validation reports PASS.
  - Existing roadmap projection check demonstrated PASS with 15 tests; continuity projection refresh then check demonstrated PASS with 13 tests.
  - Existing NEXT_HORIZON already derives from roadmap_execution_reconciliation.compute, carries roadmap SHA and event sequence, and is not authoritative.
  - Task current-state relevance is re-evaluated immediately before materialization and before execution; these historical facts are not an unlimited freshness waiver.
  - Preserve the single active writable actor per module repository; use an isolated Worker workspace for test-driven execution.
outputs:
  - A current-state capability inventory mapping every Task80 acceptance criterion to existing production code, test evidence, or a precise missing test/behavior.
  - Isolated deterministic tests showing roadmap revision and new continuity event can stale existing derived projections, without changing canonical sources in the real repo.
  - Tests for non-mutating exact checks, explicitly authorized refresh, and unchanged generated-only/manual-edit-forbidden/no-auto-dispatch authority semantics.
  - Proof that NEXT_HORIZON reflects the current roadmap execution cursor, including sequence, SHA, current and next step and action ordering.
  - Proof that Handoff compilation derives current horizon rather than silently treating a saved stale YAML file as authority.
  - At most one minimal adapter repair within the declared scope, and only after a demonstrated failing semantic test; otherwise an ALREADY_VERIFIED/NO_PRODUCTION_CHANGE result with evidence.
  - A Worker/Handoff result with exact changed-path list, test outcomes, hashes, blockers and any explicitly deferred gaps.
acceptance:
  - Before Worker mutation, confirm Task70 evidence, current-state relevance, roadmap IN_SYNC, fresh source fingerprint and protected dirty baseline.
  - All Task80 existing surfaces have REUSE or EXTEND evidence; no competing planning engine is introduced.
  - A synthetic roadmap change and a synthetic event transition each cause stale output detection against the previous projection snapshot.
  - Exact check never alters canonical roadmap, events, current HEAD, or generated files; refresh is separate and explicitly invoked.
  - Recomputing from unchanged sources is deterministic and converges to PASS after the authorized refresh.
  - NEXT_HORIZON current/next/ready state and action list are derived from canonical roadmap and continuity events rather than checkpoint historical intent.
  - Generated projection files remain non-authoritative, generated_only=true and manual_edit_forbidden=true; no auto-activation or dispatch capability is introduced.
  - Handoff cannot silently reuse a stale persisted NEXT_HORIZON as present operational truth.
  - Existing roadmap reconciliation and continuity projection validations remain passing, including prior regression tests.
  - Test fixtures are isolated; no live event is appended, historical result altered, or existing dirty file overwritten.
  - Only files in the four-path scope may be changed by the future Worker; if a fix requires another path, stop and request an exact-scope amendment.
  - A verified no-code-change outcome is acceptable if all criteria already pass; operator review still governs any Task80 ACCEPT or training progression.
  - No lifecycle/roadmap mutation, GDL change, cross-module write, Worker launch, automatic ACCEPT, commit, push, merge or release.
stop_conditions:
  - Current source differs from the freshly reviewed execution/dirty baseline without a new controlled relevance review.
  - Task70 accepted evidence is missing, contradictory or source bindings no longer validate.
  - Roadmap or lifecycle is stale, conflicting or unknown at preparation or execution boundary.
  - Another active canonical writable actor owns this module repository.
  - The requested behavior is already proved and proposed code changes would only duplicate existing capability.
  - A repair needs an additional write path, modifies semantics outside Task80, or touches protected dirty paths.
  - An auto-refresh side effect would mask stale projection state or grant execution/dispatch authority.
  - The test scenario requires changing real continuity events rather than fixture copies.
  - A future Worker return lacks valid attempt-bound machine-readable result evidence.

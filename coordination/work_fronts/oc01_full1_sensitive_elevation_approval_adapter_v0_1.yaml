exclusions:
- SAFE_WRITE enablement
- canonical session or lease implementation
- live process cancellation
- capability registry implementation
- commit authority
- push authority
- merge authority
- release authority
- promotion authority
- arbitrary shell or command text
- parallel approval system
- active CF10 dirty files
- Makefile mutation before reentry
instructions:
- This activation is design-only.
- Do not modify implementation code under this work front yet.
- Reuse and adapt existing approval infrastructure; do not fork it.
- Treat launch approval and sensitive elevation as distinct policy purposes.
- Treat approval evidence as necessary but not sufficient authority.
- Keep Protected Terminal as the enforcement point for terminal capabilities.
- Keep SAFE_WRITE blocked until canonical exclusive lease is independently proven.
- Keep live cancel dependency-gated.
- Before implementation, run the explicit reentry gate and freeze the exact implementation write set.
acceptance:
- Design freeze records the reusable approval core.
- Design freeze records all missing sensitive-elevation bindings.
- No capability is enabled.
- No authority is widened.
- No parallel approval system is created.
- No active CF10 dirty path is modified.
- Work-front contract validation passes.
- git diff --check passes on the two design-only activation files.
stop_conditions:
- Any implementation mutation is attempted before reentry.
- Any active CF10 dirty file becomes required.
- Approval would be treated as lease or mutation authority.
- SAFE_WRITE or live cancel enablement becomes necessary.
- A second approval pipeline would be introduced.

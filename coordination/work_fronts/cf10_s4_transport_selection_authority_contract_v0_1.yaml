work_front_id: wf-cf10-s4-transport-selection-authority-contract-v0-1
objective: >-
  Stage 4C-P0: establish a prospective, versioned, exact-task-bound policy
  for selecting the CF-10 Worker result transport, and bind that selection
  independently and immutably through prepared_execution, validated
  ready_execution, and the hash-bound explicit_dispatch_decision.
  Preserve handoff-v2-full as the default; do not activate the completion-draft
  mode, change runtime invocation, authorize a new attempt, or replay existing ones.
scope:
  - coordination/work_fronts/cf10_s4_transport_selection_authority_contract_v0_1.yaml
  - coordination/registry/cf10_worker_result_transport_policy_v0_1.yaml
  - scripts/coordination/control_plane/cf10_training_dispatch.py
  - tests/coordination/control_plane/test_cf10_s4_transport_selection_authority_v0_1.py
exclusions:
  - No modifications to governed_worker_cycle.py, invocation_adapter.py, worker_result_return.py, s4_result_composer_v0_1.py, their existing tests, or any Handoff v2/S4 validator.
  - No modifications to dispatch_intent.py, generic CF-09 ACK contract, CLI, Makefile, worker training queue, execution profiles, operational registry, ledger contract, or provider policy. If they are required, STOP and request a separately approved scope.
  - No change to the current full Handoff v2 stdout protocol, result-return default, legacy absence behavior, or existing S4 literal resume capsule.
  - A policy entry only establishes result-transport eligibility, not Worker dispatch, execution, launch, result validity, automatic acceptance, or materialization authority.
  - No dynamic selection from Worker stdout, prompt text, assistant chat, model output, environment variables, untrusted CLI arguments, workspace contents, or current source-state/roadmap inference.
  - No retroactive reinterpretation, correction or rewriting of a037 through a041 (especially a041 terminal BLOCKED), and no prepare, ACK, dispatch or launch of a042.
  - No writes outside the exact four scoped paths; preserve all earlier dirty hunks and the two separately staged Telegram snapshot files byte-for-byte.
  - No staging, commit, push, merge, promotion, release, acceptance, launch or publication.

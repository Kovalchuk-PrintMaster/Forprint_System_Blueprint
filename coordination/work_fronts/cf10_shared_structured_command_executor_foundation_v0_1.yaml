dependencies:
- Task70 is active but blocked by a028 before mutation.
- A028 is durably published as BLOCKED with exact zero Worker delta.
- OC01 Slice C is completed and published at 93a42fc7b6a196bcde2102a7781fe1f31df4a177.
- The shared launcher already provides ARGV_NO_SHELL process execution and bounded runtime evidence.
- The validation-suite runner already builds typed argv from a canonical registry.
- OC01 Protected Terminal already proves fixed registered commands over the shared launcher.
outputs:
- Canonical structured executable capability registry.
- Reusable structured-command executor with common request/result contracts.
- Registered validation_suite capability using schema-bounded suite selection.
- Compatibility definitions for repo_status, repo_head and repo_diff_check.
- Stable Makefile check/list/proof surfaces over the shared backend.
- Focused regression proving shell=false, no raw command input and no authority widening.
acceptance:
- registry definitions describe executable capabilities and never grant consumer authority
- requests accept registered capability identity plus schema-bounded parameters and never raw argv or shell text
- executor deterministically constructs argv and reuses worker_runtime.launcher.launch_process with shell=false
- exact cwd and external evidence destination are validated before launch
- validation_suite accepts only suite ids present in the existing canonical validation-suite registry
- unknown suite, unknown capability, arbitrary executable, raw argv and raw shell text fail closed
- repo_status, repo_head and repo_diff_check definitions remain compatible with current OC01 fixed recipes
- common result binds request/execution identity and exposes stdout/stderr refs, timeout, return code and heartbeat/stall
  facts
- no SAFE_WRITE, canonical write, commit, push, merge, release or promotion authority is introduced
- Makefile exposes stable check/list/proof entrypoints over the shared backend
- focused executor tests and existing shared launcher regression tests pass
stop_conditions:
- Shared launcher modification becomes necessary.
- OC01 Protected Terminal modification becomes necessary for foundation proof.
- Worker provider invocation modification becomes necessary for foundation proof.
- Validation-suite registry or isolation-runner mutation becomes necessary.
- Arbitrary shell text, unrestricted argv or arbitrary executable selection becomes necessary.
- SAFE_WRITE or canonical mutation authority becomes necessary.
- Canonical lease, cancellation or streaming implementation becomes necessary.
- A path outside the declared scope becomes necessary.
- Concurrent committed or dirty changes intersect the audited dependency cone.

work_front_id: wf-cf10-shared-structured-command-executor-foundation-v0-1
objective: Repair the active Task70 validation-execution blocker by implementing one reusable CF10-owned structured
  command capability executor over the existing shell-false shared launcher. This is blocker repair, not advancement
  to later CF10 roadmap capabilities.
scope:
- coordination/internal_work/blueprint/governance/2026-10-05__blueprint__cf10_shared_structured_command_executor_design_freeze_v0_1.yaml
- coordination/work_fronts/cf10_shared_structured_command_executor_foundation_v0_1.yaml
- coordination/registry/structured_command_capabilities_v0_1.yaml
- scripts/coordination/control_plane/worker_runtime/structured_command_executor.py
- tests/coordination/control_plane/worker_runtime/test_structured_command_executor_v0_1.py
- Makefile
exclusions:
- Do not modify the shared process launcher.
- Do not modify OC01 Protected Terminal in this foundation slice.
- Do not modify the CF10 Worker provider invocation adapter in this foundation slice.
- Do not expose bash, shell text, arbitrary executable paths, unrestricted argv or arbitrary Make targets.
- Do not modify the validation-suite registry or isolation runner.
- Do not enable SAFE_WRITE or canonical repository mutation.
- Do not create or launch Worker retry a029.
- Do not implement lifecycle/context delivery in this Work Front.
- Do not implement canonical session/module lease, governed live cancellation or structured streaming.
- Do not reactivate OC01.
- Do not commit, push, merge, release, promote or automatically ACCEPT through the executor.
- Do not touch unrelated dirty paths.

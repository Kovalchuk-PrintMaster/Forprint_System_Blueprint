dependencies:
- Task80 worker cf10-u180j-a047 operator ACCEPT record is immutable, exact SHA verified, and S3 status is ZERO_DELTA_OPERATOR_ACCEPTED;
  historical worker-exit snapshot attestation remains false.
- CF-10 work u180j remains ACTIVE at latest canonical lifecycle event sequence 67; global NEXT_STEP CF-11 does not
  mean CF-10 is closed.
- Roadmap reconciliation IN_SYNC, execution dependency check PASS, generator contract check PASS, current AGENTS
  freshness check PASS after existing in-flight working-tree U111 update; all must be retested immediately before
  preparation.
- Continuity projection check PASS, but latest historical checkpoint remains unreconciled (material delta); capture
  fresh live HEAD+dirty fingerprint and do not hide or equate checkpoint to live baseline.
- Current worktree contains protected unrelated dirty paths, including AGENTS.md, Candidate and other Work Fronts.
  Exact source and dirty-state overlap gate is mandatory; pristine Git is NOT required.
- CF-14 architecture remains parent; first map existing dependency graph/registry, canonical-state impact resolver,
  generator registry, bootstrap context/gates and Makefile operator map to all Task85 acceptance criteria.
- Index/Work Front/Task materialization alone grants NO dispatcher launch or operator ACCEPT. New attempt identity
  and explicit independent dispatch authorization are required.
outputs:
- One current-state REUSE/EXTEND/ADAPT/REPLACE/NEW matrix by existing capability, authoritative owner, source path,
  tests, and precise gap; justify any NEW path.
- Bounded and explainable reverse-affected dependency result for a controlled critical-source/capability change,
  using existing curated dependency authority.
- Machine-checkable dependent proved by deterministic isolated test; semantic dependent marked REVIEW_REQUIRED with
  source/revision evidence and no false freshness claims.
- Controlled Makefile operator functionality -> reusable standard/template -> bootstrap consumer example using isolated
  fixtures (no write to real external standard/template).
- One unrelated-change fixture with no broad invalidation; one stale-critical bootstrap fixture blocked with reason
  and required remediation/review evidence.
- Machine-readable and human-readable operator-facing impact evidence; explicit durable review bind with source/dependent
  digests where review legitimately resolves.
- Focused regression and project-native validation results, exact candidate changed-path listing and SHA256 hashes,
  and full attempt-bound Worker Result/Handoff.
- When scope is insufficient or existing functions already cover requirements, return BLOCKED or ALREADY_VERIFIED
  with evidence; never manufacture code delta.
acceptance:
- Dependency and current-state checks and a fresh source freeze pass before execution; protected pre-existing dirty
  paths and one-writer invariant preserved.
- Every Task85 criterion in registered training queue and planning file is reconciled with source/test evidence
  before implementation; CF-14 parent direction reused.
- Registered changed critical source/facet produces precise explainable bounded reverse-affected set without a second
  dependency authority.
- At least one deterministic automatic verification, one semantic REVIEW_REQUIRED outcome, and explicit evidence
  of review resolution if review completed.
- Known-stale critical bootstrap/template/standard input is rejected by a project-native consumer gate; no unrelated
  broad hard-block.
- Makefile change impact example and unrelated control fixture both pass; functional map checked where a new operator
  entrypoint is genuinely needed.
- Candidate write set is a subset of the nine explicit scope paths; NEW resolver not allowed without documented
  reuse-gap proof.
- Focused tests and relevant regression pass, diff --check pass, exact hashes and tests included in Handoff.
- No canonical Worker write, automatic acceptance, promotion, dispatch, next Work Front activation, Git push or
  release.
stop_conditions:
- Task80 ACCEPT evidence/ledger or S3 overlay is missing, contradictory or unbound; Task85 prerequisite not ready.
- Latest roadmaps/projections are stale or source HEAD/dirty fingerprint changes after freeze without explicit new
  preparation.
- An in-flight different canonical writer overlaps exact scope, including Makefile or other protected paths.
- An essential impact relationship, consumer gate or deterministic test requires writing outside scope; STOP for
  controlled amendment.
- The proposed mechanism duplicates the existing dependency registry/graph or claims semantic freshness without
  evidence.
- New changes need live module bootstrap/export execution, mutation of another repository, or forbidden authority
  expansion.
- Validated Handoff/Worker Result is absent or result transport/evidence cannot bind to exact attempt.

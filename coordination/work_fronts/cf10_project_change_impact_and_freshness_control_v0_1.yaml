work_front_id: wf-cf10-project-change-impact-and-freshness-control-v0-1
objective: 'Task 85, CF-10/u180j: extend the existing Blueprint/CF-14 change impact and freshness mechanisms for
  critical project standards, templates and module bootstrap consumption. Start with bounded REUSE/EXTEND audit;
  implement only independently evidenced missing behavior within the exact nine-path Worker write set, otherwise
  return a justified no-production-change/blocker result.'
scope:
- coordination/registry/execution_dependency_registry_v0_1.yaml
- scripts/coordination/render_blueprint_canonical_state_freshness_impact.py
- scripts/coordination/control_plane/context/bootstrap_task_context.py

exclusions:
- Work Front is an exact allowlist, not a request to modify every listed file. All mutations occur solely in isolated
  Worker candidate workspace.
- No new competing roadmap authority, execution dependency truth store, broad relationship framework, autonomous
  dispatcher, or cross-module migration.
- Do not modify live event store, attempt ledger, prior Worker Result, AGENTS.md, generator inventory, existing
  Work Fronts or training queue from the Worker.
- Do not automatically refresh canonical generated projections or overwrite dirty/untracked files. Current historical
  checkpoint delta must remain explicitly visible, not waived.
- Do not create a NEW impact resolver if existing functionality can be extended in-scope. New resolver path is conditional
  on specific documented gap proof.
- Do not edit separate module repositories, actual reusable template/standard files outside exact scope, or critical
  external resources. Missing required path means STOP and request scope review.
- Do not infer semantic freshness from timestamps, file touch, hashes alone or LLM assertion. No automatic ACCEPT/dispatch/commit/push/merge/release/publication.
- This task is a bounded CF-10 training implementation proof of CF-14 direction, not full project-wide CF-14 rollout.

work_front_id: wf-cf10-s4-trusted-transport-binding-v0-1
objective: >-
  Stage 4C: bind the existing opt-in Worker completion-draft transport to the
  governed CF-10 invocation and result-return boundaries from one verified,
  independently authorized prepared-execution/explicit-dispatch selection.
  Preserve legacy full Handoff v2 as the default. Implement only after a
  tests-first RED and exact read-only review of the existing dirty hunks;
  do not launch, reconcile, publish, or rewrite any Worker attempt.
scope:
  - coordination/work_fronts/cf10_s4_trusted_transport_binding_v0_1.yaml
  - scripts/coordination/control_plane/governed_worker_cycle.py
  - scripts/coordination/control_plane/worker_runtime/invocation_adapter.py
  - tests/coordination/control_plane/test_cf10_s4_trusted_transport_binding_v0_1.py
exclusions:
  - No edits to worker_result_return.py, s4_result_composer_v0_1.py, their tests, Handoff v2 schema or validators, or the Stage 4A/4B verified behavior.
  - No schema, authority, dispatch, Makefile, registry, CLI, worker-runtime provider-policy or ledger edits outside the exact scope. If a trusted transport selection cannot be proven without another file, STOP and request a new operator-approved boundary.
  - No mode inference from stdout, prompt content, Worker-produced fields, environment variables, untrusted CLI text or current canonical roadmap state.
  - No acceptance of arbitrary transport strings or replacement of frozen hashes, attempt ID, origin manifest, source fingerprint or roadmap cursor.
  - Do not silently repair, reinterpret, coerce or auto-fallback from a malformed full Handoff v2 or malformed completion draft.
  - Do not mutate the existing S4 literal capsule in invocation_adapter.py, or the existing controlled post-worker/live-launch additions in governed_worker_cycle.py except the exact new additive binding hunks approved after review.
  - No edit, replay, reclassification or rewriting of cf10-u180j-a041 or any other terminal attempt; do not prepare, authorize or launch a042.
  - No commit, staging, push, promotion, release, live Worker dispatch or candidate acceptance, and no modification to the two parallel Telegram snapshot staged paths.

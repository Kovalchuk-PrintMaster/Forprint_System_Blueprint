dependencies:
  - Stage 4A pure origin-bound S4 composer has passed 22 focused tests and related regression tests.
  - Stage 4B worker_result_return.materialize_worker_result already accepts trusted result_transport (legacy handoff-v2-full default; opt-in worker-completion-draft-v0-1), validates complete Handoff v2 and frozen S4, and writes create-only worker_result.yaml.
  - Before tests-first RED, freeze actual bytes and reviewed hunks for two dirty implementation files, plus HEAD, staged-index bytes, all pre-existing unrelated changed/untracked files and Stage 4B module SHA.
  - Prove an existing versioned, independently authorized policy/decision surface supports an exact immutable transport selection. Bind it consistently to prepared execution, explicit dispatch decision, invocation prompt, result materialization and recorded evidence. If any required authority source or schema is absent, STOP for explicit separate design approval; never synthesize authorization from chat or stdout.
  - The existing governed context digest, origin Handoff hash and attempt identity are validated before launch; Stage 4C must not weaken or bypass these checks.
outputs:
  - Read-only binding review describing the actual pre-existing fields/schema and the precise derivation of trusted result_transport from prepared execution and explicit dispatch (or a BLOCKED report if this cannot be proven within scope).
  - A new Stage 4C tests-first module with negative cases for missing/conflicting/unknown/Worker-supplied transport, origin/digest/attempt drift, legacy frames under draft mode, draft frames under legacy mode and no silent fallback.
  - An exact additive production patch, subject to separate operator review of the dirty files, passing the same validated transport selection to both prompt generation and materialize_worker_result; the selected value is fixed before Worker stdout is read.
  - Draft-mode Worker prompt uses exactly FORPRINT_WORKER_COMPLETION_DRAFT_V0_1_BEGIN/END and Worker-owned JSON fields, not a full Handoff v2 template or copied origin SHA; default mode retains existing legacy prompt and S4 literal contract unchanged.
  - Result-return evidence includes the selected transport and safe provenance, without exposing prompt or granting authority; no schema field insertion that violates existing strict contracts.
  - Structured fail-closed tests for invalid selection, mismatched prompt/materialization selection and create-only result protection, with no actual Worker process or filesystem writes outside temporary test fixtures.
  - Focused runtime/S4 regressions, cf10-worker-pipeline and blueprint-continuity-planning PASS, plus Git/worktree/parallel-staging integrity evidence.
acceptance:
  - Canonical Work Front validator PASS with this exact four-path scope and zero live authorization.
  - The pre-RED read-only review identifies actual current trusted policy fields; missing policy means BLOCKED, not an invented setting, new authority or unreviewed schema extension.
  - Tests-first RED reliably fails because trusted Stage 4C integration is absent; GREEN is additive and changes only the declared paths. Both dirty implementation files pass preimage SHA and protected-hunk checks before and after patch.
  - Legacy mode remains default, and legacy output, prompt, validation and create-only behavior do not change when the opt-in selector is absent.
  - Draft mode requires a verified, attempt-bound, decision-bound explicit selection before invocation, and the identical value is passed to result-return; no model or provider stdout can select it.
  - A missing, unknown, contradictory, changed, unbound, or Worker-supplied mode fails closed before materializing worker_result.yaml and without changing the ledger.
  - Frozen origin S4 coordinates remain derived only from prepared verified context; malformed legacy Handoff cannot be rescued by draft composition.
  - No automatic acceptance, promotion, commit, push, release, dispatch or historical result/attempt mutation; existing terminal cf10-u180j-a041 remains untouched and no a042 is started.
  - The S4 literal resume capsule and prior dirty Worker Cycle changes remain byte-preserved outside exact Stage 4C approved additive hunks; staged Telegram snapshot bytes are preserved.
  - Full focused S4/runtime tests plus both registered validation suites PASS without manual canonical projection refresh; no real live Worker required for acceptance.
stop_conditions:
  - Trusted selector policy or its versioned dispatch binding cannot be established from existing on-disk, validated sources within scope; STOP for separate operator review before code changes.
  - A production edit requires any file beyond the four scoped paths, a change to Handoff/S4 validators, any authority widening or a persistent provider configuration change.
  - Preflight HEAD, protected-hunk SHA, stage4b source SHA, index or Git state differs from observed baseline unexpectedly.
  - Draft mode can be selected or changed by Worker output, chat instructions, command-line overrides or other untrusted text, or prompt/result selection may disagree.
  - Legacy result-return behavior changes, any historical attempt record is touched, or tests request a live Worker launch or automatic repair.
  - Any RED/GREEN, related regression, source-state, ledger-boundary or worktree-integrity check fails.

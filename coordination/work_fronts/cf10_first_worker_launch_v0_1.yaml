dependencies:
- CF-10/u180j ACTIVE sequence 67
- Slice 4 PASS
- real first workspace state PROVISIONED_NOT_DISPATCHED
- workspace source-state freeze and equivalence evidence
- exact CF-10 internal zero-stage exception
- existing Handoff v2 TASK_EXECUTION manifest and canonical ACK schema
- existing validate_cf09_assistant_ack gate
- explicit dispatch decision boundary
- light-maintenance@r1
- governed_canonical_mutation@0.1.0
- canonical Execution Attempt Ledger
- a resolvable pre-existing allowed non-secret runtime binding
outputs:
- A provider-neutral canonical process-launch API under scripts/coordination/control_plane/worker_runtime/.
- The launch API requires an already-resolved argv/runtime binding and never discovers secrets itself.
- The launch API enforces cwd=sealed isolated workspace/repo.
- The launch API captures stdout/stderr/exit status/timestamps/timeout evidence inside the attempt runtime tree.
- A runtime-binding probe that reports READY or BLOCKED without mutating ACK/dispatch state.
- A CF-10 exact explicit-dispatch transition layered on the existing Dispatcher.
- A trusted expected ACK built from the existing Handoff v2 ACK contract/bindings.
- Assistant ACK validation via validate_cf09_assistant_ack.
- An explicit dispatch-decision record bound to u180j/worker-01/cf10-u180j-a001 and the sealed workspace fingerprint.
- Exactly one first worker process launch when every gate is green.
- A canonical Execution Attempt Ledger fact for the launched attempt, using the existing append-only ledger rather than a
  parallel history.
- A launch result packet in the runtime attempt tree for later Handoff v2 result/Completion/Inspector intake.
acceptance:
- Existing CF-09 ACK tests continue to pass.
- ACK transition remains AWAITING_ASSISTANT_ACK -> READY_FOR_EXPLICIT_DISPATCH.
- ACK grants no authority and performs no worker launch.
- Explicit dispatch transition is impossible before valid ACK.
- Explicit dispatch transition is exact-binding only for CF-10/u180j/a001.
- Runtime binding resolution happens before ACK is consumed.
- Unresolved runtime binding produces BLOCKED_RUNTIME_BINDING and no ACK/dispatch/ledger append/process launch.
- No provider/model/credential is invented or committed.
- Workspace manifest is still PROVISIONED_NOT_DISPATCHED immediately before the explicit dispatch decision.
- Canonical source fingerprint still matches the frozen source before launch.
- Worker cwd is exactly the isolated workspace/repo.
- Worker has no canonical-repository working directory.
- Worker launch is one-shot for attempt_id=cf10-u180j-a001.
- The launch adapter enforces bounded timeout and captures completion evidence.
- The worker cannot receive release/push/merge/auto-ACCEPT/foreign-write authority.
- A canonical attempt record exists if and only if process launch actually begins.
- The attempt record is fact authority only and grants no authority.
- If the worker fails, the failed attempt remains durable and any retry requires a new attempt_id.
- BLUEPRINT_AI_TRIAL_READY remains false.
- u180j remains ACTIVE immediately after raw worker execution; later acceptance/checkpoint/validation are separate slices.
- No external worker is dispatched.
stop_conditions:
- No approved pre-existing runtime binding resolves on the host.
- Runtime binding would require storing a secret/provider credential in Git.
- Current workspace is missing, not sealed, not equivalent or source-stale.
- Canonical source fingerprint differs from the frozen source.
- Trusted expected ACK cannot be reconstructed from existing Handoff v2 bindings.
- ACK validation fails.
- Explicit dispatch decision cannot be represented without broadening authority.
- Launch API would need to run from canonical repository instead of isolated workspace.
- Launch API would permit shell-string execution instead of argv-bound execution.
- Attempt Ledger cannot represent the launched attempt without incompatible schema changes.
- Worker invocation requests external dispatch, cross-repository write, commit, push, merge, release or auto-ACCEPT authority.
- Any broad trial gate or lifecycle mutation would be required merely to launch.

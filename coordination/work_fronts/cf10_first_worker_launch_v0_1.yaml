work_front_id: wf-cf10-first-worker-launch-v0-1
objective: Implement the missing canonical process-launch primitive and use it for exactly one bounded CF-10 Blueprint-internal
  zero-stage worker attempt. Preserve the existing Assistant ACK gate, require an explicit dispatch decision, append launch-time
  attempt facts to the canonical Execution Attempt Ledger, execute only inside the sealed isolated workspace, and retain candidate-only/no-release
  authority. If an approved pre-existing runtime binding cannot be resolved, stop before ACK/dispatch rather than guessing
  a provider or command.
scope:
- scripts/coordination/control_plane/worker_runtime/
- scripts/coordination/control_plane/dispatch_intent.py
- coordination/standards/automation/control_plane/central_listener_dispatcher_monitor_v0_1.yaml
- coordination/standards/automation/execution_attempt_ledger_contract_v0_1.yaml
- scripts/coordination/execution_attempt_ledger_v0_1.py
- coordination/internal_work/blueprint/governance/2026-09-06__blueprint__worker_runtime_and_invocation_contract_v0_1.yaml
- scripts/validation/validate_cf10_first_worker_launch_v0_1.py
- tests/coordination/control_plane/worker_runtime/
- tests/coordination/control_plane/test_cf10_first_worker_launch_boundary_v0_1.py
- /srv/software_development/forprint-worker-runtime/forprint_system_blueprint/worker-01/cf10-u180j-a001/
exclusions:
- Do not set BLUEPRINT_AI_TRIAL_READY=true.
- Do not broaden the CF-10 exact exception to any other work/module/front/task/profile/procedure/worker/attempt.
- Do not launch Logistics or any external-module worker.
- Do not bypass Assistant ACK.
- Do not treat Assistant ACK itself as dispatch authority.
- Do not launch before an explicit dispatch-decision artifact/state exists.
- Do not guess, invent or hardcode a provider executable/model/credential.
- Do not store provider credentials, API keys, tokens or secrets in Git.
- Do not launch if the pre-existing allowed runtime binding cannot be resolved.
- Do not launch outside /srv/software_development/forprint-worker-runtime/forprint_system_blueprint/worker-01/cf10-u180j-a001/workspace/repo.
- Do not allow worker writes to canonical Blueprint checkout.
- Do not allow worker writes to another repository.
- Do not allow worker commit/push/merge/release/auto-ACCEPT.
- Do not mutate roadmap lifecycle as part of process launch.
- Do not automatically checkpoint/validate/close CF-10 after launch.
- Do not retry the failed/blocked first attempt under the same attempt_id.
- Do not delete or overwrite forensic evidence from a launched attempt.

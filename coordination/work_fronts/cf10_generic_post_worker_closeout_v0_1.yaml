- Exact candidate validation using existing immutable evidence.
- Terminal attempt recording through the canonical append-only ledger.
- Machine-readable operator report and next required boundary.
- Idempotent re-entry without duplicate terminal records.
acceptance:
- Existing 74-test baseline remains passing.
- Tests-first RED confirms advance is not implemented.
- Exact attempt, result, source baseline and write-set are enforced.
- Missing or contradictory validation evidence fails closed.
- Valid candidate reaches AWAITING_OPERATOR_REVIEW after terminalization.
- Repeated advance does not duplicate ledger records.
- No promotion or publication occurs automatically.
stop_conditions:
- Changes require widening the declared write-set.
- Changes require rewriting existing immutable attempt artifacts.
- A ledger, Handoff or promotion contract change becomes necessary.
- A protected dirty path would be modified.
- Any automatic acceptance or publication authority is required.

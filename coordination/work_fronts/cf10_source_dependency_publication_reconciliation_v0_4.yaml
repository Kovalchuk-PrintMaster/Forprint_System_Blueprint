dependencies:
- HEAD is expected at 240ded9be94aad90f523576e0dd0bc5120297934 and upstream must be fresh.
- Console worker adoption is already tracked and status IMPLEMENTED.
- Makefile already invokes scripts/coordination/build_worker_invocation.py.
- Assistant Handoff v2 runtime already delegates TASK_EXECUTION context to task_context_adapter.py.
- Published worker_tasks/index.yaml already registers cf10-zero-stage-dispatch-boundary-regression-v0-1 exactly once.
- Local worker_tasks/index.yaml delta contains only the prepared Task5 registration and must remain unstaged.
- The zero-stage task artifact itself is historical publication debt and must be present for clean-checkout MANUAL_INTERNAL
  resolution.
- Task-context and console-worker focused validators/tests pass in the current working tree.
outputs:
- Published console worker invocation builder with its validator and focused tests.
- Published CF-10 internal task-context adapter Work Front, adapter, validator and focused tests.
- Published zero-stage durable MANUAL_INTERNAL task artifact matching the already-published task index registration.
- Clean checkout can validate the console-worker adapter and CF-10 internal task-context adapter without local untracked dependencies.
acceptance:
- Publication Work Front validates.
- Existing CF-10 internal task-context Work Front validates.
- HEAD worker task index contains exactly one zero-stage registration and no Task5 registration.
- Detached candidate does not modify worker_tasks/index.yaml.
- Console worker adapter validator passes.
- Console worker focused pytest passes.
- CF-10 internal task-context validator passes.
- CF-10 internal task-context focused pytest passes.
- Assistant Handoff v2 runtime validator passes.
- git diff --check passes.
- Candidate changed path set equals exactly the eight historical source paths plus this publication Work Front.
- Main staging contains the same exact nine-path set and excludes worker_tasks/index.yaml.
stop_conditions:
- HEAD differs from the expected publication base.
- Upstream is not fresh.
- Main staging is non-empty.
- Any historical source path is already tracked or missing.
- HEAD task index lacks the zero-stage registration.
- HEAD task index already contains the prepared Task5 registration.
- Local task index modifies anything other than the Task5 append.
- A focused validator or test fails in the detached candidate.
- A path outside the declared publication set becomes necessary.

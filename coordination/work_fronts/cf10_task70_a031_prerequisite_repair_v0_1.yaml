dependencies:
- a031 STARTED and BLOCKED ledger facts are published at source HEAD.
- Existing structured executor already records elapsed_seconds in immutable external evidence.
- Existing Worker validation MCP exposes only suite_id and require_tier and omits elapsed_seconds from Worker-visible
  structured content.
- Existing governed Worker context already contains roadmap_sync=IN_SYNC, u180j ACTIVE and bound resume coordinates.
outputs:
- Bump validation_suite shared capability contract to 0.2.0.
- Expose existing execution-layer elapsed_seconds to the Worker without introducing a new profiler.
- Add optional typed profile:boolean transport; absent/false preserves current argv and true adds only --profile to
  the canonical validation-suite runner argv.
- Keep profile=true unusable until the task-scoped runner itself implements --profile; the repair does not implement
  Task70 profiling semantics.
- Clarify in the Worker prompt that the hash-bound governed context is the attempt-scoped freshness verification snapshot
  and must not be regenerated through unavailable shell commands.
acceptance:
- Only the eight declared implementation paths change in the implementation slice.
- validation_suite capability version is 0.2.0 and optional profile is strictly boolean.
- profile absent or false produces the exact pre-repair validation-suite argv.
- profile true adds exactly --profile and grants no shell/environment/executable authority.
- Non-boolean profile is rejected before process launch.
- Worker MCP exposes profile as the only new Worker-controlled input and still rejects hidden execution fields.
- Worker-visible structured result includes elapsed_seconds already measured by the shared launcher.
- Existing evidence digest, stdout/stderr evidence and authority-false semantics remain intact.
- Worker prompt explicitly treats a hash-bound IN_SYNC/ACTIVE governed cursor as sufficient attempt-scoped freshness
  verification unless internally inconsistent.
- Prompt continues to state that governed context is non-authoritative and cannot widen execution authority.
- structured-command-executor-check passes.
- cf10-worker-invocation-bridge-check passes.
- governed-worker-cycle-check passes.
- A normal real MCP proof still passes with shell=false and authority_widened=false.
- No Task70 runner, validation registry, lifecycle/roadmap, ledger or Worker attempt mutation occurs.
stop_conditions:
- A path outside the exact eight-file implementation scope becomes necessary.
- The repair would need to implement Task70 profiling logic in run_validation_suite_v0_1.py.
- A general shell/environment passthrough becomes necessary.
- A second MCP tool or arbitrary command execution becomes necessary.
- Governed context would need to become an authority source rather than verification context.
- A real Worker retry becomes necessary before repair closeout.
authority:

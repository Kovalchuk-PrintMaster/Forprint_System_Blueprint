work_front_id: wf-cf10-task70-a031-prerequisite-repair-v0-1
objective: 'Repair the two infrastructure prerequisites exposed by blocked Task70 attempt a031: provide bounded pre-mutation
  whole-suite elapsed evidence plus typed post-mutation profiling transport through the existing validation capability,
  and make the already-delivered hash-bound governed context explicitly consumable as attempt-scoped freshness proof.'

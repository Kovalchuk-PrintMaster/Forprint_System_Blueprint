exclusions:
- Do not modify Task70 runner or its focused tests during this repair.
- Do not modify the validation-suite registry or isolation runner.
- Do not modify governed_worker_cycle, lifecycle, roadmap, Handoff, attempt ledger or Operator Console.
- Do not add shell, arbitrary argv, arbitrary executable selection or arbitrary environment injection.
- Do not create a second validation/profiling runner or a second MCP tool.
- Do not launch a032 during implementation or validation.
- Do not commit, push, merge, release or automatically accept from any Worker process.

      - https://maikoff.ua/konstruktor.html?srsltid=AfmBOorh0s1Xwt1juB0r9TX8l6BiVqsxEyc2_zGNvyWWVpFyDAoblaZ_
  - gap_id: GAP-H10-POOL-AUTOMATION-PROMOTION-THRESHOLDS-001
    module_id: forprint_system_blueprint
    summary: Exact quantitative promotion thresholds from full-manual to checkpointed or automated child progression
      are not yet agreed.
    rule: Determine them from first Logistics pool evidence; do not invent thresholds before calibration.
    status: OPEN_NONBLOCKING_FIRST_POOL
  - gap_id: GAP-H10-AI-RESOURCE-TELEMETRY-001
    module_id: forprint_system_blueprint
    summary: The exact trustworthy token/cost telemetry source for future fresh AI workers is not yet confirmed.
    rule: Report not_observable until a trustworthy source exists; never fabricate token or cost values.
    status: OPEN_NONBLOCKING_FIRST_POOL
  - gap_id: GAP-H10-INVENTORY-VNEXT-SCHEMA-001
    module_id: forprint_system_blueprint
    status: OPEN
    summary: The existing RCI/current-state/cleanliness/lineage primitives do not yet form one reusable lifetime
      module-memory schema for significant implementations.
    rule: Extend existing inventory contracts; do not replace them with a parallel framework.
  - gap_id: GAP-H10-FRESHNESS-IMPACT-CONTRACT-001
    module_id: forprint_system_blueprint
    status: OPEN
    summary: Repository snapshot freshness exists, but dependency-driven stale-surface impact and generated current-state
      projection contracts are not yet implemented.
    rule: The next control-plane implementation should extend existing transparency and freshness primitives read-only
      first.
  - gap_id: GAP-H10-SEMANTIC-REGISTRY-OPERATING-CONTRACT-001
    module_id: forprint_library
    status: OPEN
    summary: Library has canonical semantic/naming/alias/contract authority direction, but pre-implementation lookup
      evidence, registration/enrichment lifecycle and change-feed operation remain to be specified.
    rule: Implement inside the existing Library semantic-registry direction; no competing Blueprint registry.
  - gap_id: GAP-H10-INSPECTOR-SEMANTIC-CONFIDENCE-001
    module_id: forprint_project_inspector
    status: OPEN
    summary: Inspector policy includes duplicate/self-inventory drift detection, but metadata-first semantic filtering
      and explicit confidence categories are not yet operational.
    rule: Build after shared inventory/Library contracts are stable enough to consume.
  - gap_id: GAP-H10-GENERATED-MODULE-POLICY-SOURCE-001
    module_id: forprint_system_blueprint
    status: OPEN
    summary: Library and Inspector module_policy.md surfaces are generated; the canonical generation source for
      incorporating the new semantic-convergence and confidence directions must be discovered before policy regeneration.
    rule: Never patch generated module policies directly; update the owning source and regenerate through the registered
      mechanism.
  - gap_id: GAP-H10-CONTROL-PLANE-ROADMAP-DETAIL-SCHEMA-001
    module_id: forprint_system_blueprint
    status: OPEN
    summary: The new Blueprint Control Plane planning program is durable internal planning evidence but is not yet
      a registered strict roadmap_detail subclass.
    rule: Do not place unregistered YAML into coordination/roadmaps/details; add a canonical roadmap-detail projection
      only through document-surface registry/schema governance.

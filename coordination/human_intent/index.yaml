known_gaps:
  - gap_id: GAP-CALCULATOR-DESIGN-REFERENCE-URLS-001
    module_id: calculator_engine
    summary: Exact external calculator and design reference names and URLs for personalized T-shirt and cap configurators
      were discussed earlier but are not recoverable from the currently accessible project and file corpus.
    rule: Do not invent replacements. Recover exact resources before implementation or close the gap by explicit
      owner decision.
    status: RESOLVED_BY_OWNER_2026_09_01
    resolution: Exact calculator/constructor URLs re-supplied; sborka.ua is primary.
    resolution_ref: coordination/internal_work/blueprint/evening_reviews/2026-09-01/external_reference_recovery_and_analysis_v0_1.md
    exact_resources:
      - https://sborka.ua/
      - https://www.fastprint.pro/?utm_source=fastprintua&utm_medium=fastprintua&utm_campaign=fastprintpro_page#/CreateOrder/Sheetcut
      - https://wolf.ua/uk/category/calc-polygraphy/

  status: RECOVERED
  text: 'Operator-facing validation reports should consolidate semantically identical repeated checks or evidence rows, while retaining separate entries when they prove genuinely different evidence classes or semantics.'
  context: 'Recovered from the owner reporting correction in visible turn 177; deduplication must not collapse distinct evidence classes.'
  roadmap: ''
  source_refs:

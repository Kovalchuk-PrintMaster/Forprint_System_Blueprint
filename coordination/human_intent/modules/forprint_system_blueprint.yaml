    context: Library owner, consumers adopt.
    roadmap: ''
    intent_id: HI-FP-SYSTEM-BLUEPRINT-012
  - status: AGREED
    text: 'Human portfolio має показувати dependency of each step, а не лише функціональність: хто має закінчити
      що, щоб цей модуль міг рухатися далі.'

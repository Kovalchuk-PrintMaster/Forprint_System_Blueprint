- intent_id: HI-FP-LIBRARY-ADMIN-20260516-001
  status: RECOVERED
  text: 'Routine changes to Library-owned canonical references, rules and versions should be manageable through a strong human-friendly governed administration surface; adding a material, currency or similar reference should not require editing server code.'
  context: 'Recovered from direct owner turn 1. Current Library planning is ADMIN_FACING but does not preserve this explicit no-routine-server-code administration requirement; implementation ownership still requires reconciliation with shared Control Center/System Administration surfaces.'
  roadmap: ''
  source_refs:

- intent_id: HI-FP-DATA-CONTRACT-CONSISTENCY-20260516-001
  status: RECOVERED
  text: 'ForPrint canonical exchange forms and structured definitions should be tested for cross-module data sufficiency and consistency before publication, so data accepted at intake is also adequate for the downstream accounting, warehouse, production and related processes that consume it.'
  context: 'Recovered from direct owner turn 1 requirement that every important step be covered by tests checking whether incoming fields are sufficient and mutually consistent across downstream operational uses. Current generic test governance is reused, while semantic ownership is reconciled with Contract Registry/Gateway/domain owners.'
  roadmap: ''
  source_refs:

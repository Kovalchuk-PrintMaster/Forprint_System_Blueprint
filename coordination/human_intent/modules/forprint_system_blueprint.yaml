    roadmap: ''
  - intent_id: HI-FP-ARCH-20260920-008
    status: AGREED
    text: The portfolio planning system should expose machine-readable reports and human dashboards for dependencies,
      blockers, readiness, plan revisions, freshness, progress and portfolio effects, while keeping dashboards as

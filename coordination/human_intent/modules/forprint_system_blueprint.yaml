- intent_id: HI-FP-CONTRACT-DUAL-FORM-20260516-001
  status: RECOVERED
  text: 'External partner integrations should receive a clear human-readable form or specification together with an equivalent machine-readable contract or payload format, with explicit versioning so people and systems share one unambiguous exchange model.'
  context: 'Recovered from the owner partner-integration example in turn 1: one human-understandable form plus one technical/machine form such as JSON. This is preserved as cross-module intent, not as proof that Library remains the current contract authority.'
  roadmap: ''
  source_refs:

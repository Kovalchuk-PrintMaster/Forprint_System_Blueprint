    context: Explicit operator requirement on 2026-09-21.
    roadmap: ''
  - intent_id: HI-FP-ARCH-20260920-010
    status: RECOVERED
    text: Indexes, relationship graphs and human-readable architecture/dashboard views should remain complementary

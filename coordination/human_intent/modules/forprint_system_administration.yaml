intents:
- status: AGREED
  text: System Administration відповідає за printer routing/fallback для job tickets та інших physical outputs.
  context: Business order truth лишається в Operations Control Registry.
  roadmap: ''
  intent_id: HI-FP-SYSTEM-ADMINISTRATION-001
- status: AGREED
  text: Printer/machine availability та fallback мають бути технічними capability, а permission to choose/override — через
    Identity & Access policy.
  context: Не плутати routing з authorization.
  roadmap: ''
  intent_id: HI-FP-SYSTEM-ADMINISTRATION-002
- status: AGREED
  text: Critical alerts потребують надійної audio/visual delivery infrastructure і escalation timers.
  context: Але semantic state STOP належить OCR.
  roadmap: ''
  intent_id: HI-FP-SYSTEM-ADMINISTRATION-003
- status: PROPOSED
  text: Може підтримувати service health, local device inventory, deployment/runbook surfaces для shop-floor systems.
  context: Це інфраструктурний шар, не business orchestration.
  roadmap: ''
  intent_id: HI-FP-SYSTEM-ADMINISTRATION-004
- status: AGREED
  text: 'Temporary/report workspace policy має бути впроваджена технічно: окремі operator_exchange/reports, artifacts, work,
    diagnostics, backups.'
  context: Щоб tmp корінь не перетворювався на смітник.
  roadmap: ''
  intent_id: HI-FP-SYSTEM-ADMINISTRATION-005

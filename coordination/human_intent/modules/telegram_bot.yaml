  - intent_id: HI-TG-DATA-INGEST-20260922-001
    status: RECOVERED
    text: Telegram dialogue history should be recoverable from exported customer-chat HTML through a deterministic
      parser that produces structured semantic input/response examples, merges short same-context messages where appropriate,
      and does not turn non-text media placeholders into dialogue examples.
    context: Recovered from the filename-label 07.10 Telegram data-ingest dialogue. The historical 20-column Supabase
      shape is evidence, not automatically the current schema.
    roadmap: ''

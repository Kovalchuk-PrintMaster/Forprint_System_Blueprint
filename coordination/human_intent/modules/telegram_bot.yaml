  - intent_id: HI-TG-ML-20260922-002
    status: RECOVERED
    text: Recurring Telegram classifier evaluation must not rely indefinitely on one static test dataset that can
      leak into tuning; long-running quality evidence should include fresh unseen cases, provenance/leakage controls
      and an independent expected-label oracle or review path before automated retraining or promotion decisions.
    context: Recovered from the owner's explicit concern that DeBERTa can adapt to a repeatedly used test set. External
      LLM generation is only one historical candidate for fresh cases, not the oracle and not a required provider.
    roadmap: ''
    source_refs:
    - coordination/internal_work/blueprint/evening_reviews/2025-10-12_internal_anchor/DFTB_telegram_bot_behavior_model_v0_1/00_intake_manifest_v0_1.yaml

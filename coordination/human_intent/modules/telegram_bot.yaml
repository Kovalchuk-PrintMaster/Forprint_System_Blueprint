    status: RECOVERED
    text: Synthetic order_modification coverage should include realistic changes to an existing order such as add/replace/change,
      references to a previous order, and quantity or detail modifications rather than only new-order requests.
    context: Recovered directly from the historical synthetic-data expansion request.
    roadmap: ''
    source_refs:

  - intent_id: HI-TG-BEHAVIOR-RUNTIME-20260922-001
    status: RECOVERED
    text: Telegram behavior should be modeled and reviewed explicitly before production execution logic is allowed
      to drive architecture; synthetic phrases and scenario fixtures validate behavior specifications but must not
      silently become the source of production business rules.
    context: Recovered from the long-running Telegram history where the owner explicitly reset priority from classifier/runtime
      tuning back to behavior-model design and treated synthetic phrases as behavior fixtures.

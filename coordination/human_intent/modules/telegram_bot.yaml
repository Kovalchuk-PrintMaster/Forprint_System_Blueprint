    status: RECOVERED
    text: Telegram classifier evaluation should emit both machine-readable metrics/artifacts and human-readable diagnostics,
      including per-class/confusion evidence where useful, stable artifact identities and explicit paths to created
      outputs so the operator can inspect results without losing reproducibility.
    context: Recovered from the owner's requests for readable Excel-oriented evaluation alongside JSON/confusion artifacts

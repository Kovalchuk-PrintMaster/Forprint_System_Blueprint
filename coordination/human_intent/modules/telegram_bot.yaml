    status: RECOVERED
    text: Telegram human-talk response templates should use normalized intent/style/sentiment references and produce
      short, natural, non-verbatim-repetitive responses with multilingual support for Ukrainian, Russian and English;
      template priority remains a bounded ranking input rather than business truth.
    context: Recovered from the filename-label 12.10 human-talk/template dialogue. The owner explicitly moved the
      schema from textual style/sentiment fields to style_id/sentiment_id foreign-key references, required 1–2 sentence
      natural responses, uk/ru/en support and priority 0–10.
    roadmap: ''
    source_refs:

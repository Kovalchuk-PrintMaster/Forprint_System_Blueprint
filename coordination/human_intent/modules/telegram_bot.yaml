schema_version: forprint_module_human_intent_ledger_v0_1
module_id: telegram_bot
display_name: Telegram Bot
authority: planning_context_not_release_authority
status: active_planning_context
append_only: true
intents:
  - status: RECOVERED
    text: 'Telegram має бути conversational operating interface: identity + memory + natural-language intent + multimodal
      + order/admin orchestration.'
    context: Факти бере з canonical модулів.
    roadmap: ''
    intent_id: HI-TELEGRAM-BOT-001
  - status: AGREED
    text: Фото/опис товару йде в Semantic Retrieval, після чого Telegram показує кілька candidates і задає clarification.
    context: Не відповідати впевнено на основі одного fuzzy match.
    roadmap: ''
    intent_id: HI-TELEGRAM-BOT-002
  - status: AGREED
    text: Після підтвердження товару/варіанта Telegram передає structured request у Calculator.
    context: Chat history не є canonical order.
    roadmap: ''
    intent_id: HI-TELEGRAM-BOT-003
  - status: RECOVERED
    text: Speech-to-text повинен проходити через той самий intent pipeline, що й текст.
    context: Не створювати окрему бізнес-логіку для голосу.
    roadmap: ''
    intent_id: HI-TELEGRAM-BOT-004
  - status: RECOVERED
    text: Admin commands і money/destructive actions вимагають strong auth/confirmation.
    context: Наприклад taxi/procurement/status через owning modules.
    roadmap: ''
    intent_id: HI-TELEGRAM-BOT-005
  - status: RECOVERED
    text: Proactive events можуть повідомляти readiness/delay/courier/clarification, але лише з актуальних canonical states.
    context: Telegram не вигадує статус.
    roadmap: ''
    intent_id: HI-TELEGRAM-BOT-006
  - status: AGREED
    text: Для CRM identity Telegram може один раз у контексті замовлення підтвердити organization representation.
    context: Це допомагає зв'язати канал з CRM без ручного дублювання.
    roadmap: ''
    intent_id: HI-TELEGRAM-BOT-007
  - intent_id: HI-TELEGRAM-BOT-008
    status: AGREED
    text: When a person can represent an organization, Telegram should lightly state the currently selected customer/billing
      context once per relevant order/dialogue.
    context: 'Example: ''оформляю замовлення на Medicom'' so the person sees where the order will be billed.'
    roadmap: TG-ID-01
  - intent_id: HI-TELEGRAM-BOT-009
    status: AGREED
    text: Telegram must let the same person switch an order from organization context to personal context without creating
      a duplicate person.
    context: One channel identity may legitimately map to several business contexts.
    roadmap: TG-ID-02
  - intent_id: HI-TELEGRAM-BOT-010
    status: AGREED
    text: Closed organization representations must not be proposed for new Telegram orders, while historical order snapshots
      remain reconstructible.
    context: Temporal CRM relationship drives channel suggestions.
    roadmap: TG-ID-03
  - intent_id: HI-TELEGRAM-BOT-011
    status: AGREED
    text: Order-relevant Telegram confirmations should be persisted as structured/auditable evidence linked to the order,
      independent of whether the channel UI later still shows the message.
    context: A future retention/privacy policy must govern how much raw conversation is retained.
    roadmap: TG-AUDIT-01
  - intent_id: HI-TELEGRAM-BOT-012
    status: AGREED
    text: Telegram should support bounded supplier/contact enrichment dialogues that collect missing structured information
      without repeated manual relaying.
    context: Confirmed facts are routed to the correct domain owner.
    roadmap: TG-SUPPLIER-01
  - intent_id: HI-TELEGRAM-BOT-013
    status: AGREED
    text: Telegram roadmap should include voice-message transcription feeding the same structured intent pipeline as text,
      with future TTS/voice interaction later.
    context: Voice is a channel modality, not separate business logic.
    roadmap: TG-VOICE-01
  - intent_id: HI-TELEGRAM-BOT-014
    status: AGREED
    text: Telegram Bot is the primary human communication orchestrator across customers, suppliers, carriers/taxi and other
      external contacts, while business decisions remain with the appropriate domain modules.
    context: Telegram communicates domain results rather than becoming the owner of Logistics/Accounting/etc.
    roadmap: TG-ROLE-01
  - intent_id: HI-TELEGRAM-BOT-015
    status: AGREED
    text: Telegram must support both controlled menu-driven workflows for sensitive/financial interactions and a more natural
      conversational mode for ordinary communication.
    context: Sensitive flows use explicit identity/context/permissions and bounded choices.
    roadmap: TG-MODE-01
  - intent_id: HI-TELEGRAM-BOT-016
    status: AGREED
    text: Before dispatching a task to Calculator, Logistics or another domain module, Telegram must collect the required
      input set for that module or explicitly route a structured missing-information state.
    context: Avoid wasteful request/clarification ping-pong caused by obviously incomplete tickets.
    roadmap: TG-TICKET-01
  - intent_id: HI-TELEGRAM-BOT-017
    status: AGREED
    text: Completed and interrupted conversations must be preserved as traceable conversation episodes linked to participants
      and business context, while allowing multiple topics to coexist in one physical chat.
    context: Dialogue history may later be required for quality, disputes, delivery or accounting context.
    roadmap: TG-DIALOGUE-01
  - intent_id: HI-TELEGRAM-BOT-018
    status: AGREED
    text: 'Telegram must actively close communication loops such as delivery handoff: notify, monitor expected arrival, warn
      about paid waiting/timeout when applicable, confirm receipt and escalate contact when necessary.'
    context: Future voice/call adapter may be used for authorized escalation when text is not acknowledged.
    roadmap: TG-FOLLOWUP-01
  - intent_id: HI-TELEGRAM-BOT-019
    status: AGREED
    text: Telegram requires a deep repository inventory and ownership reconciliation before the next mature portfolio because
      it is one of the oldest modules and may contain stale or cross-domain instructions/capabilities.
    context: Conflicting historical instructions must be classified and removed/reassigned only through reviewed migration.
    roadmap: TG-INVENTORY-01
  - intent_id: HI-TELEGRAM-BOT-020
    status: AGREED
    text: External inbound messages must pass relevance/security/intake validation before they can trigger expensive search,
      AI dialogue or downstream module work.
    context: Accidental personal messages, pocket/noise text and suspicious extraction attempts must not become trusted tasks.
    roadmap: TG-INGRESS-01
  - intent_id: HI-TG-ARCH-20260919-001
    status: RECOVERED
    text: Telegram may adapt tone, structure, length, formality and contextual explanation, but it must not silently
      alter domain facts such as price, quantity, deadline, status, payment requirement, delivery fact or guarantee.
    context: Recovered from the 2026-09-19 evening architecture handoff; communication presentation is separate from
      business truth.
    roadmap: ''
    source_refs:
    - coordination/internal_work/blueprint/evening_reviews/2026-09-19/forprint_evening_architecture_handoff_20260919_v0_1/00_README.md
    - coordination/internal_work/blueprint/evening_reviews/2026-09-19/forprint_evening_architecture_handoff_20260919_v0_1/10_portfolio_reconciliation_20260921_v0_1.yaml
  - intent_id: HI-TG-ARCH-20260919-002
    status: RECOVERED
    text: Cross-module communication should prefer structured inbound domain requests/events and structured outbound
      communication intents; Telegram combines them with conversation state and communication context to render natural
      language.
    context: Recovered from the 2026-09-19 evening architecture handoff.
    roadmap: ''
    source_refs:
    - coordination/internal_work/blueprint/evening_reviews/2026-09-19/forprint_evening_architecture_handoff_20260919_v0_1/00_README.md
    - coordination/internal_work/blueprint/evening_reviews/2026-09-19/forprint_evening_architecture_handoff_20260919_v0_1/10_portfolio_reconciliation_20260921_v0_1.yaml
  - intent_id: HI-TG-ARCH-20260919-003
    status: RECOVERED
    text: Customer-specific terminology, recurring patterns, exceptions and communication preferences may inform Telegram
      behavior, but customer-specific semantics must not silently become global semantics.
    context: Recovered from the 2026-09-19 evening architecture handoff.
    roadmap: ''
    source_refs:
    - coordination/internal_work/blueprint/evening_reviews/2026-09-19/forprint_evening_architecture_handoff_20260919_v0_1/00_README.md
    - coordination/internal_work/blueprint/evening_reviews/2026-09-19/forprint_evening_architecture_handoff_20260919_v0_1/10_portfolio_reconciliation_20260921_v0_1.yaml
  - intent_id: HI-TG-ARCH-20260919-004
    status: RECOVERED
    text: Ambiguous or multi-file conversations should converge toward a structured Order Draft through bounded clarification
      modes; Calculator, Library and other domain services remain the canonical constraint providers.
    context: Recovered from the 2026-09-19 evening architecture handoff; avoid endless free-text clarification loops.
    roadmap: ''
    source_refs:
    - coordination/internal_work/blueprint/evening_reviews/2026-09-19/forprint_evening_architecture_handoff_20260919_v0_1/00_README.md
    - coordination/internal_work/blueprint/evening_reviews/2026-09-19/forprint_evening_architecture_handoff_20260919_v0_1/10_portfolio_reconciliation_20260921_v0_1.yaml
  - intent_id: HI-TG-ARCH-20260919-005
    status: RECOVERED
    text: Telegram should query a machine-readable historical asset index and deep-compare only a narrowed candidate
      set; it must not scan the raw customer archive live or own historical asset truth.
    context: Recovered from the 2026-09-19 evening architecture handoff.
    roadmap: ''
    source_refs:
    - coordination/internal_work/blueprint/evening_reviews/2026-09-19/forprint_evening_architecture_handoff_20260919_v0_1/00_README.md
    - coordination/internal_work/blueprint/evening_reviews/2026-09-19/forprint_evening_architecture_handoff_20260919_v0_1/10_portfolio_reconciliation_20260921_v0_1.yaml
  - intent_id: HI-TG-ARCH-20260919-006
    status: RECOVERED
    text: Long-running process state, waiting conditions, timers, deadlines, retries and transitions must live outside
      Telegram; Telegram participates through communication intents, acknowledgements and clarification.
    context: Recovered from the 2026-09-19 evening architecture handoff.
    roadmap: ''
    source_refs:
    - coordination/internal_work/blueprint/evening_reviews/2026-09-19/forprint_evening_architecture_handoff_20260919_v0_1/00_README.md

    status: RECOVERED
    text: Telegram template and synthetic-data generation must stay inside the current canonical intent, style and
      sentiment lookup vocabularies; generated rows must not silently invent new labels or expand the taxonomy without
      an explicit schema/taxonomy decision.
    context: The owner supplied explicit lookup tables. Later assistant-generated rows introduced unsupported friendly/playful/aggressive/urgent
      values; this is preserved as a historical contract-drift defect, not an authorized taxonomy expansion.
    roadmap: ''
    source_refs:

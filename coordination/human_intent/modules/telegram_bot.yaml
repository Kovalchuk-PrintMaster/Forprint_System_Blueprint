  - intent_id: HI-TG-BEHAVIOR-20260922-001
    status: RECOVERED
    text: Telegram intent/classification semantics should explicitly represent sales opportunity, customer refusal
      and objection-handling states so downstream dialogue logic can choose appropriate selling, clarification or
      fallback behavior instead of treating all requests as one generic dialogue class.
    context: Recovered from the internally anchored 2025-10-12 behavior-model dialogue. Exact current taxonomy names
      remain subject to live classifier/schema reconciliation.
    roadmap: ''
    source_refs:
    - coordination/internal_work/blueprint/evening_reviews/2025-10-12_internal_anchor/DFTB_telegram_bot_behavior_model_v0_1/00_intake_manifest_v0_1.yaml

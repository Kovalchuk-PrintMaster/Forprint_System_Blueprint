    status: RECOVERED
    text: 'Existing Telegram classifier label-map files are durable compatibility contracts: training, classify and
      evaluate code should read rather than silently overwrite them, deliberately support documented name-to-id and
      id-to-name forms where required, and preserve downstream decoder compatibility.'
    context: Recovered from the owner's explicit label-map preservation rule and historical intent-decoder failures.

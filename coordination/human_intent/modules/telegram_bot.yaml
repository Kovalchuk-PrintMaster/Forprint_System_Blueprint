  - intent_id: HI-TG-DATA-INGEST-20260922-002
    status: RECOVERED
    text: Dialogue/corpus ingestion should resolve an existing customer identity reference rather than invent a new
      client identity from the chat export; current canonical customer identity remains outside Telegram Bot.
    context: Historical source explicitly maps client_id from an existing clients table. Current architecture refines
      the owner to CRM/identity surfaces.
    roadmap: ''
    source_refs:

  - intent_id: HI-TG-ML-20260922-001
    status: RECOVERED
    text: Telegram classifier training data should remain modular by behavior/domain rather than be forced into one
      giant table, so weak domains such as sales, objections or order handling can be improved independently while
      the training pipeline combines them under a versioned dataset contract.
    context: Recovered directly from the owner discussion of separate dialogue/sales/objection/order datasets. Dataset
      registry, weighting and merge mechanics remain to be reconciled.
    roadmap: ''
    source_refs:
    - coordination/internal_work/blueprint/evening_reviews/2025-10-12_internal_anchor/DFTB_telegram_bot_behavior_model_v0_1/00_intake_manifest_v0_1.yaml

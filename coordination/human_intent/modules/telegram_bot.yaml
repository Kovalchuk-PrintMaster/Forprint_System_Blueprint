  - intent_id: HI-TG-DATA-INGEST-20260922-003
    status: RECOVERED
    text: Before expanding Telegram training data synthetically, use known-good examples that already import successfully
      to establish the active schema/format contract instead of guessing headers or field shapes.
    context: Owner explicitly changed the historical workflow to compatibility-first generation after providing known-good
      CSV samples.
    roadmap: ''
    source_refs:
    - coordination/internal_work/blueprint/evening_reviews/2026-10-07_filename_label/DFTB_telegram_bot_data_ingest_v0_1/00_intake_manifest_v0_1.yaml

  - intent_id: HI-TG-ML-ENGINEERING-20260922-001
    status: RECOVERED
    text: Before retraining Telegram classifiers, datasets should be audited for invalid labels, conflicting duplicate
      texts, ordinary duplicates, suspicious/low-quality examples, class imbalance and train/validation/test leakage;
      the resulting split and augmentation lineage should remain explicit.
    context: Recovered from the October-2025 Telegram ML engineering dialogue after owner-reported style accuracy
      0.6394. The owner asked for dataset correction, balancing and detailed review before retraining.
    roadmap: ''

  - intent_id: HI-TG-ML-ENGINEERING-20260922-002
    status: RECOVERED
    text: Telegram intent, style and sentiment classifiers should follow one shared structural discipline across training,
      classification and evaluation while preserving entity-specific datasets, label contracts, model artifacts, revisions,
      reports and paths so one classifier domain cannot collide with another.
    context: Recovered from repeated owner requests to align intent/style/sentiment training and evaluation scripts
      without collapsing their separate artifact namespaces.
    roadmap: ''
    source_refs:

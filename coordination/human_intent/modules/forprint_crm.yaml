schema_version: forprint_module_human_intent_ledger_v0_1
module_id: forprint_crm
display_name: ForPrint CRM
authority: planning_context_not_release_authority
status: active_planning_context
append_only: true
intents:
  - status: AGREED
    text: CRM має використовувати immutable person_id і organization_id; номер телефону — сильний практичний lookup, але не primary key БД.
    context: Людина може змінювати телефон, email чи месенджер.
    roadmap: ''
    intent_id: HI-FP-CRM-001
  - status: AGREED
    text: Одна людина може представляти різні організації в різний час; це temporal relationship з role, valid_from/to, status, source, confidence.
    context: При звільненні relation закривається, історія не стирається.
    roadmap: ''
    intent_id: HI-FP-CRM-002
  - status: AGREED
    text: 'Замовлення зберігає snapshot representation: person_id, organization_id, representation_id, confirmed_at.'
    context: Щоб через рік було зрозуміло, від чийого імені робилося замовлення.
    roadmap: ''
    intent_id: HI-FP-CRM-003
  - status: AGREED
    text: Telegram або інший канал може один раз на замовлення уточнити, яку організацію людина зараз представляє.
    context: Це не повинно перетворюватися на нав'язливе підтвердження в кожному повідомленні.
    roadmap: ''
    intent_id: HI-FP-CRM-004
  - status: AGREED
    text: Потрібна generic anonymous one-off customer модель для випадків, де повний профіль не має сенсу.
    context: Не змушувати менеджера створювати фіктивні організації.
    roadmap: ''
    intent_id: HI-FP-CRM-005
  - status: AGREED
    text: CRM повинна вміти merge/split/dedup identity і зберігати cross-channel identifiers.
    context: Телефон, email, Telegram/Viber IDs — це identifiers, а не сама сутність людини.
    roadmap: ''
    intent_id: HI-FP-CRM-006
  - status: RECOVERED
    text: 'CRM — людський cockpit: open work, orders, blockers, communication context, next actions, dashboards і follow-ups.'
    context: Вона не повинна ставати другою базою клієнтів/замовлень/платежів.
    roadmap: ''
    intent_id: HI-FP-CRM-007
  - status: AGREED
    text: CRM бере контактний контекст для AR collection, але сам фінансовий стан боргу належить Accounting.
    context: Менеджер бачить борг і діалог, але ledger truth не дублюється.
    roadmap: ''
    intent_id: HI-FP-CRM-008
  - intent_id: HI-FP-CRM-009
    status: AGREED
    text: One immutable person may simultaneously have a personal customer context and active representation of one or more organizations.
    context: A phone number identifies the person/contact path, not a single billing customer.
    roadmap: CRM-ID-01
  - intent_id: HI-FP-CRM-010
    status: AGREED
    text: Organization representation remains temporal; when a person leaves an organization the relation closes for new orders while historical order snapshots remain intact.
    context: Do not let former employee orders fall onto the old organization.
    roadmap: CRM-ID-02
  - intent_id: HI-FP-CRM-011
    status: AGREED
    text: An order must record the selected billing/customer context separately from the person who is communicating.
    context: The same person can order notebooks personally and company materials for Medicom using one phone number.
    roadmap: CRM-ID-03
  - intent_id: HI-FP-CRM-012
    status: AGREED
    text: CRM should preserve normalized phone identity plus human display formatting and fast last-four lookup without using the phone as database primary key.
    context: Legacy folders/filenames may still show spaced phone formatting for operators.
    roadmap: CRM-ID-04
  - intent_id: HI-FP-CRM-013
    status: AGREED
    text: 'CRM is a unified operational entry point: one guided interface may compose related actions across multiple owner modules.'
    context: Humans should not manually visit many module tabs for one normal workflow.
    roadmap: CRM-WORKSPACE-01
  - intent_id: HI-FP-CRM-014
    status: AGREED
    text: CRM should provide configurable role/department dashboards and large-screen wallboards for operational visibility.
    context: Keep dashboard capability encapsulated in CRM for now and extract later only if objectively justified.
    roadmap: CRM-DASH-01
  - intent_id: HI-FP-CRM-015
    status: AGREED
    text: CRM may read/present cross-domain truth and submit structured commands, but it does not own Accounting, Warehouse, Production, Logistics or other foreign domain truth.
    context: Shared PostgreSQL does not remove logical ownership.
    roadmap: CRM-BOUNDARY-01
  - intent_id: HI-FP-CRM-016
    status: AGREED
    text: Management/CRM views should surface plan-versus-actual variance for time, material, cost/price, reprints, delays and resource blockers.
    context: Configurable tolerance breaches become visible exceptions.
    roadmap: CRM-DASH-02
  - intent_id: HI-FP-CRM-017
    status: AGREED
    text: A composite CRM workflow should support onboarding a new supplier/material from partial information and route enrichment/validation to domain owners.
    context: Enter known information once; gate only critical missing facts before irreversible actions.
    roadmap: CRM-WORKSPACE-02
  - intent_id: HI-FP-CRM-018
    status: AGREED
    text: CRM should evolve toward Customer/Supplier 360, universal search, cross-module activity timeline, saved role workspaces and exception/task centers.
    context: These are views/projections, not a competing master database.
    roadmap: CRM-WORKSPACE-03
  - intent_id: HI-FP-U92-20260903-002
    status: AGREED
    text: Customer Cabinet/Portal and basket/checkout composition belong in the CRM/business-workflow surface while Calculator, IAM, Accounting, Operations and Logistics retain their own semantic truth.
    source_refs:
      - coordination/internal_work/blueprint/evening_packages/2026-09-03__u92/
      - coordination/internal_work/blueprint/evening_reviews/2026-09-03/2026-09-03__u92_architecture_governance_integration_v0_1.md
    roadmap_refs:
      - coordination/roadmaps/details/forprint_system_blueprint/portfolio_module_roadmap_approval_matrix_v0_1.yaml
      - coordination/roadmaps/details/forprint_system_blueprint/portfolio_full_horizon_target_states_v0_1.yaml
  - intent_id: HI-CRM-ARCH-20260919-001
    status: RECOVERED
    text: Customer intelligence should separate a manager-selected Seed Profile, an evidence-derived Observed Customer
      Model and the currently applicable Effective Policy; a seed preset is not permanent classification or authority.
    context: Recovered from the 2026-09-19 evening architecture handoff.
    roadmap: ''
    source_refs:
    - coordination/internal_work/blueprint/evening_reviews/2026-09-19/forprint_evening_architecture_handoff_20260919_v0_1/00_README.md
    - coordination/internal_work/blueprint/evening_reviews/2026-09-19/forprint_evening_architecture_handoff_20260919_v0_1/10_portfolio_reconciliation_20260921_v0_1.yaml
  - intent_id: HI-CRM-ARCH-20260919-002
    status: RECOVERED
    text: Customer behavior learning should distinguish baseline, exception, possible shift, probable shift and new
      baseline using recency, minimum evidence, hysteresis and contextual segmentation rather than lifetime-majority
      counting.
    context: Recovered from the 2026-09-19 evening architecture handoff.
    roadmap: ''
    source_refs:
    - coordination/internal_work/blueprint/evening_reviews/2026-09-19/forprint_evening_architecture_handoff_20260919_v0_1/00_README.md
    - coordination/internal_work/blueprint/evening_reviews/2026-09-19/forprint_evening_architecture_handoff_20260919_v0_1/10_portfolio_reconciliation_20260921_v0_1.yaml
  - intent_id: HI-CRM-ARCH-20260919-003
    status: RECOVERED
    text: Descriptive customer evidence, customer preferences and ForPrint control policy are different layers; observed
      behavior must not silently grant commercial, financial or operational authority.
    context: Recovered from the 2026-09-19 evening architecture handoff.
    roadmap: ''
    source_refs:
    - coordination/internal_work/blueprint/evening_reviews/2026-09-19/forprint_evening_architecture_handoff_20260919_v0_1/00_README.md
    - coordination/internal_work/blueprint/evening_reviews/2026-09-19/forprint_evening_architecture_handoff_20260919_v0_1/10_portfolio_reconciliation_20260921_v0_1.yaml
  - intent_id: HI-CRM-ARCH-20260919-004
    status: RECOVERED
    text: Customer health should be a multidimensional trajectory over owner-sourced evidence such as payment health,
      value, growth, margin, service burden, order clarity, dispute risk, relationship stability and strategic potential.
    context: Recovered from the 2026-09-19 evening architecture handoff; track movement, not only a static category.
    roadmap: ''
    source_refs:
    - coordination/internal_work/blueprint/evening_reviews/2026-09-19/forprint_evening_architecture_handoff_20260919_v0_1/00_README.md
    - coordination/internal_work/blueprint/evening_reviews/2026-09-19/forprint_evening_architecture_handoff_20260919_v0_1/10_portfolio_reconciliation_20260921_v0_1.yaml
  - intent_id: HI-CRM-ARCH-20260919-005
    status: RECOVERED
    text: Customer-model and policy review should combine event-driven updates with periodic reconciliation and preserve
      transition history, evidence and reasons instead of overwriting the previous profile state.
    context: Recovered from the 2026-09-19 evening architecture handoff.
    roadmap: ''
    source_refs:
    - coordination/internal_work/blueprint/evening_reviews/2026-09-19/forprint_evening_architecture_handoff_20260919_v0_1/00_README.md

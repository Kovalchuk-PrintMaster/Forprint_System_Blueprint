schema_version: forprint_module_human_intent_ledger_v0_1
module_id: forprint_integration_gateway
display_name: ForPrint Integration Gateway
authority: planning_context_not_release_authority
status: active_planning_context
append_only: true
intents:
  - status: RECOVERED
    text: 'Gateway має бути тонким integration boundary: validation, normalization, routing, idempotency, correlation.'
    context: Не бізнес-мозок.
    roadmap: ''
    intent_id: HI-FP-INTEGRATION-GATEWAY-001
  - status: RECOVERED
    text: Він не повинен зберігати client/order/material/payment truth.
    context: Canonical data лишаються в owning modules.
    roadmap: ''
    intent_id: HI-FP-INTEGRATION-GATEWAY-002
  - status: AGREED
    text: Manual intake після нормалізації в Calculator і Telegram/Website requests можуть проходити через Gateway тоді, коли з’явиться реальна runtime handoff потреба.
    context: Не реактивувати його лише заради архітектурної краси.
    roadmap: ''
    intent_id: HI-FP-INTEGRATION-GATEWAY-003
  - status: RECOVERED
    text: Errors мають бути typed/structurally stable і не приховувати bad payload silent fixes.
    context: Краще explicit validation error.
    roadmap: ''
    intent_id: HI-FP-INTEGRATION-GATEWAY-004
  - status: AGREED
    text: Semantic Retrieval є окремим сервісом і не повинен перетворювати Gateway на search/AI engine.
    context: Gateway транспортує запит, не вирішує semantic truth.
    roadmap: ''
    intent_id: HI-FP-INTEGRATION-GATEWAY-005
  - intent_id: HI-FP-INTEGRATION-GATEWAY-006
    status: AGREED
    text: Gateway should validate and route runtime payloads against published ACTIVE contract revisions rather than owning the contract lifecycle itself.
    context: Contract Registry says what is agreed; Gateway applies that agreement in transport/runtime.
    roadmap: GW-CONTRACT-01
  - intent_id: HI-FP-INTEGRATION-GATEWAY-007
    status: AGREED
    text: Gateway must not silently reinterpret Library/CRM/Accounting semantics when normalizing a payload.
    context: If a semantic mapping changes, it requires the appropriate authority/contract revision.
    roadmap: GW-CONTRACT-02
  - intent_id: HI-FP-INTEGRATION-GATEWAY-008
    status: AGREED
    text: Integration Gateway must provide a canonical inter-module message envelope and validate contract/schema/version compatibility before routing a request or response.
    context: Internal module implementation can differ; the boundary format must remain controlled.
    roadmap: IG-CONTRACT-01
  - intent_id: HI-FP-INTEGRATION-GATEWAY-009
    status: AGREED
    text: Invalid or incompatible payloads must be rejected/quarantined with visible evidence rather than silently guessed, reshaped or ignored.
    context: The operator needs an administrative view of invalid exchanges and why they failed.
    roadmap: IG-VALIDATE-01
  - intent_id: HI-FP-INTEGRATION-GATEWAY-010
    status: AGREED
    text: Gateway integration control must include idempotency, bounded retries, dead-letter/quarantine behavior and audit/correlation evidence for failed or repeated inter-module exchanges.
    context: Transport reliability must not create duplicate business operations or hidden infinite loops.
    roadmap: IG-RELIABILITY-01
  - intent_id: HI-FP-INTEGRATION-GATEWAY-011
    status: AGREED
    text: Gateway validates transport/contract boundaries but does not become universal business-semantic owner; domain modules validate their own semantics and Contract Registry controls contract lifecycle.
    context: Runtime Inspector observes execution; Project Inspector audits design/conformance.
    roadmap: IG-BOUNDARY-01
  - intent_id: HI-FP-U92-20260903-006
    status: AGREED
    text: Shared resource concurrency must preserve persistent request state and explicit queue/wait/retry/degraded outcomes; TEMPORARILY_UNAVAILABLE is not equivalent to NOT_FOUND.

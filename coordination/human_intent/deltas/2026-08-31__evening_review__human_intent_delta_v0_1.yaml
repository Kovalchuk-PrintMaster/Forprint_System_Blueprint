schema_version: forprint_human_intent_delta_v0_1
date: '2026-08-31'
status: approved_evening_review_delta
authority: append_to_canonical_module_ledgers
modules:
  forprint_system_blueprint:
  - intent_id: HI-FP-SYSTEM-BLUEPRINT-014
    status: AGREED
    text: Expanded portfolio rendering/content rules must be documented so the same
      recognizable PDF structure can be regenerated by another assistant or generator.
    context: Portfolio layout must not depend on conversational memory.
    roadmap: BP-PORTFOLIO-01
  - intent_id: HI-FP-SYSTEM-BLUEPRINT-015
    status: AGREED
    text: Portfolio roadmap should show the rough full route to target state even
      when distant steps are not yet fully discussed.
    context: Future steps may be synthetic if they are visibly marked and do not pretend
      to be approved implementation.
    roadmap: BP-PORTFOLIO-02
  - intent_id: HI-FP-SYSTEM-BLUEPRINT-016
    status: AGREED
    text: Synthetic portfolio content is useful and should remain visible with a distinct
      status/color plus confidence/evidence basis.
    context: Synthetic does not mean bad; it means useful forward projection that
      still needs review.
    roadmap: BP-PORTFOLIO-03
  - intent_id: HI-FP-SYSTEM-BLUEPRINT-017
    status: AGREED
    text: Historical portfolio PDFs must remain in the project under versioned/date
      filenames and must not be overwritten by a newer projection.
    context: The PDF is history/projection, not release authority.
    roadmap: BP-PORTFOLIO-04
  - intent_id: HI-FP-SYSTEM-BLUEPRINT-018
    status: AGREED
    text: Cross-module semantic invariants should become a machine-readable governance
      surface consumed by Inspector.
    context: Examples include phone-not-identity, QR-not-permission and filename-not-source-of-truth.
    roadmap: BP-SEMANTIC-01
  forprint_project_inspector:
  - intent_id: HI-FP-PROJECT-INSPECTOR-007
    status: AGREED
    text: Project Inspector owns Semantic Consistency Audit as an internal capability;
      no separate semantic-audit ForPrint module is created.
    context: Keep the ecosystem small; Inspector remains independent and does not
      become domain owner.
    roadmap: PI-S1
  - intent_id: HI-FP-PROJECT-INSPECTOR-008
    status: AGREED
    text: Incremental Inspector review must compare last_inspected_commit/checkpoint
      to the current target commit, not rely only on git status.
    context: Committed daytime changes must remain visible to the next audit.
    roadmap: PI-S1
  - intent_id: HI-FP-PROJECT-INSPECTOR-009
    status: AGREED
    text: Anything that can be proven deterministically should be checked by scripts
      before involving an LLM.
    context: Schemas, revisions, indexes, tests, contract support and evidence are
      cheaper/more reliable mechanically.
    roadmap: PI-S2
  - intent_id: HI-FP-PROJECT-INSPECTOR-010
    status: AGREED
    text: When interpretive policy/business/legal/customer-facing content changes,
      Inspector builds a bounded semantic audit package for an LLM worker.
    context: The worker receives changed content plus applicable authorities, contracts,
      Human Intent and explicit questions.
    roadmap: PI-S4
  - intent_id: HI-FP-PROJECT-INSPECTOR-011
    status: AGREED
    text: The semantic LLM worker may ask Inspector for additional bounded context
      instead of guessing missing authority.
    context: Inspector can repack relevant documents and rerun the review.
    roadmap: PI-S5
  - intent_id: HI-FP-PROJECT-INSPECTOR-012
    status: AGREED
    text: Semantic review triggers are risk-based, not diff-size-based; a one-line
      policy change can require immediate LLM review.
    context: High-risk categories include identity, payment, legal, customer-facing,
      production-safety and authority changes.
    roadmap: PI-S7
  - intent_id: HI-FP-PROJECT-INSPECTOR-013
    status: AGREED
    text: A portfolio-wide semantic sweep should initially run about monthly and may
      move to quarterly/semiannual cadence as the architecture matures.
    context: Event-driven high-risk audits remain active even when full-sweep cadence
      decreases.
    roadmap: PI-S8
  - intent_id: HI-FP-PROJECT-INSPECTOR-014
    status: AGREED
    text: Inspector semantic findings need a stable taxonomy covering contradiction,
      ambiguity, ownership violation, contract divergence, term drift, stale authority,
      Human Intent divergence, hidden defaults, orphan rules and cross-module behavior
      conflict.
    context: Findings must be structured rather than a vague AI opinion.
    roadmap: PI-S6
  - intent_id: HI-FP-PROJECT-INSPECTOR-015
    status: AGREED
    text: Semantic findings must carry severity, confidence, evidence, affected modules
      and recommended resolution owner.
    context: The report must be usable by Blueprint/human governance.
    roadmap: PI-S6
  - intent_id: HI-FP-PROJECT-INSPECTOR-016
    status: AGREED
    text: Inspector and its LLM worker detect, verify, compare, classify, report and
      route; they do not invent business rules or silently rewrite domain semantics.
    context: A suspected defect in an authority document is routed back to that authority
      owner.
    roadmap: PI-S10
  - intent_id: HI-FP-PROJECT-INSPECTOR-017
    status: AGREED
    text: For legally meaningful content, LLM review performs issue spotting and contradiction
      analysis but does not declare material legal compliance confirmed.
    context: Final legal certainty remains a separate human/legal-review boundary.
    roadmap: PI-S10
  - intent_id: HI-FP-PROJECT-INSPECTOR-018
    status: AGREED
    text: Inspector should consume a future machine-readable Cross-Module Invariant
      Registry maintained under Blueprint governance.
    context: The registry makes semantic checks more deterministic without giving
      Inspector semantic ownership.
    roadmap: PI-S3
  forprint_contract_registry:
  - intent_id: HI-FP-CONTRACT-REGISTRY-006
    status: AGREED
    text: 'The previous open Contract Registry lifecycle question is conceptually
      resolved: the module is a versioned registry of significant inter-module interface
      agreements.'
    context: This supersedes the uncertainty expressed by HI-FP-CONTRACT-REGISTRY-005
      without deleting that historical GAP.
    roadmap: CR-01
  - intent_id: HI-FP-CONTRACT-REGISTRY-007
    status: AGREED
    text: Library owns reusable domain semantics; Contract Registry owns the versioned
      interface agreement that carries those semantics between modules.
    context: Contract Registry must not become Library.
    roadmap: CR-01
  - intent_id: HI-FP-CONTRACT-REGISTRY-008
    status: AGREED
    text: Gateway is a runtime consumer/enforcer of ACTIVE contracts; it is not the
      canonical home of contract lifecycle.
    context: Contract Registry and Gateway remain separate responsibilities.
    roadmap: CR-01
  - intent_id: HI-FP-CONTRACT-REGISTRY-009
    status: AGREED
    text: A contract record should track provider, consumers, revision, purpose, schemas/artifacts,
      semantic authority references, compatibility, validators, examples, adoption
      and migration lifecycle.
    context: Exact physical schema is implementation work, but this target information
      set is agreed.
    roadmap: CR-02
  - intent_id: HI-FP-CONTRACT-REGISTRY-010
    status: AGREED
    text: Contract lifecycle should distinguish DRAFT, PROPOSED, READY_FOR_ADOPTION,
      ACTIVE, SUPPORTED_LEGACY, DEPRECATED, BLOCKED, REVOKED and RETIRED.
    context: Lifecycle details can be refined while preserving the distinction between
      candidate, active, legacy and unsafe revisions.
    roadmap: CR-04
  - intent_id: HI-FP-CONTRACT-REGISTRY-011
    status: AGREED
    text: Contract Registry must classify breaking versus non-breaking revisions instead
      of assuming compatibility from a version string.
    context: A breaking revision cannot silently become active while required consumers
      are unprepared.
    roadmap: CR-05
  - intent_id: HI-FP-CONTRACT-REGISTRY-012
    status: AGREED
    text: Each contract revision needs a provider/consumer adoption matrix and independent
      Inspector conformance evidence.
    context: Blueprint uses the matrix to prevent one module running ahead of dependencies.
    roadmap: CR-06
  - intent_id: HI-FP-CONTRACT-REGISTRY-013
    status: AGREED
    text: Contracts should carry representative fixtures and edge-case test vectors
      so support can be proven, not merely declared in documentation.
    context: Inspector can execute common conformance suites.
    roadmap: CR-07
  - intent_id: HI-FP-CONTRACT-REGISTRY-014
    status: AGREED
    text: Contract changes need impact analysis showing direct and important indirect
      affected modules.
    context: This feeds Blueprint dependency balancing and rollout planning.
    roadmap: CR-08
  - intent_id: HI-FP-CONTRACT-REGISTRY-015
    status: AGREED
    text: Core interface meaning should remain transport-neutral where practical;
      HTTP/queue/internal-call adapters should not silently redefine business semantics.
    context: Transport belongs to runtime integration concerns.
    roadmap: CR-03
  - intent_id: HI-FP-CONTRACT-REGISTRY-016
    status: AGREED
    text: Contract Registry records readiness/adoption but does not unilaterally activate
      breaking ecosystem semantics.
    context: At current maturity, Blueprint remains the activation governance point
      after required evidence.
    roadmap: CR-12
  - intent_id: HI-FP-CONTRACT-REGISTRY-017
    status: AGREED
    text: The first full Contract Registry lifecycle pilot will be the Calculator
      to Operations Control Registry Job Specification contract.
    context: The Calculator target is not fully fixed, so exact pilot fields remain
      future detailed work.
    roadmap: CR-09
  - intent_id: HI-FP-CONTRACT-REGISTRY-018
    status: AGREED
    text: The mature target includes safe deprecation/migration/retirement and a portfolio
      compatibility view, but late automation steps remain synthetic until proven
      by earlier pilots.
    context: Keep the full horizon visible without pretending late mechanics are already
      decided.
    roadmap: CR-14
  forprint_integration_gateway:
  - intent_id: HI-FP-INTEGRATION-GATEWAY-006
    status: AGREED
    text: Gateway should validate and route runtime payloads against published ACTIVE
      contract revisions rather than owning the contract lifecycle itself.
    context: Contract Registry says what is agreed; Gateway applies that agreement
      in transport/runtime.
    roadmap: GW-CONTRACT-01
  - intent_id: HI-FP-INTEGRATION-GATEWAY-007
    status: AGREED
    text: Gateway must not silently reinterpret Library/CRM/Accounting semantics when
      normalizing a payload.
    context: If a semantic mapping changes, it requires the appropriate authority/contract
      revision.
    roadmap: GW-CONTRACT-02
  forprint_library:
  - intent_id: HI-FP-LIBRARY-009
    status: AGREED
    text: Library owns canonical aliases, common misspellings, short production tokens,
      naming profiles and profile-specific defaults for materials/operations/device
      capabilities.
    context: Calculator consumes these definitions instead of maintaining a private
      vocabulary.
    roadmap: LIB-FILE-01
  - intent_id: HI-FP-LIBRARY-010
    status: AGREED
    text: A short human filename may omit common information only when the active
      naming profile defines the default unambiguously.
    context: 'Example: Ricoh lamMat represents the agreed default thin matte roll
      lamination.'
    roadmap: LIB-FILE-02
  - intent_id: HI-FP-LIBRARY-011
    status: AGREED
    text: The same short token may have different meaning across equipment/production
      profiles, so structured profile/capability context must remain explicit.
    context: Do not globally interpret a token without its naming/production profile.
    roadmap: LIB-FILE-03
  - intent_id: HI-FP-LIBRARY-012
    status: AGREED
    text: Library semantic changes that affect inter-module payloads must flow through
      a versioned Contract Registry/adoption process rather than being changed locally
      in one consumer.
    context: Avoid modules drifting onto different meanings of the same field/token.
    roadmap: LIB-FILE-04
  - intent_id: HI-FP-LIBRARY-013
    status: AGREED
    text: Library should eventually provide standardized visual/SOP instructions for
      Job Ticket and Operations Assistant steps, with manager-provided notes/images
      as fallback when no standard exists.
    context: Human guidance is a Library knowledge responsibility; execution truth
      remains OCR.
    roadmap: LIB-FILE-05
  calculator_engine:
  - intent_id: HI-CALCULATOR-ENGINE-014
    status: AGREED
    text: Calculator is the primary implementation owner for parsing, normalizing
      and rendering human production filenames, while Library owns the vocabulary/profile
      semantics.
    context: One generator/parser should prevent different modules inventing different
      naming rules.
    roadmap: CALC-FILE-01
  - intent_id: HI-CALCULATOR-ENGINE-015
    status: AGREED
    text: Canonical human production filenames use single underscore semantic blocks;
      mandatory double-underscore separators are rejected as visually unnecessary.
    context: Human typing speed and readability are first-class requirements.
    roadmap: CALC-FILE-02
  - intent_id: HI-CALCULATOR-ENGINE-016
    status: AGREED
    text: In the production filename quantity expression copies x N, N means physical
      sheets per copy, not PDF pages.
    context: The operator thinks in sheets; future validation must preserve this meaning.
    roadmap: CALC-FILE-03
  - intent_id: HI-CALCULATOR-ENGINE-017
    status: AGREED
    text: Calculator should validate manually created filenames against deterministic
      file/job evidence and correct/report sheet-count mismatches when the production
      convention makes the result unambiguous.
    context: If the evidence is ambiguous, ask rather than silently guess.
    roadmap: CALC-FILE-04
  - intent_id: HI-CALCULATOR-ENGINE-018
    status: AGREED
    text: For the Ricoh sheet profile, lamMat is the short human token for the agreed
      default matte 25 µm roll lamination without forcing the operator to type 25.
    context: Canonical database state still stores the exact lamination properties.
    roadmap: CALC-FILE-05
  - intent_id: HI-CALCULATOR-ENGINE-019
    status: AGREED
    text: 'Manual/offline production files remain supported: after systems recover,
      Calculator parses and reconciles them into canonical job/order flow while preserving
      original filename and provenance.'
    context: Do not make server availability a requirement for emergency manual production.
    roadmap: CALC-FILE-06
  - intent_id: HI-CALCULATOR-ENGINE-020
    status: AGREED
    text: Calculator should emit required production capability/profile context in
      structured data so an abstract file is not misinterpreted when removed from
      its legacy machine directory.
    context: Human filename does not need to carry a physical printer serial number.
    roadmap: CALC-FILE-07
  - intent_id: HI-CALCULATOR-ENGINE-021
    status: AGREED
    text: Calculator Job Specification is the agreed first Contract Registry lifecycle
      pilot toward Operations Control Registry.
    context: The exact contract remains to be detailed when Calculator target architecture
      is sufficiently mature.
    roadmap: CALC-CONTRACT-01
  forprint_crm:
  - intent_id: HI-FP-CRM-009
    status: AGREED
    text: One immutable person may simultaneously have a personal customer context
      and active representation of one or more organizations.
    context: A phone number identifies the person/contact path, not a single billing
      customer.
    roadmap: CRM-ID-01
  - intent_id: HI-FP-CRM-010
    status: AGREED
    text: Organization representation remains temporal; when a person leaves an organization
      the relation closes for new orders while historical order snapshots remain intact.
    context: Do not let former employee orders fall onto the old organization.
    roadmap: CRM-ID-02
  - intent_id: HI-FP-CRM-011
    status: AGREED
    text: An order must record the selected billing/customer context separately from
      the person who is communicating.
    context: The same person can order notebooks personally and company materials
      for Medicom using one phone number.
    roadmap: CRM-ID-03
  - intent_id: HI-FP-CRM-012
    status: AGREED
    text: CRM should preserve normalized phone identity plus human display formatting
      and fast last-four lookup without using the phone as database primary key.
    context: Legacy folders/filenames may still show spaced phone formatting for operators.
    roadmap: CRM-ID-04
  telegram_bot:
  - intent_id: HI-TELEGRAM-BOT-008
    status: AGREED
    text: When a person can represent an organization, Telegram should lightly state
      the currently selected customer/billing context once per relevant order/dialogue.
    context: 'Example: ''оформляю замовлення на Medicom'' so the person sees where
      the order will be billed.'
    roadmap: TG-ID-01
  - intent_id: HI-TELEGRAM-BOT-009
    status: AGREED
    text: Telegram must let the same person switch an order from organization context
      to personal context without creating a duplicate person.
    context: One channel identity may legitimately map to several business contexts.
    roadmap: TG-ID-02
  - intent_id: HI-TELEGRAM-BOT-010
    status: AGREED
    text: Closed organization representations must not be proposed for new Telegram
      orders, while historical order snapshots remain reconstructible.
    context: Temporal CRM relationship drives channel suggestions.
    roadmap: TG-ID-03
  - intent_id: HI-TELEGRAM-BOT-011
    status: AGREED
    text: Order-relevant Telegram confirmations should be persisted as structured/auditable
      evidence linked to the order, independent of whether the channel UI later still
      shows the message.
    context: A future retention/privacy policy must govern how much raw conversation
      is retained.
    roadmap: TG-AUDIT-01
  forprint_operations_control_registry:
  - intent_id: HI-FP-OPERATIONS-CONTROL-REGISTRY-011
    status: AGREED
    text: Operations Control Registry owns the versioned Job Ticket as the complete
      human production document; filename remains a compact projection.
    context: Job Ticket can carry detailed operations, geometry, priority, holds,
      QR and revision.
    roadmap: OCR-TICKET-01
  - intent_id: HI-FP-OPERATIONS-CONTROL-REGISTRY-012
    status: AGREED
    text: The future order/job identifier replaces the legacy dollar marker as the
      structured link between production file and canonical order/accounting flow.
    context: Dollar remains a legacy hint only.
    roadmap: OCR-FILE-01
  - intent_id: HI-FP-OPERATIONS-CONTROL-REGISTRY-013
    status: AGREED
    text: Legacy wait should become explicit HOLD reasons such as HOLD_APPROVAL, HOLD_PAYMENT
      or HOLD_CLARIFICATION with START blocked until the gate clears.
    context: The file may be prepared in advance but cannot start printing while held.
    roadmap: OCR-HOLD-01
  - intent_id: HI-FP-OPERATIONS-CONTROL-REGISTRY-014
    status: AGREED
    text: Legacy first should become structured expedite/priority class rather than
      hidden filename ordering.
    context: Several jobs may share the same high-priority class.
    roadmap: OCR-PRIORITY-01
  - intent_id: HI-FP-OPERATIONS-CONTROL-REGISTRY-015
    status: AGREED
    text: Reprint must be a linked child-job workflow with reason, responsibility,
      quantity/material impact and separate billing consequence.
    context: Internal defect reprint may cost ForPrint without charging the customer.
    roadmap: OCR-REPRINT-01
  - intent_id: HI-FP-OPERATIONS-CONTROL-REGISTRY-016
    status: AGREED
    text: Proof/sample purpose must be structured independently from billing policy;
      a prova/proof can be free, included or paid.
    context: Production purpose must not silently dictate accounting.
    roadmap: OCR-PROOF-01
  - intent_id: HI-FP-OPERATIONS-CONTROL-REGISTRY-017
    status: AGREED
    text: A scanned stale Job Ticket/QR must warn that the paper revision is old and
      offer the current ticket; QR identifies the job but is not permission to execute.
    context: Current order state remains the execution gate.
    roadmap: OCR-TICKET-02
  forprint_operations_assistant:
  - intent_id: HI-FP-OPERATIONS-ASSISTANT-012
    status: AGREED
    text: Operations Assistant should teach a new worker how to read the short production
      filename and which material/process each token implies in the active profile.
    context: Use text first, then schemes/reference images, later real equipment photos
      when useful.
    roadmap: OA-TICKET-01
  - intent_id: HI-FP-OPERATIONS-ASSISTANT-013
    status: AGREED
    text: Operations Assistant displays the current Job Ticket on phone/tablet and
      can request another paper copy if the original is lost or damaged.
    context: OCR owns the ticket revision; Assistant is the human interface.
    roadmap: OA-TICKET-02
  - intent_id: HI-FP-OPERATIONS-ASSISTANT-014
    status: AGREED
    text: Assistant production queue should expose structured priority and HOLD state
      with text/icon as well as color; color alone is insufficient.
    context: Urgent jobs must be obvious and held jobs must not look runnable.
    roadmap: OA-QUEUE-01
  - intent_id: HI-FP-OPERATIONS-ASSISTANT-015
    status: AGREED
    text: Where Library has standardized finishing geometry, Assistant can show a
      visual final-result hint; otherwise an order-specific manager note/image can
      be displayed.
    context: 'Example: hole diameter and top-center position on a badge/tag.'
    roadmap: OA-TICKET-03
  - intent_id: HI-FP-OPERATIONS-ASSISTANT-016
    status: AGREED
    text: Assistant should expose a simple reprint reporting action from the Job Ticket/QR
      flow so the worker can report defect/reprint reason without learning a complex
      ERP.
    context: The resulting reprint semantics belong to OCR/Accounting/Warehouse.
    roadmap: OA-REPRINT-01
  forprint_prepress_hub:
  - intent_id: HI-FP-PREPRESS-HUB-007
    status: AGREED
    text: Prepress should expose a reusable deterministic document probe for PDF page
      count, dimensions and other technical evidence used by Calculator validation.
    context: Calculator initiates business validation; Prepress supplies file facts.
    roadmap: PP-FILE-01
  - intent_id: HI-FP-PREPRESS-HUB-008
    status: AGREED
    text: Production filename sheet-count correction may be automatic only when the
      agreed production/PDF convention makes physical sheet count deterministic; otherwise
      clarification is required.
    context: Do not guess duplex/imposition meaning from ambiguous files.
    roadmap: PP-FILE-02
  - intent_id: HI-FP-PREPRESS-HUB-009
    status: AGREED
    text: PDF production metadata may later carry stable production properties as
      an interoperability projection, but it does not replace canonical order/job
      state.
    context: JDF/XJDF/PDF metadata remain future adapter directions.
    roadmap: PP-INTEROP-01
  forprint_system_administration:
  - intent_id: HI-FP-SYSTEM-ADMINISTRATION-006
    status: AGREED
    text: System Administration must distinguish physical device instances by stable
      asset/device identity, model and serial even when workers casually call several
      machines 'Epson'.
    context: Operational analytics must know which actual device performed work.
    roadmap: SYS-DEVICE-01
  - intent_id: HI-FP-SYSTEM-ADMINISTRATION-007
    status: AGREED
    text: Production planning should distinguish required capability, eligible device
      group/queue and concrete device instance instead of encoding a printer serial
      in every human filename.
    context: This permits failover between similar machines.
    roadmap: SYS-DEVICE-02
  - intent_id: HI-FP-SYSTEM-ADMINISTRATION-008
    status: AGREED
    text: System Administration owns physical routing/fallback for Job Ticket printing;
      Operations Assistant may request a reprint but does not own printer configuration.
    context: Keep human interface separate from infrastructure routing.
    roadmap: SYS-TICKET-01
  production_runtime_inspector:
  - intent_id: HI-PRODUCTION-RUNTIME-INSPECTOR-006
    status: AGREED
    text: Runtime Inspector records the concrete physical device instance actually
      used for an operation, not only a generic machine family.
    context: Needed for maintenance, quality and true machine-performance analytics.
    roadmap: PRI-DEVICE-01
  - intent_id: HI-PRODUCTION-RUNTIME-INSPECTOR-007
    status: AGREED
    text: Similar/replaceable printers may share a capability queue while runtime
      evidence still identifies the exact device used.
    context: Planning capability and actual telemetry are separate concerns.
    roadmap: PRI-DEVICE-02
  forprint_accounting_registry_service:
  - intent_id: HI-FP-ACCOUNTING-REGISTRY-009
    status: AGREED
    text: 'Reprint responsibility and customer billing consequence are separate fields:
      an internal-defect reprint may consume material/cost without a new customer
      charge.'
    context: Accounting records the financial consequence; OCR owns the reprint execution
      workflow.
    roadmap: ACC-REPRINT-01
  - intent_id: HI-FP-ACCOUNTING-REGISTRY-010
    status: AGREED
    text: Proof/sample purpose does not automatically mean free; billing policy can
      be FREE, INCLUDED or PAID per case/policy.
    context: Do not infer finance solely from the legacy proba token.
    roadmap: ACC-PROOF-01
  warehouse_service:
  - intent_id: HI-WAREHOUSE-SERVICE-007
    status: AGREED
    text: A production reprint caused by internal defect must generate traceable additional
      physical material consumption/writeoff without silently changing the original
      planned quantity.
    context: OCR provides reprint execution context; Warehouse remains physical stock
      truth.
    roadmap: WH-REPRINT-01
  - intent_id: HI-WAREHOUSE-SERVICE-008
    status: AGREED
    text: Legacy filename material tokens are parser candidates; Warehouse consumes
      canonical material IDs after Library/Calculator normalization.
    context: Do not make warehouse stock truth depend on a misspelled filename token.
    roadmap: WH-FILE-01

global_directives:
  version: "0.1"
  scope: global
  source_module: forprint_system_blueprint
  description: >
    Global outbound directives from ForPrint System Blueprint to all active
    ForPrint modules.

  active:
    - directive_id: "2026-06-02__global__directive__module-coordination-standard-v1"
      status: active
      priority: p0
      created_at: "2026-06-02"
      applies_to:
        - all_active_modules
      file: "coordination/directives/global/active/2026-06-02__global__directive__module-coordination-standard-v1.md"
      summary: >
        All active ForPrint modules must apply the Module Coordination Standard:
        coordination/status, prompts, reports, indexes and current module state.
      requires_acknowledgement: true
      expected_module_action: >
        Add/update coordination directory and report completion through
        coordination/reports/index.yaml and current_status.yaml.

    - directive_id: "2026-07-14__global__directive__compact-report-output-v0-1"
      status: active
      priority: p0
      created_at: "2026-07-14"
      applies_to:
        - all_active_modules
      file: "coordination/directives/global/active/2026-07-14__global__directive__compact-report-output-v0-1.md"
      summary: >
        All active ForPrint modules must use compact routine check and handoff
        output while preserving extended diagnostics in stable report artifacts.
      requires_acknowledgement: true
      expected_module_action: >
        Align default check output, provide an extended diagnostic mode and
        report the implementation through the module coordination workflow.
  planned:
    - directive_id: "2026-08-06__global__directive__completion-intake-and-acceptance-governance-v0-1"
      status: planned
      priority: p0
      created_at: "2026-08-06"
      applies_to:
        - all_active_modules
      file: "coordination/directives/global/planned/2026-08-06__global__directive__completion-intake-and-acceptance-governance-v0-1.md"
      summary: >
        Define module-owned remediation, read-only Blueprint intake,
        schema-aware historical handling, superseding packets and explicit
        operator-controlled acceptance.
      requires_acknowledgement: false
      activation_requires_separate_decision: true
      expected_module_action: >
        None until Blueprint records a separate activation decision.
  archived: []

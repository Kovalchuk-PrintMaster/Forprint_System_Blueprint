schema_version: forprint_blueprint_full_knowledge_index_wave_d_v0_1
date: '2026-08-29'
scope: forprint_system_blueprint_only
status: local_implementation_candidate
depends_on:
  - blueprint_normalization_foundation_wave_a
  - blueprint_normalization_wave_b_identity_routing
  - blueprint_semantic_normalization_consolidated_wave_c_v1_3
purpose:
  - index the stabilized post-normalization Blueprint source tree
  - provide deterministic file/document/reference/dependency navigation
  - separate hard machine dependency errors from semantic review candidates
outputs:
  - indexes/files.json
  - indexes/document_catalog.yaml
  - indexes/references.json
  - indexes/dependencies.json
  - indexes/review_candidates.yaml
  - indexes/knowledge_summary.yaml
index_semantics:
  authority: none
  unresolved_reference_is_automatic_defect: false
  historical_reference_is_automatic_defect: false
  unknown_current_machine_module_endpoint_is_defect: true
determinism:
  excluded_roots:
    - indexes/
    - reports/
    - tmp/
    - .venv_blueprint/
    - caches
  excluded_files:
    - tmp.py
protected:
  current_release: coordination/releases/current.yaml
  module_identity: machine/module_identity_registry.yaml
  module_architecture: machine/modules.yaml
  operations_current_queue: coordination/outgoing_prompts/forprint_operations_control_registry/index.yaml
safety:
  git_commit: false
  git_push: false
  git_network: false
  external_repo_write: false
  current_release_change: false
  h10_authority_change: false

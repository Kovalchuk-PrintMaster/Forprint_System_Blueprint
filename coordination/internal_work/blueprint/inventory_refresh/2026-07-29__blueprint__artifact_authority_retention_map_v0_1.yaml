authority_order:
- canonical machine contracts and registries
- governance and policy
- roadmaps and prompt queue indexes
- approved prompt and accepted review evidence
- dated immutable snapshots
- automation source and tests
- authored documentation
- generated views
- operator input and temporary runtime artifacts
global_rules:
- rule_id: generated_is_not_authority
  rule: Generated reports, diagrams and guides are not canonical unless a tracked policy explicitly declares them
    authoritative.
- rule_id: history_is_immutable
  rule: Dated snapshots and accepted review evidence are never silently overwritten.
- rule_id: runtime_is_not_unique_evidence
  rule: tmp and operator-input locations must not hold the only copy of a decision.
- rule_id: deletion_requires_dependency_review
  rule: Tracked artifacts are not deleted until consumers, references and recovery are verified.
- rule_id: cross_repository_write_forbidden
  rule: This inventory map authorizes no writes to external module repositories.

  - expired sensitive elevation approval fails closed
  - capability_id mismatch fails closed
  - capability_class mismatch fails closed
  - repository scope mismatch fails closed
  - actor mismatch fails closed
  - session/execution binding mismatch fails closed
  - approval cannot satisfy canonical lease requirement
  - approval cannot grant commit/push/merge/release/promotion authority
  - legacy launch approval tests remain green
  - existing Protected Terminal default/read-only behavior remains green
  - Makefile operator surface forwards only the bounded approval artifact input
  acceptance:
  - Tests-first RED is observed for the new sensitive-elevation adapter behavior.
  - All legacy operator approval gateway tests pass unchanged or with backward-compatible assertions.
  - All existing Protected Terminal gateway tests pass.
  - Approval evidence is bound to exact capability, repository, actor, session/execution, and expiry.
  - Approval presence does not itself create authority.
  - SAFE_WRITE remains blocked by EXCLUSIVE_MODULE_LEASE_NOT_PROVEN.
  - Live cancel remains DEPENDENCY_PENDING_CF10.

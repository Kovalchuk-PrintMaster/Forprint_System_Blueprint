    approval_evidence_is_not_authority: true
    approval_presence_never_enables_capability_by_itself: true
    current_capability_behavior_must_remain_backward_compatible: true
    current_safe_write_blocker: EXCLUSIVE_MODULE_LEASE_NOT_PROVEN
    current_live_cancel_state: DEPENDENCY_PENDING_CF10
    safe_write_execution_allowed_after_this_slice: false
    commit_push_merge_release_promotion_allowed_after_this_slice: false
    arbitrary_shell_allowed: false
  operator_surface:
    makefile_change_required: true
    must_expose_only_supported_bounded_approval_input: true
    must_not_expose_unrestricted_authority_switch: true
  tests_first_red_plan:

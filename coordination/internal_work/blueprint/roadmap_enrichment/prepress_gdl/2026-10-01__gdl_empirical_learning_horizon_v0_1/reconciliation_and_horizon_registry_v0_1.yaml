  title: Prompt Pattern Library and Composer
  source_intended_state: PLANNED_REQUIRES_EMPIRICAL_EVIDENCE
  purpose: Extract reusable prompt fragments and anti-patterns from successful and
    failed cases and compose product/task-specific prompts from evidence rather than
    intuition.
  blueprint_reconciled_state: PLANNED_REQUIRES_EMPIRICAL_EVIDENCE
  execution_publication: not_published_executable

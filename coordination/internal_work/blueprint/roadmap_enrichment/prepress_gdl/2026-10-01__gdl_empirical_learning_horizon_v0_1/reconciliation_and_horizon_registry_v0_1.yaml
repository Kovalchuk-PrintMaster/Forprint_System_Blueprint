  title: Editable Output / Object / Layer Contract
  source_intended_state: HORIZON_REQUIRES_RECONCILIATION
  purpose: Define which output elements should be independently editable, scalable,
    replaceable, raster or vector, based on observed Creator reliability and downstream
    operator needs.
  blueprint_reconciled_state: HORIZON_REQUIRES_RECONCILIATION
  execution_publication: not_published_executable
- sequence: 6
  contour_id: prepress_gdl_local_transform_decision_layer_v0_1
  title: Local Transform Decision Layer

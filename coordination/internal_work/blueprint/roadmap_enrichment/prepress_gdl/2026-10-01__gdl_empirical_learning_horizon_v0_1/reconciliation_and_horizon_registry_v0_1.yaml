  purpose: Decide when crop, background extension, upscaling, cleanup, vectorization
    or layout normalization should be delegated to Creator versus local deterministic/specialized
    tooling.
  blueprint_reconciled_state: HORIZON_REQUIRES_EMPIRICAL_EVIDENCE
  execution_publication: not_published_executable
- sequence: 7
  contour_id: prepress_gdl_creator_adapter_execution_boundary_v0_1

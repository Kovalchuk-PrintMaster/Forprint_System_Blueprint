schema_version: forprint_gdl_worker_execution_policy_request_v0_1
status: BLUEPRINT_REVIEW_CANDIDATE
strategic_intent: >
  Shift repetitive engineering mechanics to the governed worker while keeping empirical
  product/workflow discovery with the Human Owner and assistant.
worker_should_own_when_authorized:
  - schema_implementation
  - validators
  - indexes
  - generated_views
  - focused_tests
  - regression_tests
  - Makefile_operator_targets
  - deterministic_builders
  - analytics_helpers
  - migrations
  - contract_adapters
  - documentation_generated_from_canonical_state
worker_must_not_invent:
  - customer_needs
  - aesthetic_quality_rules_without_evidence
  - new_provider_selection
  - production_authority
  - new_cross_module_ownership
  - Human_Intent
  - empirical_findings_not_supported_by_cases
execution_rules:
  - one_reconciled_executable_contour_at_a_time
  - inspect_current_state_before_mutation
  - exact_write_set
  - focused_tests_first
  - governance_and_continuity_closeout
  - Makefile_as_operator_facing_functional_map
  - no_Blueprint_mutation_from_Prepress
  - no_next_contour_activation_by_worker
  - return_completion_evidence_for_Blueprint_review
desired_effect: >
  Human time should move away from repetitive copy-run-fail-adjust engineering loops and
  toward observing real workflows, refining product intake, evaluating Creator behavior,
  and deciding what the system should learn.

  - coordination/global_policy/current_execution_focus.md
  - coordination/standards/automation/index.yaml
  - indexes/governance.yaml
  - indexes/roadmaps.yaml
  - AGENTS.md
stop_conditions:
- A path outside the frozen implementation write-set becomes necessary.
- Handoff v2 runtime or contract modification becomes necessary.
- Task Context schema modification becomes necessary.
- A new authority source or authority widening becomes necessary.
- Full Handoff base_context must be copied into the Worker prompt rather than the bounded projection.
- Explicit dispatch must carry mutable full context instead of a digest binding.
- Worker Invocation Bridge/MCP execution semantics must change.
- Lifecycle/roadmap state must be mutated to prove context delivery.
- A real Worker retry or attempt-ledger mutation would occur during validation.
- Concurrent committed or dirty changes intersect the audited dependency cone.

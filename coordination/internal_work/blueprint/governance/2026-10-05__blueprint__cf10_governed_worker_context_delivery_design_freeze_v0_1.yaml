  tests_first_required: true
  reuse_make_surface: governed-worker-cycle-check
  new_dedicated_make_target_allowed: false
  acceptance:
  - Handoff v2 runtime and contract remain unchanged
  - Task Context schema remains unchanged
  - prepared_execution contains only the bounded governed Worker context projection plus its digest
  - Handoff runtime manifest content is hash-verified before projection extraction
  - explicit dispatch decision_id binds governed_worker_context_sha256
  - launch fails closed on projection digest drift or Handoff manifest binding drift
  - canonical task_context/task_context_id are not mutated to smuggle context
  - Worker prompt contains lifecycle_roadmap_cursor including roadmap_sync
  - Worker prompt contains dependency_health_slice, resume_coordinates and expected_result_schema_revision
  - Worker prompt labels the projection non-authoritative
  - context cannot grant dispatch, path, git, release, promotion or acceptance authority
  - existing Worker Invocation Bridge/MCP validation surface remains unchanged
  - governed-worker-cycle-check covers the new context-delivery regression
  - existing CF09/CF10/Worker invocation regressions pass
  - no Worker attempt a029 is created or launched
  - OC01 remains paused
  must_not_modify:
  - scripts/coordination/assistant_handoff_v2_runtime_v0_1.py
  - coordination/standards/automation/assistant_handoff_v2_contract_v0_1.yaml
  - scripts/coordination/control_plane/context/task_context_adapter.py

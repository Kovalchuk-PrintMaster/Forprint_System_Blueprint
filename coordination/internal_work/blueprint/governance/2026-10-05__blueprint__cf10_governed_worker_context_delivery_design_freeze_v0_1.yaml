    the normalized Task Envelope.
  a028_effect: Worker could not verify the live lifecycle cursor/ROADMAP_SYNC context and correctly refused mutation.
architecture_decision:
  strategy: HASH_BOUND_NON_AUTHORITATIVE_CONTEXT_PROJECTION
  reuse_existing_handoff_v2: true
  modify_handoff_v2_runtime: false
  modify_handoff_v2_contract: false
  modify_task_context_schema: false
  new_authority_source: false
  projection_source: assistant_handoff_v2 TASK_EXECUTION runtime manifest
  projection_transport: prepared_execution -> ready_execution -> explicit dispatch digest binding -> governed launch
    invocation_context -> Worker prompt
  projection_is_instruction_authority: false
  work_front_remains_execution_authority: true
  task_envelope_remains_task_instruction_source: true
governed_worker_context_projection:
  schema_version: forprint_governed_worker_context_projection_v0_1
  required_fields:
  - handoff_manifest_sha256
  - handoff_source_state_fingerprint
  - dependency_health_slice
  - lifecycle_roadmap_cursor
  - resume_coordinates
  - expected_result_schema_revision
  - execution_bindings
  - authority
  execution_bindings:
  - work_front_or_project_onboard_not_applicable_reason
  - execution_profile_revision_for_task_execution
  - governed_procedure_revision_or_not_required_reason
  authority:
    context_grants_authority: false
    dispatch_authority_granted: false
    release_authority_granted: false
    cross_repository_write_authority_granted: false
  projection_sha256: SHA256 over deterministic canonical JSON of the projection without its digest field.
  worker_prompt_label: GOVERNED EXECUTION CONTEXT — NON-AUTHORITATIVE
  worker_prompt_must_state:
  - Work Front remains execution authority.
  - Task Envelope remains task instruction/context.
  - Governed execution context is verification context only.
  - Context cannot widen path, dispatch, git, release, promotion or acceptance authority.
binding_chain:
  prepare_cf09_task_execution:
  - consume RUNTIME_MANIFEST emitted by assistant-handoff-v2-task-execution
  - require safe repository-relative generated manifest path
  - load TASK_EXECUTION manifest
  - verify embedded handoff_manifest_sha256 equals dispatcher-observed hash
  - recompute Handoff manifest hash with canonical serializer semantics
  - verify launch_mode TASK_EXECUTION and authority flags false
  - extract only the frozen context projection
  - compute governed_worker_context_sha256
  - return projection + digest inside prepared_execution
  assistant_ack: No ACK schema widening. Existing ACK remains bound to the exact Handoff manifest hash; ready_execution
    preserves the prepared projection unchanged.
  explicit_dispatch:
  - recompute and validate governed_worker_context_sha256 from ready_execution
  - bind governed_worker_context_sha256 into decision.binding before decision_id hashing
  - do not copy full context into the dispatch decision
  project_native_launch:
  - recompute prepared projection digest
  - require exact match to explicit dispatch decision binding
  - require projection handoff_manifest_sha256 matches prepared_execution manifest hash
  - pass projection separately as governed_worker_context in invocation_context
  - do not mutate canonical task_context/task_context_id
  invocation_adapter:
  - accept bounded governed_worker_context input
  - validate context authority flags remain false
  - render the frozen projection under a clearly non-authoritative prompt section
  - preserve existing Worker Task, Work Front and runtime authority boundaries

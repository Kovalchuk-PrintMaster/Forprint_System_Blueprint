acceptance:
- Tests-first RED proves the current runtime has no exact stdout result-return protocol or fail-closed result gate.
- Focused parser tests accept exactly one valid framed Handoff v2 result.
- Focused parser tests reject missing, duplicate, malformed or prose-surrounded frames.
- Existing Handoff v2 validator is reused unchanged for schema, manifest and attempt binding.
- Result materialization is create-only under the bound attempt result directory.
- Invocation prompt carries the exact result-return protocol without granting filesystem or acceptance authority.
- Successful process plus valid result materializes worker_result.yaml and remains eligible for candidate validation.
- Successful process plus missing or invalid result becomes BLOCKED and cannot reach candidate validation.
- Non-zero or timed-out process becomes BLOCKED and cannot reach candidate validation.
- Blocked result return appends one terminal ledger record after the existing STARTED/PENDING record.
- Explicit a033 reconciliation terminalizes the missing-result attempt without synthesizing a result artifact.
- Reconciliation rejects already-terminal attempts and attempts that already have a valid result.
- Task70 candidate files remain unchanged by this hardening slice.
- No lifecycle, roadmap, promotion, commit, push, merge or release authority is added.
- A034 remains unprepared and unlaunched until this slice and a033 reconciliation are closed and published.
stop_conditions:
- Implementation requires a path outside the exact six-file implementation write set.
- Implementation requires changing the Handoff v2 result schema or validator semantics.
- Implementation requires changing the Execution Attempt Ledger contract.
- Implementation requires Worker writes outside the isolated workspace.
- Implementation requires synthesizing a successful result from provider prose or validation evidence.
- Implementation requires changing Task70 candidate files.
- Implementation requires lifecycle or roadmap mutation.
- Implementation requires automatic candidate promotion, commit, push, merge or release.

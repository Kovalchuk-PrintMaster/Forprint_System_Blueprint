result_return_contract:
  prompt_requirement:
  - Worker final response contains exactly one framed Handoff v2 YAML mapping.
  - No non-whitespace prose is allowed outside the frame.
  - The frame uses the exact existing Handoff v2 result fields.
  - Attempt id and Handoff manifest hash are bound values, not invented values.
  - Worker may report validation evidence but may not claim acceptance, promotion, commit, push, merge or release.
  materializer_requirement:
  - Read the provider stdout file only from the bound attempt runtime.
  - Require exactly one begin/end frame in correct order.
  - Parse the frame as one YAML mapping.
  - Validate through the existing Handoff v2 result validator.
  - Require exact attempt binding and origin manifest binding.
  - Reject symlinked result directory or result artifact.
  - Create result/worker_result.yaml exactly once and never overwrite.
  - Do not infer or synthesize missing fields from prose, Git state or structured-command evidence.
  post_process_gate:
  - Non-zero return code or timeout is not candidate-ready.
  - Return code zero is not candidate-ready without a valid result envelope.
  - Valid materialized result permits transition to candidate validation.
  - Missing or invalid result records BLOCKED result-return evidence.
  - A blocked result-return appends an immutable terminal attempt-ledger fact from the existing STARTED/PENDING record.
  - The terminal append grants no dispatch, acceptance, promotion, Git or release authority.

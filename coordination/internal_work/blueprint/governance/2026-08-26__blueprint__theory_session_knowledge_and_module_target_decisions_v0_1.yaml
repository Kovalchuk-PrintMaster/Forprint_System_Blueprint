decisions:
- id: TD-001
  topic: knowledge_sequence
  decision: Knowledge Foundation is the next major Blueprint foundation after v0.4.1 closes.
- id: TD-002
  topic: knowledge_lifecycle
  decision: Knowledge completeness is maintained; unknown is acceptable, invisible unknown is not.
- id: TD-003
  topic: inspector_boundary
  decision: Inspector detects/reports; local executor owns semantic maintenance; Blueprint governs.
- id: TD-004
  topic: inventory_method
  decision: Use deterministic map plus parallel semantic Map/Reduce/Reconcile review.
- id: TD-005
  topic: repository_restructure
  decision: Reorganize only after semantic reconciliation through reversible validated micro-migrations.
- id: TD-006
  topic: entrypoint_makefile
  decision: Repositories require zero-context navigation and a thin discoverable Makefile map.
- id: TD-007
  topic: executor_context
  decision: Executors see mission/target/horizon/dependencies but act only in the active work package.
- id: TD-008
  topic: advisory_feedback
  decision: Material executor observations remain advisory-only until Blueprint decides.
- id: TD-009
  topic: synthetic_roadmaps
  decision: Every known module gets an honest full synthetic roadmap with explicit uncertainty.
- id: TD-010
  topic: library_authority
  decision: Library owns canonical product/material/catalog semantics.
- id: TD-011
  topic: goods_receipt
  decision: Accounting target includes electronic/OCR intake, alias mapping and human verification.
- id: TD-012
  topic: physical_quantity_estimation
  decision: Operations Assistant target includes fast quantity estimation/calibration.
- id: TD-013
  topic: calculator
  decision: Calculator target includes reference analysis, visual constructors and backup/restore reuse audit.
- id: TD-014
  topic: telegram
  decision: Telegram target is a conversational operating interface/orchestrator.
- id: TD-015
  topic: production_eta
  decision: Equipment-load planning improves ETA but is not an early core blocker.
- id: TD-016
  topic: project_goal
  decision: Maximize useful automation and reduce avoidable manual work with safety/auditability.

acceptance:
- Focused tests are RED before implementation and GREEN after implementation.
- The proof uses the configured READY GitHub Copilot CLI provider through ARGV_NO_SHELL.
- The exact venv interpreter is preserved and can import mcp before provider launch.
- The provider-visible MCP id and permission selector remain separate identities.
- The provider proof exposes only the single validation MCP tool and grants only its exact permission selector.
- Exactly one structured execution result is produced for the proof.
- The structured result proves validation_suite@0.2.0, return_code=0, timed_out=false and shell=false.
- Hash-bound stdout evidence proves VALIDATION_SUITE_ID=cf10-worker-pipeline, LOCAL_FOCUSED tier and suite PASS.
- The canonical repository snapshot is unchanged before and after the proof.
- No persistent .mcp.json or .github/mcp.json is written.
- No Worker attempt, attempt ledger record, dispatch decision, promotion, commit, push, merge or release is created
  by the proof.
- Makefile exposes a short operator command for check and real proof execution.
- A033 remains uncreated and unlaunched.

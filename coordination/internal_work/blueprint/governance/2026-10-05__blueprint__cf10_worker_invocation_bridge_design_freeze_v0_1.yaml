  available_tool_universe_remains_explicit: true
mcp_tool_contract:
  server_name: ForPrintValidation
  tool_name: run_validation_suite
  worker_supplied_parameters:
    required:
    - suite_id
    optional:
    - require_tier
    additional_properties: false
  worker_forbidden_inputs:
  - capability_id
  - capability_version
  - executable
  - argv
  - shell_text
  - cwd
  - execution_scope
  - timeout_seconds
  - evidence_destination
  - consumer_id
  - request_id
  - execution_identity
  - authorization_envelope
  tool_result:
    must_include:
    - execution_id
    - outcome
    - return_code
    - timed_out
    - stdout_evidence
    - stderr_evidence
    - evidence_digest
    stdout_stderr_diagnostics: BOUNDED_EXCERPT_ONLY
    arbitrary_file_read: false
    authority_fields_true: false
attempt_session_binding:
  startup_binding_owned_by: INVOCATION_ADAPTER
  worker_cannot_override: true
  bound_fields:
  - attempt_id
  - task_id
  - work_front_id
  - explicit_dispatch_decision_id
  - workspace_repo
  - external_evidence_root
  workspace_repo: ATTEMPT_WORKSPACE_REPO
  external_evidence_root: ATTEMPT_ROOT/evidence/structured_command
  request_id_strategy: ATTEMPT_BOUND_SESSION_LOCAL_MONOTONIC_ORDINAL
structured_executor_mapping:
  backend: scripts/coordination/control_plane/worker_runtime/structured_command_executor.py
  capability_id: validation_suite
  capability_version: 0.1.0
  execution_scope_kind: GIT_REPOSITORY_ROOT
  exact_cwd_source: BOUND_ATTEMPT_WORKSPACE_REPO
  timeout_seconds: 900
  timeout_worker_overridable: false
  evidence_destination_source: BOUND_EXTERNAL_EVIDENCE_ROOT
  consumer_id: cf10_worker_validation_mcp
  execution_identity:
  - attempt_id
  - task_id
  - work_front_id
  - explicit_dispatch_decision_id
  authorization_envelope:
    schema_version: forprint_structured_execution_authorization_envelope_v0_1
    decision: ALLOW_EXACT_STRUCTURED_EXECUTION
    consumer_policy_validated: true
    executor_grants_authority: false
    canonical_write_allowed: false
    safe_write_allowed: false
    commit_allowed: false
    push_allowed: false
    merge_allowed: false
    release_allowed: false
    promotion_allowed: false
    arbitrary_shell_allowed: false
    all_execution_fields_exactly_bound: true

principles:
- Reuse existing Blueprint primitives before creating new frameworks.
- Blueprint control-plane evolution must not become a blanket blocker for the Logistics pilot.
- Authority, derived projection and evidence are separate roles.
- Fresh worker continuity must be repository-owned rather than chat-memory-owned.
- Semantic convergence is gradual and evidence-driven; no mass rename.
- Every future automation widening remains bounded by explicit human governance.

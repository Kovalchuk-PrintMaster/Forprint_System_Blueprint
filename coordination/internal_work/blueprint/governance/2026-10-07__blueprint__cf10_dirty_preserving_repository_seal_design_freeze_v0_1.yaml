diagnosis:
  seal_stage_exact_current_contract: Requires the complete observed dirty surface to equal SEAL_PATHS, so an exact
    candidate cannot be staged while unrelated inherited dirty paths remain.
  seal_push_current_contract: Requires git status --short to be empty after push, so a valid push fails whenever declared
    inherited/protected dirty paths intentionally remain.
  seal_staged_review_broken: false
  seal_commit_broken: false
architecture_decision:
  strategy: CANONICAL_PYTHON_SEAL_CAPABILITY_WITH_MAKE_OPERATOR_SURFACE
  new_module: scripts/coordination/control_plane/worker_runtime/repository_seal.py
  preserve_existing_target_names: true
  targets_extended:
  - seal-stage-exact
  - seal-push
  targets_unchanged_semantically:
  - seal-staged-review
  - seal-commit
  new_optional_variable: SEAL_PRESERVE_PATHS
  backward_compatibility: When SEAL_PRESERVE_PATHS is empty, seal-stage-exact and seal-push retain the existing clean-worktree
    contract.
  makefile_role: SHORT_OPERATOR_ENTRYPOINT_ONLY
  validation_logic_owner: repository_seal.py
implementation_slice:
  implementation_write_set:
  - Makefile
  - scripts/coordination/control_plane/worker_runtime/repository_seal.py
  - tests/coordination/control_plane/worker_runtime/test_cf10_dirty_preserving_repository_seal_v0_1.py
  implementation_path_count: 3
  tests_first_required: true
  must_not_modify:
  - scripts/coordination/control_plane/worker_runtime/invocation_adapter.py
  - scripts/coordination/control_plane/worker_runtime/provider_session_proof.py
  - scripts/coordination/control_plane/worker_runtime/worker_validation_mcp.py

  - AGENTS.md
  - coordination/global_policy/current_execution_focus.md
  - coordination/standards/automation/index.yaml
  - indexes/governance.yaml
  - indexes/roadmaps.yaml
stage_contract:
  candidate_input: SEAL_PATHS
  preserved_dirty_input: SEAL_PRESERVE_PATHS optional
  requirements:
  - SEAL_PATHS is non-empty.
  - Candidate paths and preserved paths are normalized repository-relative paths.
  - Candidate and preserved path sets are disjoint.
  - Observed dirty surface equals exactly candidate union preserved.
  - No pre-existing staged path exists outside candidate set.
  - Preserved paths remain unstaged.
  - Only candidate paths are passed to git add.
  - Exact staged path set after staging equals candidate set.
  - Preserved dirty path state remains present after staging.
  - No reset, restore, checkout, clean, stash, or mutation of preserved paths is allowed.
push_contract:
  branch_input: SEAL_BRANCH
  preserved_dirty_input: SEAL_PRESERVE_PATHS optional
  requirements:
  - Current branch exactly equals SEAL_BRANCH.
  - No staged changes exist before push.
  - Observed pre-push dirty path set equals exactly SEAL_PRESERVE_PATHS.
  - Push only the current named branch to origin.
  - Remote branch HEAD after push equals local HEAD.
  - Observed post-push dirty path set still equals exactly SEAL_PRESERVE_PATHS.
  - Preserved path unstaged diff hashes are unchanged across push.
  - No merge, rebase, reset, checkout, stash, clean, or mutation of preserved paths is allowed.
  - With empty SEAL_PRESERVE_PATHS, post-push worktree must remain clean as before.
acceptance:
- Tests-first RED proves current Make surface cannot preserve inherited dirty paths.
- Focused tests cover clean-worktree backward compatibility.
- Focused tests cover exact candidate plus protected dirty union.
- Focused tests reject candidate/preserve overlap.
- Focused tests reject unexpected extra dirty paths.
- Focused tests reject unexpected pre-staged protected paths.
- Focused tests prove staging mutates only the Git index entries for candidate paths.
- Focused tests prove protected path diff hashes are unchanged across stage.
- Focused push tests mock network Git boundary and prove exact pre/post protected dirty state.
- Focused push tests reject branch drift and remote HEAD mismatch.
- Makefile keeps short operator targets and delegates policy/mechanics to repository_seal.py.
- Existing seal-staged-review and seal-commit remain unchanged.
- No unrelated dirty path is reset, restored, cleaned, stashed, staged, committed, or otherwise mutated.
- A033 remains uncreated and unlaunched.
stop_conditions:
- Implementation requires a path outside the exact three-file write set.
- Implementation requires changing Git commit semantics.
- Implementation requires automatic commit or automatic push from stage-exact.
- Implementation requires reset, restore, checkout, stash, clean, or mutation of preserved paths.
- Implementation requires Task70 or lifecycle/roadmap mutation.
authority:

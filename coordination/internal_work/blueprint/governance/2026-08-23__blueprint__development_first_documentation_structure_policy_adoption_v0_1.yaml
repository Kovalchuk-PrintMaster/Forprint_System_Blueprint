record_id: blueprint_development_first_documentation_structure_policy_adoption_v0_1
decision:
  result: ADOPTED
  scope: project_wide_governance
  principles:
  - 'Development-first governance: legacy rules do not constrain new architecture merely because they
    already exist.'
  - Significant completed decisions and implementation closeouts must be recoverable from repository evidence,
    not chat.
  - Durable history records meaningful control points rather than every tiny intermediate attempt.
  - Existing coordination/document structure is reused before new directories are created.
  - Roadmaps and prompt sequencing remain the primary forward planning/control instruments.
  - Operator terminal input remains short; longer workflows are delivered as versioned Python files intended
    as root tmp.py.
authority_updates:
  coordination/global_policy/forprint_project_doctrine.md: Adds development-first governance and durable
    project memory/planning principles.
  coordination/standards/governance/documentation_and_recovery_gate.md: Defines significant-history closeout
    discipline and the operator-facing script delivery/recovery contract.
  coordination/standards/governance/folder_architecture_policy.md: Requires reuse of existing structure
    before new directories and limits compatibility to active needs.
  ? coordination/instruction_intake/bootstrap/2026-08-23__forprint_system_blueprint__v0_4_1_current_release_zero_context_execution_handoff_v0_1.md

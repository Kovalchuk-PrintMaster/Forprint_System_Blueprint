open_loop_reconciliation:
- loop: LOOP-BP1407-0001
  topic: Accounting Registry vs Operational Registry
  status: RESOLVED_DIRECTIONALLY_BY_LATER_PORTFOLIO
  resolution: Operational Registry owns operational party/order/request/event/task/blocker truth and stable operational
    IDs. Accounting Registry owns accounting references/documents/reconciliation and the 1C compatibility boundary;
    it must not become operational order/catalog truth.
- loop: LOOP-BP1407-0002
  topic: Library narrowed canonical-reference boundary
  status: RESOLVED_DIRECTIONALLY_BY_LATER_PORTFOLIO
  resolution: Current target state makes Library canonical semantic/catalog/reference and shared UI publication
    authority, excluding business workflows and other domain truth.
- loop: LOOP-BP1407-0003
  topic: Strategic Control Plane vs Blueprint
  status: RESOLVED_DIRECTIONALLY_BY_LATER_GOVERNANCE
  resolution: Founder/operator plus strategic-assistant layer sets strategic direction, portfolio priorities and
    policy/authority boundaries. Blueprint/Dispatcher resolves and executes only explicitly authorized bounded portfolio
    work and remains a coordination/control layer.
- loop: LOOP-BP1407-0004
  topic: Telegram + AI tool safety
  status: RESOLVED_AT_PLANNING_GOVERNANCE_LEVEL_IMPLEMENTATION_EVIDENCE_SEPARATE
  resolution: Later Blueprint Human Intent and Control Foundation introduce AI Execution Safety / Runtime Governance,
    bounded retries, tool/capability authorization, logging, manual escalation and high-impact approval boundaries.
- loop: LOOP-BP1407-0005
  topic: prompt lifecycle cleanup/archive
  status: MATERIALIZED_DIRECTION
  resolution: Later module prompt intake distinguishes received/active/archived lifecycle and current prompt indexes/status.
    Do not use the 14.07 draft directory semantics as current authority.
- loop: LOOP-BP1407-0006
  topic: dedicated Blueprint assistant
  status: RESOLVED_BY_LATER_CONTROL_FOUNDATION_DIRECTION
  resolution: Later CF-10 and CF-19/CF-20 explicitly introduce bounded Blueprint internal worker/AI progression
    instead of a single unrestricted assistant.
- loop: LOOP-BP1407-0007
  topic: Logistics-derived assistant productivity standard
  status: RESOLVED_DIRECTIONALLY
  resolution: Later Human Intent explicitly records Logistics as the reference pilot and requires proven behavior
    to be propagated to other modules as behavioral contracts rather than byte-for-byte code.

schema_version: forprint_evening_architecture_capability_candidates_v0_1
status: DISCUSSION_CANDIDATES_NOT_CANONICAL
date: 2026-09-19

capabilities:
  - id: telegram_communication_orchestration
    title: Telegram Communication Orchestration
    primary_area: telegram_bot
    key_points:
      - inbound communication normalization
      - outbound communication intents
      - conversation state
      - communication profile
      - context-aware phrasing
      - sentiment-aware response style
      - no independent pricing/logistics/financial authority

  - id: customer_specific_semantic_memory
    title: Customer-Specific Semantic Memory
    primary_area: customer_context
    candidate_owners:
      - crm
      - account_manager
      - operational_registry

  - id: adaptive_customer_preference_drift
    title: Adaptive Customer Preference and Drift Detection
    primary_area: customer_context
    key_points:
      - baseline vs exception
      - recency weighting
      - recent-window analysis
      - pattern shift detection
      - hysteresis
      - contextual segmentation
      - auditable evidence

  - id: dynamic_customer_profiling
    title: Dynamic Customer Profiling and Policy Adaptation
    primary_area: customer_management
    key_points:
      - simple manager seed presets
      - observed customer model
      - effective policy
      - profile maturity
      - profile coverage
      - profile fit/review
      - custom overlays
      - manager attention on meaningful transitions

  - id: continuous_customer_health
    title: Continuous Customer Health, Trajectory and Policy
    primary_area: crm_analytics
    key_points:
      - customer health vector
      - trajectory and momentum
      - event-driven updates
      - periodic reconciliation
      - portfolio constraints
      - movement/attention reports
      - historical transition audit

  - id: historical_asset_indexing
    title: Historical Customer Asset Indexing and Retrieval
    primary_area: prepress_asset_context
    candidate_owners:
      - prepress_hub
      - operational_registry
    key_points:
      - batch historical indexing
      - incremental indexing
      - customer/order linking
      - revision families
      - exact/visual/semantic fingerprints
      - representative pages
      - deep comparison only after candidate narrowing
      - original asset retrieval only for shortlisted candidates

  - id: customer_order_interpretation
    title: Customer Order Interpretation and Clarification
    primary_area: cross_module
    key_points:
      - structured order draft
      - high-confidence confirmation
      - editable clarification card
      - batch/grouping workspace
      - unresolved items
      - canonical Calculator/Library constraints
      - AI only after deterministic/context layers

  - id: durable_business_process_manager
    title: Durable Long-Running Business Process Manager
    primary_area: cross_module
    status: HOST_TO_BE_SELECTED
    key_points:
      - process definitions
      - process instances
      - durable state
      - timers
      - deadlines
      - expected events
      - retries
      - escalation
      - human tasks
      - communication intents
      - audit events
      - operator attention
    architecture_requirement:
      hosted_capability: true
      extraction_readiness: required
      standalone_module_now: false

do_not_create_from_this_source:
- a second Telegram domain-truth model
- a second CRM customer identity registry
- a standalone Process Manager module before evidence justifies extraction
- a historical asset index that becomes canonical asset/order/production truth
- a new Calculator truth inside clarification UI
- a new roadmap step when an existing full-horizon step already carries the same intent
remaining_material_questions:
- field-level owner for customer communication profile
- repository-grounded current customer/order/asset schema
- historical retrieval host and split between candidate retrieval vs domain evidence
- whether any existing workflow engine/process runtime should be reused for hosted Process Manager
- automatic-vs-human customer policy transition authority
- first bounded Process Manager pilot
- quantitative extraction thresholds for future standalone Process Manager

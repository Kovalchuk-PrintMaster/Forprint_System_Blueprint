relation_to_20260520:
  classification: REFINES_AND_SUPERSEDES_IMMEDIATE_DESIGN_SEQUENCE
  retained_from_may:
  - Prepress remains a separate bounded module.
  - Reusable technical tooling remains valuable.
  - Deterministic evidence, previews and explicit errors remain valuable.
  refined_or_replaced:
  - Do not start by implementing a broad all-in-one local hub architecture.
  - Start with practical capabilities and native/tool feasibility.
  - Use product-specific assistants instead of one abstract Raster Assistant.
  - Shared tools should provide facts, not become another domain decision assistant.

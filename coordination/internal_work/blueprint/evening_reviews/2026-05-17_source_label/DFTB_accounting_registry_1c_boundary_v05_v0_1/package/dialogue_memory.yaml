    виробничий облік, залишки, списання, резерви, норми, калькуляції, виробничі події. 1С = бухгалтерія, фінансові проводки, офіційні документи, податковий/складський
    облік, поки що без втручання у виробничу логіку. 1С технічно дозволяє інтеграцію з зовнішніми системами: через REST/OData можна читати й змінювати дані,'

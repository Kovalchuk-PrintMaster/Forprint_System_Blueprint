summary: This source fills the missing reasoning bridge between CF-01 closure / CF-02 planning and later CF-02 hardening.
  An exact current-state reconciliation invalidates a stale B1-P2 handoff, then CF-02 candidate v0.1 is built candidate-first
  without canonical mutation. Mechanical checks pass, but semantic/adversarial review returns seven findings and
  blocks activation/apply. Those findings explain later dependency-registry, derivation-registry, standards registration,
  work-ID authority, bootstrap-order, test-isolation and migration-evidence hardening.

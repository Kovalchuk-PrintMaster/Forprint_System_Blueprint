- item_id: IT-BP1406-0003
  kind: architecture_constraint
  title: Avoid fake dependency truth as normal strategy
  statement: Dependent modules should preferably work against coherent canonical data/reference sources rather than fabricated virtual documents
    pretending the dependency is ready.
  dialogue_status: agreed

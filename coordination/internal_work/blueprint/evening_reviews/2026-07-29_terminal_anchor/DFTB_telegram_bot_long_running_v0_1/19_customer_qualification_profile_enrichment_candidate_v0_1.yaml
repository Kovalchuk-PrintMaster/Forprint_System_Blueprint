schema_version: forprint_telegram_customer_qualification_profile_enrichment_candidate_v0_1
candidate_id: telegram_customer_qualification_profile_enrichment
status: RECONCILE_BEFORE_IMPLEMENTATION
canonical_roadmap_step: false
candidate_owner: telegram_bot
canonical_profile_owner: forprint_crm
supporting_or_adjacent_owners:
- forprint_crm
- forprint_integration_gateway
- forprint_identity_access_service
reuse_targets:
- telegram_bot_personalized_communication_orchestration_v0_1
- telegram_bot_communication_intent_contract_v0_1
- telegram_bot_customer_context_consumption_v0_1
- telegram_bot_structured_clarification_workspace_v0_1
purpose: Allow Telegram conversations to fill useful missing customer/profile context without creating a second
  canonical customer record inside Telegram.
candidate_contract:
  collectable_examples:
  - contact_or_channel_identifier_when_missing
  - activity_or_business_context_when_relevant
  - product_or_service_interest
  - preferred_delivery_method
  write_boundary:
  - telegram_produces_structured_profile_update_intent
  - crm_identity_owner_validates_and_applies
  - field_level_source_and_confirmation_provenance
  - conflict_or_ambiguity_returns_to_clarification
  - no_direct_competing_customer_table_in_telegram
  privacy_boundary:
  - collect_only_context_needed_for_service_or_qualification
  - respect_current_retention_and_personal_data_policy
  - do_not_promote inferred attributes to canonical facts without confirmation
promotion_gate: Reconcile with current CRM identity/profile roadmap and writable contracts. If CRM already provides
  an equivalent profile-enrichment command, EXTEND Telegram communication steps rather than create a duplicate capability.
non_goals:
- make phone a canonical customer primary key
- make Telegram owner of CRM profile truth
- write customer data directly to historical local/Supabase tables without current contract
- couple qualification to Logistics provider execution

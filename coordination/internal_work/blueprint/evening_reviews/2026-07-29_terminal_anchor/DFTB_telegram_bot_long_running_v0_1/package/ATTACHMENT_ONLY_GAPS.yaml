    Optional CONFIG_PATH = Path("bot_behavior_config.yaml") def load_config(): with open(CONFIG_PATH, "r", encoding="utf-8") as f: return yaml.safe_load(f)
    def generate_response( intent_id: Optional[int], style_id: Optional[int], sentiment: Optional[str], dialog_context: str, use_template: bool = True )

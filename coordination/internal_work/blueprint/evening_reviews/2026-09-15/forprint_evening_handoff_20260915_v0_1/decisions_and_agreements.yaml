schema_version: forprint_evening_decisions_v0_1
decisions:
- id: EVE-001
  title: Evening/travel/weekend mode is standard workflow
  status: AGREED
  rule: When away from computer, discussion produces agreements and a Z-package; repository
    implementation happens later through morning intake.
- id: EVE-002
  title: Z-package is not executable as a monolith
  status: AGREED
  rule: Morning intake must classify and reconcile each item before execution.
- id: EVE-003
  title: Bootstrap must surface mandatory rules
  status: AGREED
  rule: Critical startup instructions must be explicit MUST_READ_BEFORE_FIRST_ACTION,
    not buried.
- id: EVE-004
  title: Communication style
  status: AGREED
  rule: Assistant refers to herself in feminine forms; operator as male; friendly
    and informal.
- id: EVE-005
  title: Python-first operations
  status: AGREED
  rule: Use project Python/venv and unique action files; do not default to ad-hoc
    bash workflows.
- id: EVE-006
  title: Two bootstrap package modes
  status: AGREED
  rule: Global onboarding package and task-execution package are distinct modes and
    must be audited separately.
- id: EVE-007
  title: Roadmap items require human-context provenance
  status: AGREED
  rule: Human-confirmed roadmap/portfolio items preserve concise dialogue-derived
    rationale/context.
- id: EVE-008
  title: Synthetic roadmap gaps are explicit
  status: AGREED
  rule: Unknown future steps may be provisional but must be flagged and revisited.
- id: EVE-009
  title: Roadmap mutation triggers dependency reconciliation
  status: AGREED
  rule: Meaningful roadmap insertions/reordering trigger dependency/order/readiness/dispatcher/projection
    reconciliation.
- id: EVE-010
  title: Blueprint autonomous worker is zero-stage pilot
  status: AGREED
  rule: Before broad rollout, stabilize a bounded local autonomous worker inside Blueprint.
- id: EVE-011
  title: Logistics is first external/module pilot
  status: RECONCILIATION_REQUIRED
  rule: Reconcile older Logistics-first language as Blueprint internal worker first,
    Logistics first external/module pilot after stability.
- id: EVE-012
  title: Operator/coordinator shift to governance
  status: AGREED
  rule: After worker launch, focus on roadmaps, policies, module analysis, dependency
    matrix, waves, task-package governance and project effectiveness.
- id: EVE-013
  title: Manual deep module baseline before autonomous rollout
  status: AGREED
  rule: Each module gets manual deep analysis/cleanup and human-built knowledge/index
    foundation before autonomous workers are trusted.
- id: EVE-014
  title: Plan waves to final project goals
  status: AGREED
  rule: Build a project-wave skeleton to the finish line, allowing flagged under-specified
    future steps.
- id: EVE-015
  title: Priority module group
  status: REQUIRES_CANONICAL_RECONCILIATION
  rule: Logistics, Telegram and Calculator are operator-stated high-priority modules.
- id: EVE-016
  title: tmp is disposable
  status: AGREED
  rule: tmp/ may be deleted without destroying resume state or project operability.
- id: EVE-017
  title: Persistent execution/resume layer
  status: AGREED_TARGET_REQUIREMENT
  rule: Execution supports durable attempt state, checkpoints, failure location, inspection
    and resume.
- id: EVE-018
  title: Active clarification/reconciliation list
  status: AGREED_TARGET_REQUIREMENT
  rule: Maintain a small bootstrap-visible current list; resolved items move to indexed
    history.
- id: EVE-019
  title: Verification tiers
  status: AGREED_TARGET_REQUIREMENT
  rule: Separate local/related/module/full/nightly checks.
- id: EVE-020
  title: Local Dispatcher Telegram bot
  status: AGREED_TARGET_REQUIREMENT
  rule: Dispatcher gets a small dedicated local Telegram bot for status, alerts and
    bounded remote commands; not the full Telegram module.

schema_version: forprint_evening_roadmap_intake_v0_1
priority_order:
- priority: 0
  title: Finish first local autonomous worker path
  disposition: CURRENT_CRITICAL
  items:
  - Complete CF-06 Execution Profiles Registry.
  - Close CF-06 lifecycle after successful implementation.
  - Proceed through minimum required procedure/handoff/dispatcher foundations for
    first bounded Blueprint worker.
  - Do not manually implement unrelated convenience features that can become early
    worker tasks.
- priority: 1
  title: Define and launch Blueprint internal AI worker
  disposition: NEW_OR_RESTRUCTURED_ROADMAP_STAGE
  items:
  - Isolated worker runtime/workspace.
  - Machine task package.
  - Profile + authority + budget + context bindings.
  - Retry/failure/resume semantics.
  - Validation and promotion flow.
  - Execution history and operator visibility.
- priority: 2
  title: Bootstrap + evening package governance
  disposition: POLICY_OR_DOCUMENTATION_ONLY_PLUS_SMALL_IMPLEMENTATION
  items:
  - Mandatory startup manifest.
  - Evening/travel/weekend package protocol.
  - Morning package intake/classification.
  - Conflict/reconciliation handling.
  - Active unresolved-question list.
  - Human-readable roadmap reporting.
- priority: 3
  title: Parallel module deep-audit preparation
  disposition: FUTURE_WORKSTREAM
  items:
  - Manual deep analysis of each module before autonomous rollout.
  - Resolve stale/conflicting docs and duplicate/obsolete code.
  - Build module knowledge/index baselines.
  - Hand ongoing cleanup/maintenance to module workers.
- priority: 4
  title: Global roadmap/dependency matrix/waves
  disposition: FUTURE_MAJOR_WORKSTREAM
  items:
  - Complete module roadmaps with human-confirmed and provisional items.
  - Build cross-module dependency matrix.
  - Define priority modules and support dependencies.
  - Create project waves to final goals.
  - Dynamically recompute consequences after roadmap changes.
- priority: 5
  title: Early Blueprint worker training workload
  disposition: EXECUTE_BY_NEW_WORKER_WHEN_AVAILABLE
  items:
  - Persistent execution runtime/resume command surface.
  - Verification tier orchestration.
  - Operator CLI/status tables.
  - Dispatcher watchdog/health.
  - Local Dispatcher Telegram bot.
  - Human-readable dashboards/project activity summaries.

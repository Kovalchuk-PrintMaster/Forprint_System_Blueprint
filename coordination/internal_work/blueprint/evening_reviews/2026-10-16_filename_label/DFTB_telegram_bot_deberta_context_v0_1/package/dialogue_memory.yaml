  quote: '🧠 DeBERTa (Decoding-enhanced BERT with disentangled attention) — це модель від Microsoft , вдосконалена версія BERT, оптимізована для розуміння
    природної мови (NLP). Ось коротко по суті 👇 ⚙️ Основна ідея DeBERTa відрізняється тим, що: Розділяє (disentangles) представлення позиції та значення
    слова. → Це допомагає точніше розуміти контекст фраз і синтаксис. Використовує “enhanced mask decoder” → Краще враховує порядок слів під час передбачення
    токенів. Навчена на величезних корпусах текстів (зокрема English Wikipedia + BookCorpus) , тому добре розуміє граматику, семантику і логіку тексту.
    🧩 Варіанти De'

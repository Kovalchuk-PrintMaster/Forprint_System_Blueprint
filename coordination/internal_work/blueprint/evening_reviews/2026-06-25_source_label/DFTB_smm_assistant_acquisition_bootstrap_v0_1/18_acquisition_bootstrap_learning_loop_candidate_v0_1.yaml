reuse_first_checks_before_promotion:
- current Website analytics and conversion instrumentation
- current Marketing Orchestrator analytics/performance implementation state
- current CRM lead/referral handoff contract
- current Google Ads/SEO/social operational evidence if available
- July SMM creative-tooling candidate
- first production-complete channel/content slice decision
non_goals:
- set a permanent Google Ads budget from historical advice
- freeze Google Business/SEO/Instagram/TikTok into a permanent ranking
- hard-code a one-kilometer targeting radius
- hard-code exactly ten promoted services
- reactivate or redesign Website technical work
- make Marketing owner of canonical leads/customers/orders/products/prices
- mutate Marketing runtime from this planning intake
promotion_gate: Reconcile live Website instrumentation, current acquisition evidence and operator channel choice.
  If approved, extend the existing Marketing roadmap with a bounded acquisition/bootstrap experiment step or substep
  linked to analytics/performance history rather than creating duplicate analytics or publishing capabilities.

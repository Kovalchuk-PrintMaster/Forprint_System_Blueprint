  - intent_id
  - style_id
  - sentiment_id
  - template_text
  - priority
  - language
  historical_languages:
  - uk
  - ru
  - en
  historical_priority_range: 0..10
  template_quality:
  - short_1_to_2_sentences
  - natural_human_rendering
  - style_and_sentiment_consistency
  - emoji_only_when_appropriate
  - avoid_verbatim_repetition
  taxonomy_rule: Generated rows may reference only current canonical active lookup IDs/labels. Generator output
    cannot silently expand taxonomy.
  import_rule: Resolve current live schema from authoritative DB/repo source, compare against known-good import
    shape, validate encoding/header/row shape and run a small smoke import before bulk import.
reuse_first_checks_before_promotion:
- current telegram_bot DB/schema migrations and Supabase contract
- current intent/style/sentiment lookup ownership
- current template-selection/rendering implementation
- remaining Telegram historical sources
- current personalized communication orchestration roadmap implementation state
non_goals:
- restore historical Mistral-7B-Instruct as mandatory model
- freeze historical 10-intent/4-style/3-sentiment values without live schema audit
- accept assistant-invented taxonomy labels
- treat absent historical CSV bodies as verified datasets
- create a duplicate personalized-communication roadmap capability
- mutate Telegram runtime from this planning intake
promotion_gate: After remaining Telegram sources and live implementation audit, EXTEND an existing communication
  roadmap step, add a substep, or close as already implemented; do not create a duplicate top-level capability.

semantic_roadmap_diff:
  classes:
  - ADDED
  - ENRICHED
  - DUPLICATE_NO_CHANGE
  - DEPENDENCY_CHANGED
  - NARROWED
  - REMOVED
  - BREAKING
  - OWNER_CHANGED
  operator_gate_required_for:
  - NARROWED
  - REMOVED
  - BREAKING
  - major OWNER_CHANGED
  current_interpretation: This concept is now covered by the strengthened Reuse-First / Pre-Implementation Reconciliation
    Gate and should be reused/extended rather than implemented as an isolated duplicate diff framework.
source_memory_model:
  canonical_project_state: accepted project truth
  decision_rationale_ledger: why/alternatives/affected modules/source references
  raw_conversation_evidence: immutable historical evidence, not authority
  conversation_identity_rule: one evidence identity may link to many modules/roadmaps/decisions; do not duplicate
    raw dialogue per module
proposal_and_dependency_debt_model:
  worker_proposal_classes:
  - LOCAL_IMPROVEMENT
  - CROSS_MODULE_IMPROVEMENT
  - PORTFOLIO_IMPROVEMENT
  - CONTRACT_GAP
  - RISK_DISCOVERED
  - NO_PROPOSAL
  proposal_rule: worker proposal does not mutate roadmap directly
  dependency_debt_fields:
  - consumer
  - provider
  - required_capability
  - temporary_strategy
  - target_provider_step
  - replacement_trigger
  - severity
  - provenance
  replacement_rule: validated provider capability may make replacement work eligible, subject to normal authority
publication_origin_direction:
  levels:
  - G0_status_report_only
  - G1_bounded_commit_candidate
  - G2_auto_commit_allowed_exact_paths_after_gates
  - G3_auto_push_dedicated_branch
  - G4_PR_or_merge_queue
  - G5_auto_merge_after_policy_gates
  dirty_tree_rule: never use broad git add -A; candidate commit must know exact allowed path set
  authority_rule: publication is separate from development completion and requires its own policy gates
operator_surface_origin_direction:
  commands:
  - make status
  - make status-full
  - make dashboard
  dashboard_views:
  - Project Health
  - Control Plane
  - Module Portfolio
  - Dependency Debt
  - Active Execution
  - Wave Control
  reason_code_rule: color alone is insufficient; warning/health signal must expose a reason code

summary: This evidence cluster is a primary provenance source for the current Blueprint Control Foundation. Most
  architecture directions from the 2026-09-12 discussion are already materialized as CF-02..CF-20 or later global-policy/roadmap-enrichment
  surfaces. The correct disposition is provenance recovery and REUSE/EXTEND mapping, not duplicate roadmap creation.
core_architecture_model:
  knowledge_plane: inventory, capability map, dependency graph, provenance and verified implementation reality
  planning_plane: machine-readable full-horizon target/roadmap model
  execution_control_plane: work fronts, dispatcher, lifecycle, waves, dependencies and blockers
  operator_plane: generated portfolio, health/status/dashboard, warnings and drill-down
  dispatcher_rule: Dispatcher operates over structured knowledge/planning state and must not become the source of
    truth for knowledge, roadmap, strategy or business/domain facts.

objective: >-
  Extend the existing generic validation-suite runner with explicit verification-tier
  semantics and a fail-closed exact tier requirement without weakening or changing
  the registered validation commands.
instructions:
- Modify only scripts/validation/run_validation_suite_v0_1.py, coordination/standards/automation/validation_suite_registry_v0_1.yaml and tests/validation/test_validation_suite_runner_v0_1.py.
- Reuse the existing generic validation-suite runner and registry; do not create a second runner or registry.
- Reuse the Makefile scope vocabulary conceptually but do not modify Makefile.
- Add a required verification_tier field for each registered suite using only LOCAL_FOCUSED, RELATED, CORE or FULL.
- Mark the existing cf10-worker-pipeline suite as LOCAL_FOCUSED.
- Validate verification_tier during normal registry validation.
- Report the resolved tier deterministically when a suite executes.
- Add an optional --require-tier exact gate; a mismatch must fail before isolated suite execution.
- Keep build_suite_commands() semantics and the existing cf10-worker-pipeline command sequence unchanged.
- Preserve read_only_synthetic_validation safety and argv-only execution.
- Add focused deterministic tests for valid tier, missing/invalid tier, matching required tier and mismatch refusal.
- Do not weaken, skip, remove or reorder any existing validator or pytest step.
- Do not modify control-plane, dispatcher, runtime, lifecycle, roadmap, ledger or Makefile surfaces.
- If these requirements cannot be satisfied inside the three-file scope, stop and escalate instead of widening scope.
acceptance:
- Only the three declared mutation targets are changed.
- cf10-worker-pipeline keeps the same validator scripts and pytest paths in the same order.
- Registry validation fails closed on missing or unsupported verification_tier.
- Existing suite resolves to LOCAL_FOCUSED.
- Matching --require-tier succeeds through the existing execution path.
- Mismatched --require-tier is refused before isolated execution.
- Existing focused runner tests continue to pass.
- New tier-focused regression tests pass.
- Existing cf10-worker-pipeline suite still passes with identical proof steps.
- git diff --check passes in the isolated worker workspace.
- No prohibited execution or repository action is performed.

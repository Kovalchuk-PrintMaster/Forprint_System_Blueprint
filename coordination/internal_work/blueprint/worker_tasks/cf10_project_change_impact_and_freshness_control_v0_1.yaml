objective: 'Task 85, CF-10/u180j: extend the existing Blueprint/CF-14 change impact and freshness mechanisms for
  critical project standards, templates and module bootstrap consumption. Start with bounded REUSE/EXTEND audit;
  implement only independently evidenced missing behavior within the exact nine-path Worker write set, otherwise
  return a justified no-production-change/blocker result.'
instructions:
- 'Before any execution: resolve this exact Task Envelope through existing cf10_training_dispatch, validate current
  Work Front, Task80 ACCEPT and immutable ledger bindings, fresh source/dirty fingerprint, roadmap IN_SYNC, current-state
  impact, and single writable actor.'
- Read the training queue Task85 and complete planning reference. Reconcile every acceptance requirement with existing
  execution dependency graph, repo-knowledge freshness, canonical-state resolver, generator/derivation, AGENTS front-door,
  bootstrap contexts, Makefile standards and validators. Make a REUSE/EXTEND/ADAPT/REPLACE/NEW evidence matrix.
- 'No broad change: first use isolated fixtures and existing functions. If no evidenced gap, return already verified
  with deterministic proof; do not make cosmetic edits. If a missing behavior is established, prefer small extension
  of an in-scope existing implementation; NEW resolver script only with explicit gap proof and MUST consume existing
  authority.'
- Derive bounded reverse impact for a changed critical source/capability and precise typed relationships, separating
  mechanically checkable impacts from semantic/manual review. File mtime, touching content or model assertion is
  never semantic review evidence.
- Use isolated fixture for supported Makefile capability/operator map -> reusable standard/template -> bootstrap
  dependency, and prove unrelated change is not invalidating all dependents. If actual standard/template edit is
  required outside scope, STOP for exact-scope amendment.
- Prove one existing/new project-native bootstrap/context preflight rejects a known-stale critical input with machine-readable
  reason. Never mutate a real external module repository during tests.
- Write only subset of the exact nine Work Front paths in isolated Worker candidate workspace. Any other needed
  path is STOP/RETURN_FOR_SCOPE_REVIEW. Do not edit AGENTS.md, indexes or canonical execution events as Worker.
- Run native registered tests and make check targets that do not mutate live canonical state; record exact test
  outputs and evidence SHA. If broader Make target has nonread-only side effects, run the narrow contract check
  only.
- Produce fully validated original-origin-bound Handoff/Worker Result with scope and changed paths, source hashes,
  acceptance matrix, test evidence, review-required debt and next boundary; worker does not ACCEPT, commit, push,
  merge, publish or self-dispatch.
acceptance:
- Dependency and current-state checks and a fresh source freeze pass before execution; protected pre-existing dirty
  paths and one-writer invariant preserved.
- Every Task85 criterion in registered training queue and planning file is reconciled with source/test evidence
  before implementation; CF-14 parent direction reused.
- Registered changed critical source/facet produces precise explainable bounded reverse-affected set without a second
  dependency authority.
- At least one deterministic automatic verification, one semantic REVIEW_REQUIRED outcome, and explicit evidence
  of review resolution if review completed.
- Known-stale critical bootstrap/template/standard input is rejected by a project-native consumer gate; no unrelated
  broad hard-block.
- Makefile change impact example and unrelated control fixture both pass; functional map checked where a new operator
  entrypoint is genuinely needed.
- Candidate write set is a subset of the nine explicit scope paths; NEW resolver not allowed without documented
  reuse-gap proof.
- Focused tests and relevant regression pass, diff --check pass, exact hashes and tests included in Handoff.
- No canonical Worker write, automatic acceptance, promotion, dispatch, next Work Front activation, Git push or
  release.
stop_conditions:
- Task80 ACCEPT evidence/ledger or S3 overlay is missing, contradictory or unbound; Task85 prerequisite not ready.
- Latest roadmaps/projections are stale or source HEAD/dirty fingerprint changes after freeze without explicit new
  preparation.
- An in-flight different canonical writer overlaps exact scope, including Makefile or other protected paths.
- An essential impact relationship, consumer gate or deterministic test requires writing outside scope; STOP for
  controlled amendment.
- The proposed mechanism duplicates the existing dependency registry/graph or claims semantic freshness without
  evidence.
- New changes need live module bootstrap/export execution, mutation of another repository, or forbidden authority
  expansion.
- Validated Handoff/Worker Result is absent or result transport/evidence cannot bind to exact attempt.

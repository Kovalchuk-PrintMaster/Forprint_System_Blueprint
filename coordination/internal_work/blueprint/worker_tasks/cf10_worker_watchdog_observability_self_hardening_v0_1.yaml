objective: Extend the existing worker process launcher with deterministic heartbeat/watchdog observability for running
  progress, stall evidence and timeout distinction without autonomous remediation.
instructions:
- Modify only scripts/coordination/control_plane/worker_runtime/launcher.py and tests/coordination/control_plane/worker_runtime/test_cf10_worker_process_launcher_v0_1.py.
- Reuse launch_process(), its existing on_started/on_heartbeat callbacks and current timeout loop; do not create
  a second launcher.
- Keep existing callers compatible. Any stall threshold/configuration must be optional and disabled unless explicitly
  requested.
- Heartbeat evidence must expose deterministic process/runtime progress facts. Observable output growth may be used
  as bounded progress evidence, but it must not be represented as semantic proof that the model is or is not thinking.
- When an explicit stall threshold is configured, derive a clear stall-evidence state from absence of observable
  progress for the configured interval.
- 'Stall evidence is observational only: do not terminate, retry, restart, redispatch, mutate authority or create
  a new attempt.'
- Keep timeout as a distinct final outcome and preserve the existing bounded terminate/kill fallback.
- Return enough deterministic final watchdog evidence to distinguish normal completion, completion with observed
  stall evidence and timeout.
- Add focused tests covering heartbeat progress evidence, stall evidence without remediation, timeout distinction
  and backward compatibility.
- Do not modify control-plane authority, dispatcher, lifecycle, roadmap, ledger, Handoff, provider registry or Makefile
  surfaces.
acceptance:
- Only the two declared mutation targets are changed.
- Existing launch_process callers that do not request stall detection retain existing behavior.
- Heartbeat callback evidence deterministically exposes runtime/progress observations.
- Configured stall evidence is distinguishable from active observed progress and from timeout.
- Stall evidence never causes autonomous remediation.
- Timeout still terminates through the existing bounded path and remains explicit in the final result.
- Existing focused launcher tests continue to pass.
- New watchdog observability regression tests pass.
- git diff --check passes in the isolated worker workspace.
- No prohibited execution or repository action is performed.
stop_conditions:
- A third mutation path is required.
- Existing timeout semantics must be weakened.
- Autonomous recovery/retry/redispatch becomes necessary.
- Dispatcher, lifecycle, roadmap, ledger, Handoff, provider registry or Makefile mutation is required.
- Authority widening is requested or inferred.
- Any cross-module write, commit, push, merge, release or automatic ACCEPT is required.
- Governed context is stale or internally inconsistent.

objective: Add one bounded local Telegram-ready operator projection over existing Dispatcher, Execution Attempt
  Ledger and worker watchdog facts without adding network transport or execution authority.
instructions:
- Modify only scripts/coordination/control_plane/telegram_operator.py and tests/coordination/control_plane/test_cf10_local_dispatcher_telegram_operator_surface_v0_1.py.
- Create one read-only local operator projection surface; do not modify the Execution Attempt Ledger, dispatcher,
  launcher, monitor authority, lifecycle, roadmap, Handoff, provider registry or Makefile.
- Reuse existing immutable Execution Attempt Ledger latest-attempt facts as the durable attempt/status source of
  truth; do not create another status store or duplicate attempt history.
- Accept existing watchdog/process evidence as optional input for live runtime classification. Reuse launcher evidence
  fields such as process_alive, stall_detected, timed_out/outcome and final completion evidence instead of inventing
  new runtime truth.
- Expose deterministic operator-visible process/progress states sufficient to distinguish ACTIVE, STALLED, TIMEOUT
  and FINISHED when the required source facts exist. If required live evidence is absent or stale, report UNKNOWN
  rather than infer process liveness or semantic model activity.
- Produce a deterministic structured projection plus concise Telegram-ready text rendering. This task does not send
  Telegram messages and must not call the Telegram Bot API.
- Do not add bot tokens, chat IDs, secrets, network clients, web requests, daemon/systemd behavior or background
  polling.
- The surface is operator convenience only. It must not expose commands/buttons/functions that dispatch, retry,
  restart, kill, approve, promote, commit, push, merge, release or automatically ACCEPT anything.
- Add focused deterministic tests proving projection/rendering, ACTIVE/STALLED/TIMEOUT/FINISHED distinction, UNKNOWN
  on missing live facts, and absence of execution/dispatch authority.
acceptance:
- Only the two declared mutation targets are changed.
- Existing immutable ledger facts are reused rather than copied into a new mutable operator-status store.
- Existing watchdog/process facts are consumed as evidence and are not re-authored by the Telegram/operator projection.
- ACTIVE, STALLED, TIMEOUT and FINISHED are deterministic when supporting source evidence exists.
- Missing/stale live evidence remains explicitly UNKNOWN and is never guessed from STARTED/PENDING alone.
- Telegram-ready output is local/render-only; no network send occurs.
- No hidden dispatch, retry, approval, promotion, publication or automatic acceptance authority is introduced.
- Focused tests pass and git diff --check passes.
- No prohibited execution or repository action is performed.
stop_conditions:
- A third worker mutation path is required.
- Implementation requires mutation of Execution Attempt Ledger, launcher, dispatcher, lifecycle, roadmap, Handoff,
  provider registry, central monitor contract or Makefile.
- A new mutable status store, runtime truth source, daemon, systemd service or Telegram network transport becomes
  necessary.
- Reliable status would require guessing process liveness or semantic model activity from insufficient facts.
- Any dispatch/retry/restart/kill/approval authority is required.
- Authority widening is requested or inferred.
- Any cross-module write, worker commit/push/merge/release or automatic ACCEPT is required.
- Governed context is stale or internally inconsistent.

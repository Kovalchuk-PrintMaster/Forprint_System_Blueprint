    exact zero Worker delta because the Worker could not express the required profiling
    execution through its bounded validation tool and did not consume the already-delivered
    hash-bound governed context as its attempt-scoped freshness proof. The repair is closed
    and published at b777af40e088dd03abcabc6d160a474075736412; implementation commit
    8eecce4bb318538c3a41bcce0bd0f41a8d685ccf provides validation_suite@0.2.0,
    Worker-visible elapsed_seconds and typed profile:boolean transport without widening
    shell, argv, environment or authority.

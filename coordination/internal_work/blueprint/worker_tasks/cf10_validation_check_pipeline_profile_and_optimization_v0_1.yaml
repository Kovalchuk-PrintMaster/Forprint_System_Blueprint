  - >-
    Retry context: previous attempt cf10-u180j-a030 was rejected by candidate validation
    because the mandatory normal operator command make validation-suite
    SUITE=cf10-worker-pipeline failed when FORPRINT_VALIDATION_SUITE_ID was unset.

    ForPrintValidation(run_validation_suite) tool for suite_id=cf10-worker-pipeline with
    require_tier=LOCAL_FOCUSED and profile omitted or false. Preserve the returned
    execution_id, evidence_digest, return_code and elapsed_seconds as the fresh
    pre-mutation whole-suite baseline evidence. This normal call must succeed before edits.
  - >-
    The repair proof elapsed_seconds=5.753 and evidence digest
    04a01f57a1e130adaab93b5caf9585cb9210893afcbc8a3b42b3246bfcf34c71 prove only that
    the repaired execution transport works. They are not Task70 baseline evidence and must
    not replace the fresh pre-mutation measurement from the new attempt.
  - >-
    Consume the hash-bound governed execution context delivered for the attempt as the
    attempt-scoped freshness verification snapshot. When roadmap_sync=IN_SYNC, the bound
    work item u180j is ACTIVE and the projection is internally consistent, do not require
    shell regeneration of lifecycle/roadmap projections and do not mutate lifecycle or
    roadmap state to prove freshness.
  - >-
    After implementing profiling in the permitted Task70 files, invoke the same bounded
    ForPrintValidation(run_validation_suite) tool with profile=true. The repaired
    validation_suite@0.2.0 transport maps that typed request only to the canonical runner
    --profile flag; the Task70 candidate runner remains responsible for implementing and
    reporting the profiling semantics.
  - >-
    Preserve optional environment-variable semantics under strict shell mode. If set -u or
    equivalent nounset behavior is used, FORPRINT_VALIDATION_SUITE_ID and
    FORPRINT_VALIDATION_SUITE_PROFILE must be safe when absent; do not directly expand an
    optional variable without an explicit default.
  - >-
    Add focused regression coverage in tests/validation/test_validation_suite_runner_v0_1.py
    that exercises the real Makefile validation-suite operator surface with
    FORPRINT_VALIDATION_SUITE_ID and FORPRINT_VALIDATION_SUITE_PROFILE absent. Cover the
    normal PROFILE=0 path and the PROFILE=1 opt-in path without weakening isolation or
    validation semantics.
  - Before mutation, inspect current runner, registry, generic validation-suite Make target and focused tests; confirm the task still matches current project reality.
  - Reuse the existing generic validation-suite runner, isolation primitive and Makefile target. Do not create another profiler, registry or Task70-specific target.
  - Treat coordination/standards/automation/validation_suite_registry_v0_1.yaml and scripts/validation/run_non_mutating_make_check.py as read-only.
  - Capture baseline evidence before any optimization. At minimum preserve the current registered command/subprocess shape and reproducible whole-suite timing evidence.
  - Add opt-in profiling to the existing runner; normal non-profile execution must preserve current semantics.
  - Use a monotonic clock for elapsed measurements.
  - When profiling is enabled, report per-step and total elapsed time in human-readable form and emit one deterministic machine-readable profile summary with suite id, verification tier, step id/kind, elapsed seconds, return code, total elapsed time and critical step.
  - Preserve fail-fast behavior. If a step fails, profiling may emit bounded partial evidence but must return the same non-zero failure outcome.
  - Extend the existing generic Makefile surface so the supported operator command is make validation-suite SUITE=cf10-worker-pipeline PROFILE=1.
  - Keep the existing registry step list, validator paths, pytest paths, order, LOCAL_FOCUSED tier and isolation boundary unchanged.
  - Focused tests must use controlled/fake timing and semantic assertions; do not assert that real elapsed time is below a threshold.
  - After profiling, identify the actual critical path from measured evidence.
  - Apply at most one optimization only if measurement shows a safe candidate that fits entirely inside the three-file mutation scope and preserves same-or-stronger proof semantics.
  - If no safe optimization exists inside scope, return NO_SAFE_OPTIMIZATION with the profiling evidence. That is a valid Task70 outcome.
  - After any optimization, rerun the same profiling command and preserve before/after evidence; speed alone never proves acceptance.
  - Do not weaken, skip, remove, reorder or hide any validation failure.
  - Do not modify lifecycle, roadmap, Dispatcher, Worker runtime, Handoff, execution ledger, Operator Console or another repository.
  - Do not commit, push, merge, release, dispatch, retry or automatically ACCEPT.

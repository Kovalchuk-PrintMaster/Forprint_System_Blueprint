module_git_sources:
  version: '0.1'
  purpose: 'Registry of ForPrint module repositories and local paths used by ForPrint System Blueprint / future
    Control Plane to collect module coordination status through Git.

    '
  default_branch: main
  default_coordination_root: coordination
  default_status_file: coordination/status/current_status.yaml
  default_prompt_index: coordination/prompts/index.yaml
  default_report_index: coordination/reports/index.yaml
  modules:
  - module_id: forprint_system_blueprint
    module_name: ForPrint System Blueprint
    priority: p0
    development_status: active_development
    local_path: /srv/software_development/forprint-project/forprint_system_blueprint
    repo_url: git@github.com:Kovalchuk-PrintMaster/Forprint_System_Blueprint.git
    branch: main
    coordination_root: coordination
    status_file: coordination/status/current_status.yaml
    prompt_index: coordination/prompts/index.yaml
    report_index: coordination/reports/index.yaml
    repo_status: confirmed
    notes: 'Central architecture and coordination repository. Current work authority is resolved through release/roadmap governance; early execution-queue artifacts are historical.

      '
  - module_id: calculator_engine
    module_name: Calculator Engine
    priority: p0
    development_status: active_development
    local_path: /srv/software_development/forprint-project/calculator_engine/app
    repo_url: git@github.com:Kovalchuk-PrintMaster/Calculator_Engine.git
    branch: main
    coordination_root: coordination
    status_file: coordination/status/current_status.yaml
    prompt_index: coordination/prompts/index.yaml
    report_index: coordination/reports/index.yaml
    repo_status: confirmed
    notes: 'Primary order/calculation formalization point. Local path currently points to the active app directory
      used for development.

      '
  - module_id: forprint_accounting_registry_service
    module_name: ForPrint Accounting Registry Service
    priority: selective
    development_status: sandbox_1c_import_export_ready
    local_path: /srv/software_development/forprint-project/forprint_accounting_registry_service
    repo_url: git@github.com:Kovalchuk-PrintMaster/Forprint_Accounting_Registry_Service.git
    branch: main
    coordination_root: coordination
    status_file: coordination/status/current_status.yaml
    prompt_index: coordination/prompts/index.yaml
    report_index: coordination/reports/index.yaml
    repo_status: confirmed
    waiting_for: real_sanitized_one_c_export_samples
    notes: 'v0.5 accepted. Maintains sandbox 1C import/export/parser/mapping readiness. Further v0.6 work is conditional
      on real sanitized 1C samples.

      '
  - module_id: forprint_operations_control_registry
    module_name: ForPrint Operations Control Registry
    priority: p1
    development_status: reference_ready_storage_ready
    local_path: /srv/software_development/forprint-project/forprint_operations_control_registry
    repo_url: git@github.com:Kovalchuk-PrintMaster/Forprint_Operational_Registry.git
    branch: main
    coordination_root: coordination
    status_file: coordination/status/current_status.yaml
    prompt_index: coordination/prompts/index.yaml
    report_index: coordination/reports/index.yaml
    repo_status: confirmed
    notes: Canonical module_id and local project directory are migrated to forprint_operations_control_registry.
      The GitHub transport endpoint still uses the existing repository slug Forprint_Operational_Registry; this
      transport name does not define module identity. Historical released prompt IDs/paths remain unchanged.
  - module_id: forprint_library
    module_name: ForPrint Library
    priority: p1
    development_status: active_development
    local_path: /srv/software_development/forprint-project/forprint_library
    repo_url: git@github.com:Kovalchuk-PrintMaster/Forprint_Library.git
    branch: main
    coordination_root: coordination
    status_file: coordination/status/current_status.yaml
    prompt_index: coordination/prompts/index.yaml
    report_index: coordination/reports/index.yaml
    repo_status: confirmed
    notes: 'Canonical semantic/catalog authority. Owns product/service/material/ operation IDs, aliases, definitions,
      contracts and catalog semantics.

      '
  - module_id: logistics_service
    module_name: ForPrint Logistics Service
    priority: p1
    development_status: active_development
    local_path: /srv/software_development/forprint-project/forprint_logistics_service
    repo_url: git@github.com:Kovalchuk-PrintMaster/Forprint_Logistics_Service.git
    branch: feature/logistics-tracking-events-contract-v01
    coordination_root: coordination
    status_file: coordination/status/current_status.yaml
    prompt_index: coordination/prompts/index.yaml
    report_index: coordination/reports/index.yaml
    repo_status: confirmed
    notes: Provider-neutral delivery and tracking truth owner. Canonical local repository path and origin were verified
      read-only by Blueprint at registration. The branch field records the observed working branch for the current
      tracking-events slice; module implementation and Git lifecycle remain owned by Logistics Service.
  - module_id: forprint_integration_gateway
    module_name: ForPrint Integration Gateway

schema_version: module_completion_packet_v0_4
protocol_version: module_completion_packet_protocol_v0_4
completion_id: <completion_id>
module_id: <module_id>
prompt_id: <prompt_id>
phase: <phase>
created_at: <ISO-8601 timestamp>
status: completed_in_module_pending_blueprint_review
immutable: true
report_id: <report_id>
report_path: <module-relative completion report path>
report_sha256: <64-character lowercase sha256>
implementation_base_commit: <40-character lowercase git commit>
implementation_commit: <40-character lowercase git commit>
branch: <branch>
completion_provenance:
  schema_version: module_completion_provenance_v0_1
  release_baseline:
    source: <exact release_baseline mapping from execution preflight>
  execution_baseline:
    source: <exact execution_baseline mapping from execution preflight>
  execution_identity:
    execution_epoch_id: <64-character lowercase sha256>
    preflight_fingerprint_sha256: <64-character lowercase sha256>
  preflight_evidence:
    path: coordination/execution_preflight/records/<prompt_id>__<execution_epoch_id>.yaml
    sha256: <64-character lowercase sha256>
  revalidation:
    revalidation_performed: false
    previous_preflight_fingerprint_sha256: null
    current_preflight_fingerprint_sha256: <64-character lowercase sha256>
  completion_baseline:
    implementation_base_commit: <40-character lowercase git commit>
    final_implementation_commit: <40-character lowercase git commit>
    branch: <branch>
  boundaries:
    blueprint_acceptance_claimed: false
    operator_decision_created: false
prompt_contract:
  schema_version: module_prompt_contract_v0_4
  contract_id: <contract_id>
  path: <module-relative immutable prompt contract path>
  file_sha256: <64-character lowercase sha256>
  payload_sha256: <64-character lowercase sha256>
  source_prompt_sha256: <64-character lowercase sha256>
requirement_results:
- obligation_id: <IMP/VER/CE obligation id>
  category: implementation
  result: satisfied
  evidence_ids:
  - <evidence_id>
  notes: <optional concise note>
checks:
  check_report: passed
  tests: passed
  governance_check: passed
  check_report_passed: 0
  check_report_warnings: 0
  check_report_failed: 0
check_results:
- check_id: <check_id>
  command: <command>
  result: passed
  evidence_ids:
  - <evidence_id>
evidence_manifest:
- evidence_id: <evidence_id>
  kind: <report|test_output|governance_check|artifact>
  path: <module-relative evidence path>
  sha256: <64-character lowercase sha256>
boundary_confirmations:
  automatic_acceptance_performed: false
  automatic_return_performed: false
  historical_evidence_rewritten: false
  prompt_contract_mutated: false
  rollout_or_production_write_performed: false
  module_write_scope_respected: true
semantic_fidelity:
  module_attests_requirement_results_complete: true
  human_blueprint_review_required: true
  execution_fingerprint_sufficient: false
publication:
  completion_commit_embedded: false
  remote_containment_claimed_by_packet: false
  external_publication_verification_required: true
  automatic_commit: false
  automatic_push: false
revision:
  supersedes_completion_id: null
  supersedes_packet_path: null
  revision_reason: null
promotion:
  state: candidate_reference_only
  normal_acceptance_allowed: false
  promotion_performed: false
integrity:
  algorithm: sha256
  payload_sha256: <canonical payload sha256>
  payload_hash_scope: canonical JSON of entire packet excluding integrity.payload_sha256

schema_version: forprint_evidence_access_v0_1
status: PILOT_LOCAL_ROOT_OPERATOR
physical_owner: root
expected_mode:
  directories: '0700'
  files: '0600'
path_policy:
  no_symlink_ancestors: true
  fixed_root_only: true
  reject_preexisting_unrecognized_root: true
allowed_interfaces:
  readonly:
    - inspect
    - propose
    - verify
  explicit_root_operator:

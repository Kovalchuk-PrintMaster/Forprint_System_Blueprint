  - auto_acceptance
  - auto_signing
  - git_publication
  - deletion
  - launch_dispatch
  - replacing_historical_evidence
recovery_and_backup:
  current: NOT_CONFIGURED
  next_required_milestone: independent_backup_plus_readback_restore_test
